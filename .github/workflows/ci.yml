# .github/workflows/ci.yml

name: Node.js CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Daily pulse so a Schneider download-portal change (they repackaged the
    # C-Gate zip once already, breaking fresh installs) is caught by the
    # cgate-download-check job even when nothing is pushed. Scheduled
    # workflows only run on the default branch.
    - cron: '23 4 * * *'

# Restrict the default GITHUB_TOKEN to read-only. No job here writes to the
# repository via GITHUB_TOKEN (artifact upload does not require contents:write).
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR) so the
# runner queue is not clogged by stale jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this change could possibly affect the built image or the
  # bridge's behaviour. Docs-only changes cost ~20 runner-minutes of QEMU image
  # builds and C-Gate container boots for no signal at all.
  #
  # Fail-safe by construction: every path that cannot produce a confident answer
  # (first push to a branch, force push, an unexpected event, a git failure)
  # returns true and runs the full suite. The cost of a wrong 'true' is wasted
  # minutes; the cost of a wrong 'false' is shipping untested code.
  changes:
    timeout-minutes: 5
    name: Detect build-relevant changes
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Full history so the merge-base below can be computed. A shallow
        # clone makes `git merge-base` fail, which this treats as "unknown"
        # and therefore runs everything.
        fetch-depth: 0

    - name: Compare against the base of this change
      id: filter
      env:
        # SHAs only, never a ref name: a branch name is attacker-controlled
        # text on a fork PR, and these values are interpolated into a shell.
        # They are also passed via env rather than inlined into the script.
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        set -uo pipefail

        run_everything() {
          echo "code=true" >> "$GITHUB_OUTPUT"
          echo "Running the full suite: $1"
          exit 0
        }

        case "${EVENT_NAME}" in
          pull_request)
            BASE="${PR_BASE_SHA}"
            # The checkout is a merge commit of the PR into its base, so diff
            # from the merge base rather than the base tip - otherwise
            # unrelated commits landing on master while the PR is open would
            # look like part of it.
            BASE=$(git merge-base "${BASE}" HEAD) || run_everything "could not find a merge base"
            ;;
          push)
            BASE="${PUSH_BEFORE_SHA}"
            ;;
          *)
            run_everything "unrecognised event '${EVENT_NAME}'"
            ;;
        esac

        # All-zeros is what GitHub sends for the first push to a new branch.
        if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]]; then
          run_everything "no usable base commit"
        fi
        if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
          run_everything "base commit ${BASE} is not in this clone (force push?)"
        fi

        CHANGED=$(git diff --name-only "${BASE}" "${HEAD_SHA}") \
          || run_everything "git diff against ${BASE} failed"

        if [[ -z "${CHANGED}" ]]; then
          run_everything "no files reported as changed"
        fi

        echo "Changed files:"
        echo "${CHANGED}" | awk '{print "  " $0}'

        # Everything is build-relevant EXCEPT documentation. Deliberately an
        # exclusion list rather than an inclusion list: a new top-level
        # directory then defaults to "relevant" instead of being silently
        # untested. homeassistant-addon/*.md ships inside the image but cannot
        # change behaviour, so it is excluded too.
        RELEVANT=$(echo "${CHANGED}" | grep -vE \
          -e '^docs/' \
          -e '^[^/]+\.md$' \
          -e '^homeassistant-addon/(DOCS|README|CHANGELOG|repository-README)\.md$' \
          -e '^\.github/ISSUE_TEMPLATE/' \
          -e '^\.github/(FUNDING\.yml|CODEOWNERS|PULL_REQUEST_TEMPLATE\.md)$' \
          || true)

        if [[ -n "${RELEVANT}" ]]; then
          echo "code=true" >> "$GITHUB_OUTPUT"
          echo "Build-relevant files changed:"
          echo "${RELEVANT}" | awk '{print "  " $0}'
        else
          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "Documentation-only change: image builds and integration legs will be skipped."
        fi

  # The shared gate. Reported as "quality / <job name>" - those prefixed names
  # are what master's branch protection requires, so renaming this job breaks
  # every required check until the protection contexts are updated too.
  quality:
    name: quality
    needs: changes
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/quality.yml
    with:
      run-expensive: ${{ needs.changes.outputs.code == 'true' }}
      expensive-skip-reason: 'this change touches documentation only'

  # Cheap check that Schneider still serves exactly what the install script
  # expects (portal move or repackage broke fresh installs once already).
  # SCHEDULED-RUN ONLY: on push/PR the integration legs already download and
  # checksum-verify the same URLs via the real installer in the same run, and
  # running this job concurrently with them got the runner IP rate-limited by
  # Schneider's IdP (idp.se.com "rate limit ... reached" HTML page instead of
  # a zip). Deliberately NOT in the required status checks: a failure is a
  # loud signal, but a third-party outage must not block merges.
  #
  # This is also the only job a scheduled run performs. The quality gate above
  # is skipped on schedule: re-running the whole pipeline daily against an
  # unchanged master proved nothing and cost ~20 runner-minutes a day.
  cgate-download-check:
    name: Verify C-Gate download (${{ matrix.cgate.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      # Serial legs: parallel downloads of two ~57MB zips from one runner IP
      # are what tripped Schneider's rate limit in the first place.
      max-parallel: 1
      matrix:
        cgate:
          - version: "3.3.1"
            url: "https://download.se.com/files?p_Doc_Ref=C-Gate_3_Linux_Package_V3.3.1"
            sha256: "a6959d862d2cc109ec049dceb9442560d576bc3d45bf3b1de7c5fbafbb478e6f"
          # The default leg reads URL + pinned sha256 out of cgate-install.sh
          # so the install script stays the single source of truth.
          - version: "default (install-script pin)"
            url: ""
            sha256: ""
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Resolve download URL and pinned checksum
      env:
        MATRIX_URL: ${{ matrix.cgate.url }}
        MATRIX_SHA256: ${{ matrix.cgate.sha256 }}
      run: |
        set -euo pipefail
        SCRIPT=homeassistant-addon/rootfs/etc/cont-init.d/cgate-install.sh
        URL="${MATRIX_URL}"
        SHA256="${MATRIX_SHA256}"
        if [[ -z "${URL}" ]]; then
          URL=$(grep -E '^CGATEWEB_DEFAULT_DOWNLOAD_URL=' "${SCRIPT}" | cut -d'"' -f2)
          SHA256=$(grep -E '^CGATEWEB_DEFAULT_DOWNLOAD_SHA256=' "${SCRIPT}" | cut -d'"' -f2)
        fi
        if [[ -z "${URL}" || -z "${SHA256}" ]]; then
          echo "::error::Could not resolve the download URL/checksum (matrix or ${SCRIPT})."
          exit 1
        fi
        echo "url=${URL}" >> "${GITHUB_ENV}"
        echo "expected_sha256=${SHA256}" >> "${GITHUB_ENV}"
        echo "URL:            ${URL}"
        echo "Pinned sha256:  ${SHA256}"

    - name: Download and verify C-Gate package
      env:
        URL: ${{ env.url }}
        EXPECTED_SHA256: ${{ env.expected_sha256 }}
      run: |
        set -uo pipefail
        # Every attempt logs the signals a real Schneider change would move, and
        # tools/classify-cgate-download.js turns them into one of: ok,
        # rate-limited, moved, corrupt, unavailable. Only the transient ones are
        # retried, and only the ones that mean users are affected fail the job.
        # Backoff is minutes, not seconds: Schneider's own message asks to
        # "retry after a few minutes", and the runner keeps the same IP.
        CLASSIFICATION=""
        REASON=""
        for attempt in 1 2 3; do
          echo "=== Download attempt ${attempt}/3: ${URL} ==="
          CURL_EXIT=0
          curl -sSL --max-time 600 --connect-timeout 30 -o cgate.zip \
            -w '%{http_code}\n%{url_effective}\n%{content_type}\n%{size_download}\n' \
            "${URL}" > curl-meta.txt 2>curl-err.txt || CURL_EXIT=$?
          cat curl-err.txt || true

          HTTP_STATUS=$(sed -n 1p curl-meta.txt)
          FINAL_URL=$(sed -n 2p curl-meta.txt)
          CONTENT_TYPE=$(sed -n 3p curl-meta.txt)
          BYTES=$(sed -n 4p curl-meta.txt)
          printf 'HTTP status:   %s\nFinal URL:     %s\nContent-Type:  %s\nBytes:         %s\n' \
            "${HTTP_STATUS}" "${FINAL_URL}" "${CONTENT_TYPE}" "${BYTES}"

          ACTUAL_SHA256=""
          if [[ -s cgate.zip ]]; then
            ACTUAL_SHA256=$(sha256sum cgate.zip | awk '{print $1}')
          fi

          # Values go in via env, and the verdict comes back as files. Nothing
          # derived from the response is ever eval'd: the redirect URL and page
          # body are attacker-influenceable, so shell-evaluating them would be
          # an injection with a network-controlled payload.
          mkdir -p classify-out
          HTTP_STATUS="${HTTP_STATUS}" FINAL_URL="${FINAL_URL}" \
            CONTENT_TYPE="${CONTENT_TYPE}" BODY_FILE=cgate.zip CURL_EXIT="${CURL_EXIT}" \
            EXPECTED_SHA256="${EXPECTED_SHA256}" ACTUAL_SHA256="${ACTUAL_SHA256}" \
            CLASSIFY_OUT_DIR=classify-out \
            node tools/classify-cgate-download.js
          CLASSIFICATION=$(cat classify-out/classification)
          REASON=$(cat classify-out/reason)

          echo "Attempt ${attempt}/3: ${CLASSIFICATION} — ${REASON}"
          [[ "${CLASSIFICATION}" == "ok" ]] && break
          # A move or a repackage will not fix itself; stop burning attempts.
          if [[ "${CLASSIFICATION}" == "moved" || "${CLASSIFICATION}" == "corrupt" ]]; then
            break
          fi
          [[ ${attempt} -lt 3 ]] && sleep 180
        done

        case "${CLASSIFICATION}" in
          ok)
            echo "C-Gate download verified: zip magic and checksum both match the pin."
            ;;
          rate-limited|unavailable)
            # Not a failure: Schneider is throttling or briefly down for THIS
            # runner IP. Users downloading from their own connections are
            # unaffected, so failing here would only block merges. Loud warning
            # so a permanent change still gets noticed.
            echo "::warning::C-Gate download could not be verified: ${REASON}"
            {
              echo "### C-Gate download check inconclusive"
              echo ""
              echo "\`${CLASSIFICATION}\` — ${REASON}"
              echo ""
              echo "This did not fail the build. Verified daily; investigate if it persists."
            } >> "$GITHUB_STEP_SUMMARY"
            ;;
          *)
            echo "::error::C-Gate download verification failed: ${REASON}"
            echo "::error::This one affects users: fresh installs download the same URL."
            exit 1
            ;;
        esac
