name: Build and Deploy Home Assistant Addon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DISTRIBUTION_REPO: 'dougrathbone/cgateweb-homeassistant'

# Restrict the default GITHUB_TOKEN to read-only. Cross-repo push and release
# creation use the HACS_DEPLOY_TOKEN PAT (legacy name: this is the add-on
# distribution deploy token, not a HACS listing), not GITHUB_TOKEN, so read is
# enough at the workflow level. The publish job grants contents:write so it can
# also create the source-repo GitHub Release.
permissions:
  contents: read

# Do not cancel in-progress deploys — overlapping tag pushes should queue,
# not abort a half-finished distribution publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate PRs run, called rather than copied. It used to be duplicated
  # here and had already drifted: this workflow was shellchecking fewer scripts
  # than ci.yml, so the serial-recovery helpers were linted on PRs but not on
  # the tag that shipped them. Sharing it makes that class of gap impossible.
  #
  # run-expensive is pinned true: a release always builds every architecture and
  # runs every integration leg, whatever the diff happens to contain.
  # require-upload-integration is true so a missing CGATE_UPLOAD_TEST_URL cannot
  # silently skip the upload-mode C-Gate leg on a tagged release.
  quality:
    name: quality
    uses: ./.github/workflows/quality.yml
    with:
      run-expensive: true
      require-upload-integration: true

  # Publish one architecture-specific tag per build, then combine them into the
  # generic multi-architecture image that config.yaml tells Supervisor to pull.
  # The release must not be advertised before every architecture exists.
  publish-images:
    name: Publish add-on image (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64, armv7, armhf, i386]

    steps:
    - name: Checkout source repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up QEMU (multi-arch emulation)
      if: matrix.arch != 'amd64'
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

    - name: Assemble add-on build context
      run: |
        mkdir -p ctx
        cp -r homeassistant-addon/rootfs ctx/
        cp homeassistant-addon/run.sh ctx/
        cp homeassistant-addon/Dockerfile ctx/
        cp -r src public ctx/
        cp index.js package.json package-lock.json ctx/

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

    - name: Log in to GitHub Container Registry
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

    - name: Build and publish image
      env:
        ARCH: ${{ matrix.arch }}
        VERSION: ${{ github.ref_name }}
      run: |
        VERSION=${VERSION#v}
        case "${ARCH}" in
          amd64) platform=linux/amd64 ;;
          aarch64) platform=linux/arm64 ;;
          armv7) platform=linux/arm/v7 ;;
          armhf) platform=linux/arm/v6 ;;
          i386) platform=linux/386 ;;
          *) echo "Unknown arch ${ARCH}"; exit 1 ;;
        esac
        # Same digest-pinned refs as build.yaml — do not hardcode the floating tag.
        BUILD_FROM=$(python3 -c "
import re, sys
arch = sys.argv[1]
text = open('homeassistant-addon/build.yaml', encoding='utf-8').read()
m = re.search(rf'(?m)^\\s*{re.escape(arch)}:\\s*\"([^\"]+)\"', text)
if not m:
    raise SystemExit(f'no build_from entry for {arch}')
print(m.group(1))
" "${ARCH}")
        docker buildx build \
          --platform "$platform" \
          --build-arg "BUILD_FROM=${BUILD_FROM}" \
          --build-arg "BUILD_ARCH=${ARCH}" \
          --build-arg "BUILD_VERSION=${VERSION}" \
          --build-arg "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          --build-arg "BUILD_REF=${GITHUB_SHA}" \
          --provenance=false \
          --push \
          -t "ghcr.io/dougrathbone/cgateweb:${VERSION}-${ARCH}" \
          ctx

  publish-manifest:
    name: Publish multi-architecture manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

    - name: Log in to GitHub Container Registry
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

    - name: Publish manifest
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        VERSION=${VERSION#v}
        docker buildx imagetools create \
          --tag "ghcr.io/dougrathbone/cgateweb:${VERSION}" \
          "ghcr.io/dougrathbone/cgateweb:${VERSION}-amd64" \
          "ghcr.io/dougrathbone/cgateweb:${VERSION}-aarch64" \
          "ghcr.io/dougrathbone/cgateweb:${VERSION}-armv7" \
          "ghcr.io/dougrathbone/cgateweb:${VERSION}-armhf" \
          "ghcr.io/dougrathbone/cgateweb:${VERSION}-i386"

    # Supervisor pulls without credentials, so a package that is not publicly
    # readable makes the advertised version uninstallable. A package published
    # from this workflow inherits the visibility of this public repository, so
    # this verifies that rather than trying to change it -- GITHUB_TOKEN cannot
    # set package visibility, and a step that tried returned 404 and failed the
    # v1.28.0 release after the images had already published successfully.
    #
    # Queried over the registry API with no credentials at all: `docker
    # buildx imagetools inspect` can pass on a private package by reusing the
    # login above from a credential helper.
    - name: Verify users can pull the image anonymously
      env:
        VERSION: ${{ github.ref_name }}
        EXPECTED_ARCH_COUNT: 5
      run: |
        VERSION=${VERSION#v}
        for attempt in 1 2 3 4 5; do
          token=$(curl -fsSL \
            "https://ghcr.io/token?scope=repository:dougrathbone/cgateweb:pull&service=ghcr.io" \
            | jq -r '.token') || token=""
          if [[ -n "$token" ]] && curl -fsSL \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -o manifest.json \
            "https://ghcr.io/v2/dougrathbone/cgateweb/manifests/${VERSION}"; then
            count=$(jq '.manifests | length' manifest.json)
            if [[ "$count" != "${EXPECTED_ARCH_COUNT}" ]]; then
              echo "::error::ghcr.io/dougrathbone/cgateweb:${VERSION} lists ${count} architectures, expected ${EXPECTED_ARCH_COUNT}."
              jq '[.manifests[].platform]' manifest.json
              exit 1
            fi
            echo "Anonymous pull OK: ${VERSION} serves ${count} architectures."
            exit 0
          fi
          sleep $((attempt * 5))
        done
        echo "::error::Could not read ghcr.io/dougrathbone/cgateweb:${VERSION} anonymously. Check the package is Public in Package settings."
        exit 1

  build-and-deploy:
    timeout-minutes: 20
    permissions:
      contents: write
    # Only publish to the distribution repo from semver tags. workflow_dispatch
    # still runs the quality gate above for manual verification, but must not
    # push timestamp versions onto distribution main.
    #
    # `needs: quality` alone enforces the gate now: if any job inside the called
    # workflow fails, quality fails and this job is skipped. The previous
    # always() plus six explicit result checks existed because integration-upload
    # is usually skipped, and a skipped upstream used to skip this job too. With
    # one upstream that reports success on skips, the plain form is correct.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-manifest
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Get version from tag
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
        else
          echo "::error::build-and-deploy is tag-only; refusing non-tag ref ${GITHUB_REF}"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Version: $VERSION"

    - name: Build distribution structure
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # HA addon repos require: repository.yaml at root, each addon in a subfolder
        mkdir -p distribution/cgateweb

        # Copy addon metadata files into the addon subfolder
        cp homeassistant-addon/config.yaml distribution/cgateweb/
        cp homeassistant-addon/Dockerfile distribution/cgateweb/
        cp homeassistant-addon/build.yaml distribution/cgateweb/
        cp homeassistant-addon/run.sh distribution/cgateweb/
        cp homeassistant-addon/DOCS.md distribution/cgateweb/
        cp homeassistant-addon/CHANGELOG.md distribution/cgateweb/
        cp homeassistant-addon/README.md distribution/cgateweb/
        cp homeassistant-addon/icon.png distribution/cgateweb/
        cp homeassistant-addon/logo.png distribution/cgateweb/

        # Copy translations
        cp -r homeassistant-addon/translations distribution/cgateweb/

        # Copy rootfs (s6-overlay services)
        cp -r homeassistant-addon/rootfs distribution/cgateweb/

        # Copy application source
        cp -r src distribution/cgateweb/
        cp -r public distribution/cgateweb/
        cp index.js distribution/cgateweb/
        cp package.json distribution/cgateweb/
        cp package-lock.json distribution/cgateweb/

        # Update version in config.yaml. Anchored and addressed on purpose: a
        # bare s/version: .*/ rewrites EVERY line containing "version: ",
        # including a comment or a ports_description string, which would emit a
        # second top-level version key into the file users install. Restricting
        # it to the first matching line at the top of the document keeps it to
        # the real key. Passed via env rather than interpolated into the script.
        node -e "
          const fs = require('fs');
          const p = 'distribution/cgateweb/config.yaml';
          const lines = fs.readFileSync(p, 'utf8').split('\n');
          const i = lines.findIndex((l) => /^version:/.test(l));
          if (i === -1) { console.error('no top-level version key in ' + p); process.exit(1); }
          lines[i] = 'version: \"' + process.env.VERSION + '\"';
          fs.writeFileSync(p, lines.join('\n'));
        "

        # Copy repository-level branding and documentation
        cp homeassistant-addon/logo.png distribution/
        cp homeassistant-addon/icon.png distribution/
        cp homeassistant-addon/repository-README.md distribution/README.md
        cp homeassistant-addon/LICENSE distribution/LICENSE
        cp homeassistant-addon/LICENSE distribution/cgateweb/LICENSE

        # Create repository.yaml at the distribution root. Built with printf so
        # the generated file can never inherit leading whitespace from the
        # surrounding YAML block indentation (a heredoc body would).
        {
          printf '%s\n' 'name: C-Gate Web Bridge Add-on Repository'
          printf '%s\n' 'url: https://github.com/dougrathbone/cgateweb-homeassistant'
          printf '%s\n' 'maintainer: Doug Rathbone <doug@dougrathbone.com>'
        } > distribution/repository.yaml

    # The validate step below runs tools/ scripts that require the `yaml`
    # devDependency. This job otherwise never installs anything - it only
    # copies files - so without this it fails on "Cannot find module 'yaml'".
    # That is exactly how v1.25.0's first publish attempt died: the validation
    # is tag-only, so it had never actually executed until a real release.
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Validate what we are about to publish, not just what we started from.
    # The source tree was already validated by the quality gate, but the
    # rendered copy has since been assembled and had its version rewritten -
    # and that rewrite is the one step capable of corrupting config.yaml. Users
    # install this file, so it is the one worth gating on.
    - name: Validate the rendered distribution config
      env:
        CGATEWEB_ADDON_DIR: distribution/cgateweb
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        node tools/validate-addon-config.js
        node tools/validate-translations.js
        node tools/validate-schema-i18n.js
        # And prove the rewrite produced exactly one version key, set correctly.
        COUNT=$(grep -c '^version:' distribution/cgateweb/config.yaml)
        if [[ "$COUNT" != "1" ]]; then
          echo "::error::rendered config.yaml has ${COUNT} top-level version keys, expected 1"
          exit 1
        fi
        if ! grep -qx "version: \"${VERSION}\"" distribution/cgateweb/config.yaml; then
          echo "::error::rendered config.yaml version is not ${VERSION}"
          grep '^version:' distribution/cgateweb/config.yaml
          exit 1
        fi
        echo "Rendered distribution config validated at version ${VERSION}."

    - name: Checkout or initialize distribution repository
      env:
        HACS_DEPLOY_TOKEN: ${{ secrets.HACS_DEPLOY_TOKEN }}
        DIST_REPO: ${{ env.DISTRIBUTION_REPO }}
      run: |
        # Token is exposed only via env, never substituted into the rendered
        # workflow command line - prevents log leakage if `set -x` ever fires.
        REMOTE_URL="https://x-access-token:${HACS_DEPLOY_TOKEN}@github.com/${DIST_REPO}.git"
        if git clone "${REMOTE_URL}" hacs-repo 2>/dev/null; then
          cd hacs-repo
          if git show-ref --verify --quiet refs/heads/main; then
            git checkout main
          elif git show-ref --verify --quiet refs/heads/master; then
            git checkout master
            git branch -m master main
          else
            git checkout -b main
          fi
        else
          mkdir hacs-repo
          cd hacs-repo
          git init --initial-branch=main
          git remote add origin "${REMOTE_URL}"
        fi

        git config user.name 'cgateweb-bot'
        git config user.email 'actions@github.com'

    - name: Deploy to distribution repository
      env:
        VERSION: ${{ steps.version.outputs.version }}
        SOURCE_REPO: ${{ github.repository }}
        SOURCE_SHA: ${{ github.sha }}
      run: |
        cd hacs-repo

        # Clear existing content (except .git)
        find . -mindepth 1 -name '.git' -prune -o -type f -exec rm {} + 2>/dev/null || true
        find . -mindepth 1 -name '.git' -prune -o -type d -exec rm -rf {} + 2>/dev/null || true

        # Copy new distribution files
        cp -r ../distribution/* .

        git add .

        if git diff --staged --quiet; then
          echo "No changes to deploy"
          exit 0
        fi

        git commit -m "Release v${VERSION}

        Source: ${SOURCE_REPO}@${SOURCE_SHA}"

        if ! git push -u origin main; then
          echo "Failed to push to distribution repository"
          exit 1
        fi

    - name: Write source-repo release notes from the changelog
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: node tools/extract-changelog.js "$VERSION" > source-release-notes.md

    - name: Create source-repo GitHub Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        body_path: source-release-notes.md
        draft: false
        prerelease: false

    - name: Create distribution-repo GitHub Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
      with:
        repository: ${{ env.DISTRIBUTION_REPO }}
        token: ${{ secrets.HACS_DEPLOY_TOKEN }}
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        body: |
          ## C-Gate Web Bridge v${{ steps.version.outputs.version }}

          Home Assistant add-on release. Add this repository in the Supervisor
          Add-on Store, not in HACS.

          ### Installation

          1. Add repository: `https://github.com/dougrathbone/cgateweb-homeassistant`
          2. Install "C-Gate Web Bridge" from the add-on store
          3. Set C-Gate host and project, then start

          ### Changes

          See [source repository release notes](https://github.com/dougrathbone/cgateweb/releases/tag/v${{ steps.version.outputs.version }}).

          ---
          Source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        draft: false
        prerelease: false
