version: 2
updates:
  # Application dependencies. Grouped so dev-tooling bumps land in one PR.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"

  # GitHub Actions are SHA-pinned; Dependabot keeps the pins (and their version
  # comments) current. Grouped into a single weekly PR to reduce noise.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images are digest-pinned in the Dockerfiles. Dependabot refreshes those
  # digests; build.yaml arch entries still need a manual/scripted bump when the
  # HA base tags move (Dependabot does not read build.yaml).
  - package-ecosystem: "docker"
    directory: "/homeassistant-addon"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/test-env"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
