name: "C-Gate Web Bridge"
version: "1.32.0"
slug: cgateweb
description: "Bridge between Clipsal C-Bus systems and MQTT/Home Assistant"
url: "https://github.com/dougrathbone/cgateweb"
image: "ghcr.io/dougrathbone/cgateweb"
# Supervisor warns that armhf/armv7/i386 are deprecated arch values (#44). They
# are kept deliberately: the per-arch base images they build from are still
# published, and dropping them would cut off updates for anyone on a 32-bit
# Home Assistant install. Revisit when HA stops publishing those bases.
#
# This is also why build.yaml remains for local and CI builds. Folding the base
# image into the Dockerfile would mean one BUILD_FROM default, while the 32-bit
# architectures still require their own Home Assistant base image.
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

startup: application
boot: auto
init: false
host_network: false
ingress: true
ingress_port: 8080
panel_icon: "mdi:label-outline"
panel_title: "C-Bus Labels"

# Supervisor restarts the add-on when this probe fails. The Dockerfile also has
# a HEALTHCHECK against the same port, but Supervisor does not consume Docker
# healthchecks for add-ons - it uses this key - so without it a wedged add-on
# was left running and Home Assistant still showed it as "Started". The web
# server binds only after settings load and MQTT/C-Gate wiring is up, so a
# refused connection here is a real failure rather than a slow start. The
# Dockerfile's 180s start-period covers managed mode downloading C-Gate.
watchdog: "tcp://[HOST]:[PORT:8080]"

ports:
  "8080/tcp": null
  "20023/tcp": null
  "20024/tcp": null
  "20025/tcp": null
  # C-Gate's SSL equivalents. It already listens on these in managed mode, but
  # Home Assistant can only publish ports the add-on declares, so without these
  # entries there was no way to reach them from a PC — which is what blocks
  # current C-Bus Toolkit, since it connects to a remote C-Gate over SSL only
  # (#57, #58). Still null by default: declaring a port does not publish it.
  "20123/tcp": null
  "20124/tcp": null
  "20125/tcp": null

ports_description:
  "8080/tcp": "C-Bus Label Editor web interface (optional; ingress works without host mapping — set web_api_key if you expose this port)"
  "20023/tcp": "C-Gate command port (managed mode only). Home Assistant can only map ports declared by the add-on, so exposing C-Gate to external clients requires leaving cgate_port at its default 20023 -- a custom cgate_port cannot be mapped here. C-Gate has NO authentication: list allowed addresses in cgate_external_clients before publishing this."
  "20024/tcp": "C-Gate event port (managed mode only). C-Gate has NO authentication: list allowed addresses in cgate_external_clients before publishing this."
  "20025/tcp": "C-Gate status change port (managed mode only). C-Gate has NO authentication: list allowed addresses in cgate_external_clients before publishing this."
  "20123/tcp": "C-Gate command port over SSL (managed mode only). Map this if you want to connect C-Bus Toolkit to the managed C-Gate: current Toolkit versions only reach a remote C-Gate over SSL. Experimental and unconfirmed -- please report success or failure on GitHub issue #58. C-Gate has NO authentication: list allowed addresses in cgate_external_clients before publishing this."
  "20124/tcp": "C-Gate event port over SSL (managed mode only). C-Gate has NO authentication: list allowed addresses in cgate_external_clients before publishing this."
  "20125/tcp": "C-Gate status change port over SSL (managed mode only). C-Gate has NO authentication: list allowed addresses in cgate_external_clients before publishing this."

homeassistant_api: true

# Map host UART/serial devices into the container so the opt-in alpha
# USB-serial PCI passthrough (cgate_serial_device, issue #28) can work.
uart: true

services:
  - mqtt:want

# `homeassistant_config` replaces the deprecated `config` option. It mounts the
# same host directory, but at /homeassistant rather than /config — see
# LEGACY_ADDON_LABEL_FILE in src/constants.js for how saved label paths are
# carried across (#44).
map:
  - "homeassistant_config:rw"
  - "share:ro"

# ─── Options ────────────────────────────────────────────────────────
# Only fields listed here appear in the UI by default.
# All other fields (marked with ? in schema) can be added by the user
# via "Show unused optional configuration options" in the HA UI.
options:
  # ── Required: C-Gate Connection ──
  cgate_mode: "remote"
  cgate_host: ""
  cgate_project: "HOME"

  # ── Common: Home Assistant Discovery ──
  ha_discovery_enabled: true

  # ── Common: Logging ──
  log_level: "info"

  # ── Array fields require defaults for upgrade compatibility ──
  # HA Supervisor validates these exist in saved config; without defaults
  # here, users upgrading from older versions get a validation error.
  getall_networks:
    - 254
  getall_app_periods: []
  ha_discovery_networks:
    - 254
  ha_discovery_auto_type_cover_keywords:
    - blind
    - shutter
    - shade
    - awning
    - curtain
    - roller
    - garage door
  web_allowed_origins: []
  # Object lists cannot be optional, so this needs a default here. Empty means
  # localhost-only access, identical to previous releases.
  cgate_external_clients: []

# ─── Schema ─────────────────────────────────────────────────────────
# Fields without ? are required. Fields with ? are optional and hidden
# from the UI unless the user adds them or they appear in options above.
schema:
  # ── C-Gate Connection (required) ──
  cgate_mode: "list(remote|managed)"
  cgate_host: "str"
  cgate_project: "str"
  cgate_port: "int(1,65535)?"
  cgate_event_port: "int(1,65535)?"

  # ── C-Gate Managed Mode ──
  cgate_install_source: "list(download|upload)?"
  cgate_download_url: "str?"
  cgate_download_sha256: "str?"
  cgate_force_reinstall: "bool?"
  # USB-serial PCI passthrough (beta, issue #28): opt-in. The device schema
  # type makes the Supervisor render a dropdown of detected serial devices.
  # Deliberately absent from options above so upgrades never write it into
  # existing configs.
  cgate_serial_device: "device(subsystem=tty)?"
  # External C-Gate access (issue #37). C-Gate is a multi-client server, so
  # Toolkit connects to the managed instance rather than sharing the PCI.
  # An octet of 255 matches any value: 192.168.1.255 is the whole subnet.
  cgate_external_clients:
    - address: "str"
      level: "list(monitor|operate|program)"

  # ── MQTT (auto-detected from Mosquitto add-on) ──
  mqtt_host: "str?"
  mqtt_port: "int(1,65535)?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  mqtt_use_tls: "bool?"
  mqtt_ca_file: "str?"
  mqtt_reject_unauthorized: "bool?"

  # ── C-Bus Monitoring ──
  auto_discover_networks: "bool?"
  getall_networks: ["int(1,255)"]
  getall_on_start: "bool?"
  getall_period: "int(60,86400)?"
  getall_app_periods:
    - app_id: "str"
      period_sec: "int(0,86400)"

  # ── MQTT Publishing ──
  retain_reads: "bool?"
  message_interval: "int(100,10000)?"

  # ── Logging ──
  log_level: "list(debug|info|warn|error)"

  # ── Home Assistant Discovery ──
  ha_discovery_enabled: "bool"
  ha_discovery_prefix: "str?"
  ha_discovery_networks: ["int(1,255)"]
  ha_discovery_cover_app_id: "int(1,255)?"
  ha_discovery_cover_tilt_app_id: "int(1,255)?"
  ha_discovery_switch_app_id: "int(1,255)?"
  ha_discovery_relay_app_id: "int(1,255)?"
  ha_discovery_pir_app_id: "int(1,255)?"
  ha_discovery_unlisted_groups: "bool?"
  ha_discovery_trigger_app_id: "int(1,255)?"
  ha_discovery_scene_enabled: "bool?"
  ha_discovery_auto_type: "bool?"
  ha_discovery_auto_type_name_heuristics: "bool?"
  ha_discovery_type_from_label_prefix: "bool?"
  ha_discovery_type_from_unit: "bool?"
  ha_discovery_auto_type_cover_keywords: ["str"]
  ha_discovery_hvac_app_id: "int(1,255)?"
  cbus_aircon_app_id: "int(1,255)?"
  cbus_aircon_control_enabled: "bool?"
  # Security application zone sensors (default 208). String so 0 can disable
  # it — an int(1,255) schema would reject the disable value.
  cbus_security_app_id: "str?"
  cbus_security_control_enabled: "bool?"
  cbus_security_disarm_enabled: "bool?"
  cbus_security_bypass_enabled: "bool?"
  # Measurement application (default 228/$E4). Gates both reading
  # "measurement data ..." events to MQTT and injecting readings via
  # cbus/write/.../data — see docs/Measurement Application.md.
  cbus_measurement_app_id: "int(1,255)?"
  cbus_clock_enabled: "bool?"
  cbus_scene_module_enabled: "bool?"
  # Enable Control extra verbs (typically 203/$CB). Optional; omit from
  # options. SET/LABEL/REMOVE MQTT writes only — no HA entities.
  cbus_enable_control_app_id: "int(1,255)?"
  ha_hvac_temperature_unit: "list(C|F)?"

  # ── Bridge Diagnostics ──
  ha_bridge_diagnostics_enabled: "bool?"
  ha_bridge_diagnostics_interval_sec: "int(10,3600)?"

  # ── Stale Device Detection ──
  stale_device_detection_enabled: "bool?"
  stale_device_threshold_hours: "int(1,720)?"
  stale_device_check_interval_sec: "int(60,86400)?"

  # ── C-Bus Network (CNI) Monitoring ──
  cni_offline_notification: "bool?"

  # ── Advanced: Connection Pool ──
  connection_pool_size: "int(1,10)?"
  connection_health_check_interval_sec: "int(5,300)?"
  connection_keep_alive_interval_sec: "int(10,600)?"

  # ── Advanced: Cover Ramp ──
  cover_ramp_duration_sec: "int(1,300)?"

  # ── Advanced: Label File & Web API ──
  cbus_label_file: "str?"
  web_api_key: "password?"
  web_allow_unauthenticated_mutations: "bool?"
  web_allowed_origins: ["str"]
  web_mutation_rate_limit_per_minute: "int(1,5000)?"
