configuration:
  cgate_mode:
    name: C-Gate Modus
    description: >-
      Hoe C-Gate wordt aangeboden. "remote" maakt verbinding met een C-Gate
      server die elders op uw netwerk draait (meest voorkomend). "managed"
      downloadt en draait C-Gate lokaal binnen deze add-on.
  cgate_host:
    name: C-Gate Host (verplicht)
    description: >-
      IP-adres of hostnaam van uw C-Gate server. In de externe modus het adres
      van de machine met C-Gate invoeren. In de beheerde modus 127.0.0.1
      gebruiken.
  cgate_project:
    name: C-Gate Projectnaam (verplicht)
    description: >-
      De naam van uw C-Bus project zoals geconfigureerd in C-Gate (bijv. HOME,
      MYHOUSE). Vind dit in C-Gate Toolkit onder uw projectboom.
  ha_discovery_enabled:
    name: Home Assistant Discovery inschakelen
    description: >-
      Registreer C-Bus apparaten automatisch bij Home Assistant met MQTT
      Discovery. De meeste gebruikers moeten dit ingeschakeld laten. Apparaten
      verschijnen als entiteiten zonder handmatige YAML-configuratie.
  log_level:
    name: Logniveau
    description: >-
      Logboekuitgebreidheid. Gebruik "info" voor normaal gebruik, "debug" voor
      het oplossen van verbindings- of discovery-problemen.
  cgate_port:
    name: C-Gate Commandopoort
    description: >-
      TCP-poort voor C-Gate commandoverbindingen. Alleen wijzigen als uw C-Gate
      een niet-standaard poort gebruikt. Standaard: 20023.
  cgate_event_port:
    name: C-Gate Gebeurtenispoort
    description: >-
      TCP-poort voor C-Gate gebeurtenisverbindingen. Alleen wijzigen als uw
      C-Gate een niet-standaard poort gebruikt. Standaard: 20025.
  cgate_install_source:
    name: C-Gate Installatiebron
    description: >-
      Alleen gebruikt in beheerde modus. "download" haalt C-Gate automatisch op.
      "upload" zoekt naar een zipbestand dat u in /share/cgate/ plaatst.
  cgate_download_url:
    name: C-Gate Download URL
    description: >-
      Alleen gebruikt in beheerde modus met downloadbron. Overschrijf als de
      officiële Clipsal download-URL wijzigt. Laat leeg voor de standaard-URL.
  cgate_download_sha256:
    name: C-Gate Download SHA256
    description: >-
      Optionele SHA256-checksum om de C-Gate download te verifiëren. Aanbevolen
      bij gebruik van een aangepaste download-URL.
  cgate_force_reinstall:
    name: C-Gate herinstallatie forceren
    description: >-
      Alleen gebruikt in managed-modus. Eenmaal geïnstalleerd blijft C-Gate
      normaal gesproken ongewijzigd. Schakel dit in om C-Gate bij de volgende
      start opnieuw te installeren/bij te werken vanaf de installatiebron (uw
      projectdatabases en configuratie blijven behouden); in upload-modus kunt u
      in plaats daarvan een nieuwere zip in /share/cgate plaatsen. Schakel dit
      na de upgrade weer uit.
  cgate_serial_device:
    name: Serieel PCI-apparaat (beta)
    description: >-
      BETA: ondersteuning voor USB-seriële pc-interfaces (5500PC/5500PCU) —
      getest met beide interfaces. Selecteer een gedetecteerd serieel apparaat
      in de vervolgkeuzelijst; gebruik bij voorkeur paden onder
      /dev/serial/by-id/. Om een aangepast pad in te voeren, schakelt u de
      configuratie-editor over naar de YAML-modus. Vereist de managed-modus en
      een C-Bus Toolkit-project dat is geconfigureerd voor een seriële
      pc-interface. Meld problemen op GitHub (issue #28).
  cgate_external_clients:
    name: Externe C-Gate-clients
    description: >-
      Adressen die verbinding mogen maken met de beheerde C-Gate, voor tools
      zoals C-Bus Toolkit. Laat leeg om alleen deze add-on toe te staan. C-Gate
      heeft geen authenticatie, en het niveau program staat herprogrammering van
      C-Bus-eenheden toe, dus geef specifieke adressen op in plaats van een heel
      subnet. Een octet met de waarde 255 komt overeen met elke waarde, dus
      192.168.1.255 betekent het hele netwerk 192.168.1.x. U moet ook de poorten
      van C-Gate publiceren in het netwerkpaneel.
  mqtt_host:
    name: MQTT Broker Host
    description: >-
      Automatisch gedetecteerd via de Mosquitto add-on — de meeste gebruikers
      moeten dit leeg laten. Alleen instellen bij gebruik van een externe MQTT
      broker.
  mqtt_port:
    name: MQTT Broker Poort
    description: >-
      Automatisch gedetecteerd via de Mosquitto add-on. Alleen instellen voor
      externe brokers. Standaard: 1883.
  mqtt_username:
    name: MQTT Gebruikersnaam
    description: >-
      Automatisch gedetecteerd via de Mosquitto add-on. Alleen instellen voor
      externe brokers of om inloggegevens te overschrijven.
  mqtt_password:
    name: MQTT Wachtwoord
    description: >-
      Automatisch gedetecteerd via de Mosquitto add-on. Alleen instellen voor
      externe brokers of om inloggegevens te overschrijven.
  mqtt_use_tls:
    name: MQTT TLS inschakelen
    description: >-
      Verbinden met MQTT via TLS (mqtts://). Inschakelen voor brokers die
      versleutelde verbindingen vereisen (meestal poort 8883). Niet nodig voor
      de standaard Mosquitto add-on.
  mqtt_ca_file:
    name: MQTT CA-certificaatbestand
    description: >-
      Pad naar CA-certificaat voor het verifiëren van het TLS-certificaat van de
      broker. Meestal opgeslagen in /ssl/ (bijv. /ssl/ca.crt). Alleen nodig voor
      zelfondertekende certificaten.
  mqtt_reject_unauthorized:
    name: MQTT TLS-certificaat verifiëren
    description: >-
      Verbindingen weigeren als het TLS-certificaat van de broker niet
      geverifieerd kan worden. Ingeschakeld houden voor beveiliging. Alleen
      uitschakelen voor zelfondertekende certificaten zonder CA-bestand.
  auto_discover_networks:
    name: C-Bus netwerken automatisch ontdekken
    description: >-
      Automatisch netwerk-ID's ontdekken van C-Gate bij verbinding. Ontdekte
      netwerken worden gebruikt voor polling en HA Discovery. Alleen
      uitschakelen als auto-ontdekking problemen veroorzaakt. Standaard:
      ingeschakeld.
  getall_networks:
    name: Te monitoren C-Bus netwerken
    description: >-
      C-Bus netwerk-ID's om apparaatstatussen op te vragen. Standaard: 254
      (standaard C-Bus netwerk voor de meeste installaties). Vind uw
      netwerk-ID's in C-Gate Toolkit onder uw projectboom.
  getall_on_start:
    name: Alle apparaten opvragen bij opstarten
    description: >-
      Alle apparaatstatussen opvragen wanneer de add-on start, om Home Assistant
      te synchroniseren met de huidige C-Bus status. Standaard: ingeschakeld.
  getall_period:
    name: Opvraaginterval (seconden)
    description: >-
      Hoe vaak alle apparaatstatussen opnieuw worden opgevraagd. Lagere waarden
      = actuelere statussen maar meer C-Gate verkeer. Standaard: 3600 (1 uur).
  getall_app_periods:
    name: Opvraagintervallen per applicatie
    description: >-
      Het opvraaginterval overschrijven voor specifieke C-Bus applicaties. Elke
      vermelding heeft een app_id (bijv. "56" voor Verlichting) en period_sec (0
      om uit te schakelen).
  retain_reads:
    name: MQTT Statusberichten bewaren
    description: >-
      De MQTT retain-vlag instellen op statusberichten zodat nieuwe abonnees
      direct de laatst bekende apparaatstatus ontvangen. Standaard:
      uitgeschakeld.
  message_interval:
    name: Commando-interval (ms)
    description: >-
      Minimale vertraging tussen commando's naar C-Gate. Voorkomt overbelasting
      van C-Gate met snelle commando's. Standaard: 200ms.
  ha_discovery_prefix:
    name: Discovery Topicprefix
    description: >-
      MQTT topicprefix voor HA Discovery berichten. Moet overeenkomen met uw
      Home Assistant MQTT Discovery prefix. Standaard: homeassistant.
  ha_discovery_networks:
    name: Discovery Netwerken
    description: >-
      C-Bus netwerk-ID's om te scannen voor apparaatdetectie. Indien leeg,
      worden de netwerken uit "Te monitoren C-Bus netwerken" gebruikt.
      Standaard: 254.
  ha_discovery_cover_app_id:
    name: Cover Applicatie-ID
    description: >-
      C-Bus app-ID voor covers (rolluiken, jaloezieën, garagedeuren).
      Veelgebruikte waarde: 203 (Enable Control). Laat leeg om cover-detectie
      over te slaan.
  ha_discovery_cover_tilt_app_id:
    name: Cover Kantel Applicatie-ID
    description: >-
      C-Bus app-ID voor kantelbesturing van jaloezieën. Gekoppeld op
      groepsnummer aan covers. Laat leeg om kanteling over te slaan.
  ha_discovery_switch_app_id:
    name: Schakelaar Applicatie-ID
    description: >-
      C-Bus app-ID voor schakelaargroepen. Laat leeg om schakelaar-detectie over
      te slaan.
  ha_discovery_relay_app_id:
    name: Relais Applicatie-ID
    description: >-
      C-Bus app-ID waarvan groepen relais-schakelaars worden (apparaatklasse
      stopcontact). Laat leeg om over te slaan.
  ha_discovery_pir_app_id:
    name: PIR Applicatie-ID
    description: >-
      C-Bus app-ID waarvan groepen bewegings-binary_sensors worden. Onderdrukt
      ook niveaumeting voor die app. Laat leeg om over te slaan.
  ha_discovery_unlisted_groups:
    name: Onvermelde groepen ontdekken
    description: >-
      Maakt een Home Assistant-entiteit aan de eerste keer dat een lichtgroep op
      de bus verschijnt, ook als die ontbreekt in het Toolkit-project. Standaard
      uit: scène-adressen verschijnen ook, en retained discovery-configs moet je
      handmatig van de broker halen.
  ha_discovery_trigger_app_id:
    name: Trigger Applicatie-ID
    description: >-
      C-Bus app-ID voor triggergroepen (keypads, scènes). Veelgebruikte waarde:
      202. Laat leeg om trigger-detectie over te slaan.
  ha_discovery_scene_enabled:
    name: Scène-entiteiten inschakelen
    description: >-
      Een Home Assistant scène-entiteit aanmaken voor elke triggergroep, naast
      gebeurtenis- en knop-entiteiten. Standaard: ingeschakeld.
  ha_discovery_auto_type:
    name: Auto-detect Device Types
    description: >-
      Automatically classify Lighting (56) groups whose label looks like a
      motorised cover (blind, shutter, etc.) as Home Assistant cover entities
      instead of lights. Manual type overrides always take precedence. Default:
      enabled.
  ha_discovery_auto_type_name_heuristics:
    name: Auto-detect Using Label Keywords
    description: >-
      When auto-detection is on, match cover keywords in the group label. Turn
      off to disable keyword matching while keeping other auto-detection.
      Default: enabled.
  ha_discovery_auto_type_cover_keywords:
    name: Cover Detection Keywords
    description: >-
      Case-insensitive keywords in a Lighting group label that mark it as a
      cover (matching also catches plurals). Defaults: blind, shutter, shade,
      awning, curtain, roller, garage door.
  ha_discovery_hvac_app_id:
    name: HVAC Applicatie-ID
    description: >-
      C-Bus app-ID voor een verlichtingscompatibele HVAC-groep
      (PAC/touchscreen-blootgesteld). NIET de native Air Conditioning app 172 —
      gebruik alleen voor groepen die door een PAC of touchscreen worden
      gespiegeld op een verlichtingsstijl app. Laat leeg om HVAC-detectie over
      te slaan.
  ha_hvac_temperature_unit:
    name: HVAC Temperatuureenheid
    description: >-
      Temperatuureenheid voor HVAC klimaat-entiteiten. C voor Celsius, F voor
      Fahrenheit. Standaard: C.
  cbus_aircon_app_id:
    name: Applicatie-ID voor airconditioning
    description: >-
      C-Bus Air Conditioning applicatie-id (bijv. 172) voor native alleen-lezen
      kamertemperatuur. Decodeert zone_temperature-broadcasts en publiceert
      current_temperature naar
      cbus/read/{network}/172/{zone}/current_temperature. Standaard
      uitgeschakeld.
  cbus_aircon_control_enabled:
    name: Airconditioning-besturing
    description: >-
      Sta Home Assistant toe om native C-Bus-thermostaten te bedienen (modus en
      temperatuur). Standaard uitgeschakeld — het schrijft naar de actieve
      verwarming/koeling. Vereist een ingestelde airconditioning-applicatie-id.
  cbus_security_app_id:
    name: Beveiligingsapplicatie-id
    description: >-
      C-Bus-beveiligingsapplicatie-id (standaard 208) voor alarmzonesensoren.
      Publiceert één binaire sensor per zone — sealed is uit; unsealed, open of
      short is aan — en synchroniseert de zonestatus bij verbinding. Stel in op
      0 om uit te schakelen.
  cbus_security_control_enabled:
    name: Alarmpaneel-bediening
    description: >-
      Sta Home Assistant toe het alarmsysteem in te schakelen (away, night,
      home, vacation). Alleen inschakelen: C-Bus heeft geen uitschakelcommando,
      dus de Disarm-knop in Home Assistant doet niets. Standaard uitgeschakeld:
      het arm-commando bevat geen PIN op de C-Bus, dus alles wat op het
      commando-topic kan publiceren kan uw alarmsysteem inschakelen. Vereist een
      ingestelde beveiligingsapplicatie-id.
  cbus_security_disarm_enabled:
    name: Alarm uitschakelen
    description: >-
      Sta Home Assistant ook toe het alarmsysteem uit te schakelen. Vereist
      Alarmpaneel-bediening. Standaard uitgeschakeld. C-Bus heeft geen
      uitschakelcommando, dus de pincode wordt via toetsenbordemulatie op het
      paneel ingevoerd: Home Assistant toont een eigen toetsenblok en stuurt uw
      invoer via MQTT. De pincode wordt nergens opgeslagen, maar gaat bij elke
      uitschakeling via uw MQTT-broker. Schakel dit alleen in op een broker die
      u vertrouwt, bij voorkeur met TLS.
  cbus_security_bypass_enabled:
    name: Inschakelen forceren bij open zones
    description: >-
      Sta Home Assistant toe het inschakelen te forceren terwijl een zone open
      is, met de #-toets van het paneel. Vereist Alarmpaneel-bediening.
      Standaard uitgeschakeld. Bewust gescheiden van inschakelen: een alarm dat
      is ingeschakeld met een open deur lijkt ingeschakeld maar bewaakt die deur
      niet, dus dat hoort een bewuste keuze te zijn. Gebeurt nooit automatisch.
  cbus_measurement_app_id:
    name: Meettoepassing-ID
    description: >-
      C-Bus Meettoepassing-id (standaard 228) voor analoge/numerieke
      sensormetingen (temperatuur, vermogen, lichtniveau, enz). Publiceert
      cbus/read/{network}/228/{device}/{channel}/value en /unit, en accepteert
      geïnjecteerde metingen op cbus/write/{network}/228/{device}/{channel}/data
      (payload "value,multiplier,units") — bijvoorbeeld voor gescripte/virtuele
      sensoren. Standaard uitgeschakeld.
  cbus_clock_enabled:
    name: C-Bus netwerkklok
    description: >-
      Decodeert klok-uitzendingen (app 223) als twee diagnosesensoren en vraagt
      C-Gate bij verbinden om een verversing. Alleen lezen: de netwerkklok wordt
      nooit gezet. Standaard uit omdat het berichtformaat op weinig live
      captures rust.
  cbus_scene_module_enabled:
    name: Scene Module-commando's
    description: >-
      Accepteert MQTT-commando's om scènes op een C-Bus Scene Module af te
      spelen of op te nemen. Standaard uit: de meeste installs gebruiken Trigger
      Control, en opnemen overschrijft het modulegeheugen.
  cbus_enable_control_app_id:
    name: Enable Control-toepassings-ID
    description: >-
      C-Bus Enable Control-toepassings-ID (meestal 203) voor MQTT-writes set,
      label en remove. Leeg laten om uit te schakelen. Remove verwijdert het
      C-Gate-groepsobject — publiceer ON op het remove-topic. Labels zijn
      hex-gecodeerd. Er worden geen Home Assistant-entiteiten aangemaakt.
  cbus_raw_event_log_apps:
    name: Apps voor ruwe-eventopname
    description: >-
      C-Bus-app-ID's waarvan ruwe C-Gate-eventregels worden gelogd en opnieuw
      gepubliceerd op het raw-MQTT-topic. Leeg schakelt uit. Luidruchtig; laat
      leeg bij normaal gebruik.
  ha_bridge_diagnostics_enabled:
    name: Bridge Diagnostiek inschakelen
    description: >-
      Bridge-gezondheidsentiteiten (gereedstatus, verbindingen, wachtrijdiepte)
      publiceren naar Home Assistant. Standaard: ingeschakeld.
  ha_bridge_diagnostics_interval_sec:
    name: Diagnostiekinterval (seconden)
    description: "Hoe vaak bridge-diagnostiekstatussen worden vernieuwd. Standaard: 60."
  cni_offline_notification:
    name: CNI-offline melding
    description: >-
      Een Home Assistant-melding tonen als de CNI/PCI-verbinding van een
      C-Bus-netwerk offline gaat, en deze verwijderen bij herverbinding. Vereist
      de Home Assistant add-on-omgeving. Standaard uitgeschakeld.
  stale_device_detection_enabled:
    name: Detectie van verouderde apparaten inschakelen
    description: >-
      C-Bus apparaten detecteren die stoppen met rapporteren en een
      waarschuwingssensor publiceren. Standaard: ingeschakeld.
  stale_device_threshold_hours:
    name: Drempel voor verouderd apparaat (uren)
    description: >-
      Uren zonder statusupdate voordat een apparaat als verouderd wordt
      beschouwd. Standaard: 24.
  stale_device_check_interval_sec:
    name: Controle-interval voor verouderde apparaten (seconden)
    description: "Hoe vaak er wordt gezocht naar verouderde apparaten. Standaard: 3600 (1
      uur)."
  connection_pool_size:
    name: Verbindingspool grootte
    description: >-
      Aantal parallelle TCP-verbindingen naar C-Gate. Verhogen voor installaties
      met hoge doorvoer, verlagen naar 1 voor ouder C-Gate. Standaard: 3.
  connection_health_check_interval_sec:
    name: Gezondheidscontrole-interval (seconden)
    description: "Hoe vaak wordt gecontroleerd of C-Gate verbindingen gezond zijn.
      Standaard: 30."
  connection_keep_alive_interval_sec:
    name: Keep-Alive-interval (seconden)
    description: >-
      Hoe vaak C-Gate verbindingen worden gepingd. Voorkomt stille TCP-verbroken
      verbindingen. Standaard: 60.
  cover_ramp_duration_sec:
    name: Cover Rampduur (seconden)
    description: >-
      Verwachte tijd voor een cover om volledig te openen/sluiten. De bridge
      publiceert geschatte posities tijdens dit venster. Standaard: 5.
  cbus_label_file:
    name: Aangepast labelbestand
    description: >-
      Pad naar een JSON-bestand met aangepaste apparaatnamen. Automatisch
      gedetecteerd van gangbare paden indien niet ingesteld. Het bestand wordt
      bewaakt op wijzigingen.
  web_api_key:
    name: Web API-sleutel
    description: >-
      API-sleutel voor schrijfbewerkingen in de label-editor. Stel dit in
      wanneer poort 8080 buiten HA ingress wordt blootgesteld.
  web_allow_unauthenticated_mutations:
    name: Ongeauthenticeerde webschrijfbewerkingen toestaan (onveilig)
    description: >-
      Schrijf-endpoints zonder API-sleutel toestaan. Uitgeschakeld houden tenzij
      u volledig vertrouwt op netwerktoegang tot deze add-on.
  web_allowed_origins:
    name: Toegestane weborigines (CORS)
    description: >-
      CORS-allowlist voor browsertoegang. Voer volledige origines in zoals
      https://ha.example.com. Laat leeg om cross-origin toegang uit te
      schakelen.
  web_mutation_rate_limit_per_minute:
    name: Web schrijflimiet
    description: "Maximum aantal muterende API-verzoeken per minuut per client. Standaard:
      120."
  ha_discovery_type_from_label_prefix:
    name: Type uit labelprefix
    description: >-
      Behandel een groepslabel dat begint met een entiteitsdomein-prefix als dat
      apparaattype (bijv. cover.slaapkamer_luik wordt een cover,
      switch.verandalamp een schakelaar). Ondersteunde prefixes: light., cover.,
      switch., relay., pir. Een handmatige type_overrides-vermelding gaat altijd
      voor. Standaard uit.
  ha_discovery_type_from_unit:
    name: Type uit C-Bus-unittype
    description: >-
      Bepaal het type van elke entiteit op basis van de C-Bus-unit die de groep
      aanstuurt, voor groepen waarvan de naam nog geen zonwering aanduidt.
      Dimmerkanalen worden dimbare lampen, relaiskanalen aan/uit-lampen, en
      groepen die alleen door een invoerunit zoals een bus coupler worden
      aangestuurd worden binaire sensoren. Een handmatige
      type_overrides-vermelding en een naam die zonwering aanduidt (bijv. blind,
      shutter) gaan nog steeds voor, omdat een relais net zo goed een lamp,
      zonwering of een klep kan aansturen. Groepen met niet-herkende unittypes
      blijven onveranderd. Dit aanzetten kan het type van bestaande entiteiten
      wijzigen.
