configuration:
  cgate_mode:
    name: C-Gate モード
    description: >-
      C-Gate の提供方法。"remote" はネットワーク上の別の場所で動作している C-Gate
      サーバーに接続します（最も一般的）。"managed" はこのアドオン内で C-Gate をローカルにダウンロードして実行します。
  cgate_host:
    name: C-Gate ホスト（必須）
    description: >-
      C-Gate サーバーの IP アドレスまたはホスト名。リモートモードでは C-Gate
      を実行しているマシンのアドレスを入力してください。マネージドモードでは 127.0.0.1 を使用してください。
  cgate_project:
    name: C-Gate プロジェクト名（必須）
    description: C-Gate で設定された C-Bus プロジェクトの名前（例：HOME、MYHOUSE）。 C-Gate Toolkit
      のプロジェクトツリーで確認できます。
  ha_discovery_enabled:
    name: Home Assistant Discovery を有効化
    description: >-
      MQTT Discovery を使用して C-Bus デバイスを Home Assistant に自動登録
      します。ほとんどのユーザーはこれを有効のままにしてください。手動の YAML 設定なしでデバイスがエンティティとして表示されます。
  log_level:
    name: ログレベル
    description: ログの詳細度。通常運用には "info"、接続やディスカバリの問題を トラブルシューティングするには "debug" を使用してください。
  cgate_port:
    name: C-Gate コマンドポート
    description: C-Gate コマンド接続用の TCP ポート。C-Gate が非標準ポートを使用して いる場合のみ変更してください。デフォルト：20023。
  cgate_event_port:
    name: C-Gate イベントポート
    description: C-Gate イベント接続用の TCP ポート。C-Gate が非標準ポートを使用して いる場合のみ変更してください。デフォルト：20025。
  cgate_install_source:
    name: C-Gate インストールソース
    description: >-
      マネージドモードでのみ使用されます。"download" は C-Gate を自動的に ダウンロードします。"upload" は
      /share/cgate/ に配置した zip ファイル を使用します。
  cgate_download_url:
    name: C-Gate ダウンロード URL
    description: >-
      ダウンロードソースのマネージドモードでのみ使用されます。公式 Clipsal ダウンロード URL が変更された場合に上書きします。デフォルト
      URL を 使用するには空のままにしてください。
  cgate_download_sha256:
    name: C-Gate ダウンロード SHA256
    description: C-Gate ダウンロードを検証するためのオプションの SHA256 チェックサム。 カスタムダウンロード URL を使用する場合に推奨されます。
  cgate_force_reinstall:
    name: C-Gate の再インストールを強制
    description: >-
      マネージドモードでのみ使用されます。一度インストールすると、C-Gate
      は通常そのまま維持されます。これを有効にすると、次回起動時にインストールソースから C-Gate
      を再インストール／アップグレードします（プロジェクトのデータベースと設定は保持されます）。アップロードモードでは、代わりに新しい zip を
      /share/cgate に置くこともできます。アップグレード後はオフに戻してください。
  cgate_serial_device:
    name: シリアル PCI デバイス（ベータ）
    description: >-
      BETA: USB シリアル PC インターフェース（5500PC/5500PCU）サポート —
      両インターフェースで動作確認済み。検出されたシリアルデバイスをドロップダウンから選択してください（/dev/serial/by-id/
      以下のパスを推奨）。カスタムパスを入力するには、設定エディターを YAML モードに切り替えてください。マネージドモードと、シリアル PC
      インターフェース用に設定された C-Bus Toolkit プロジェクトが必要です。問題は GitHub で報告してください（issue #28）。
  cgate_external_clients:
    name: 外部 C-Gate クライアント
    description: >-
      C-Bus Toolkit などのツールのために、管理対象の C-Gate
      への接続を許可するアドレス。空のままにすると、このアドオンのみが許可されます。C-Gate には認証機能がなく、program レベルは C-Bus
      ユニットの再プログラムを許可するため、サブネット全体ではなく特定のアドレスを列挙してください。オクテットの値 255
      は任意の値に一致するため、192.168.1.255 はネットワーク 192.168.1.x 全体を意味します。また、ネットワークパネルで
      C-Gate のポートを公開する必要があります。
  mqtt_host:
    name: MQTT ブローカーホスト
    description: >-
      Mosquitto アドオンから自動検出されます — ほとんどのユーザーは空のまま にしてください。外部 MQTT
      ブローカーを使用する場合のみ設定してください。
  mqtt_port:
    name: MQTT ブローカーポート
    description: Mosquitto アドオンから自動検出されます。外部ブローカーの場合のみ設定 してください。デフォルト：1883。
  mqtt_username:
    name: MQTT ユーザー名
    description: Mosquitto アドオンから自動検出されます。外部ブローカーの場合または 資格情報を上書きする場合のみ設定してください。
  mqtt_password:
    name: MQTT パスワード
    description: Mosquitto アドオンから自動検出されます。外部ブローカーの場合または 資格情報を上書きする場合のみ設定してください。
  mqtt_use_tls:
    name: MQTT TLS を有効化
    description: >-
      TLS (mqtts://) を使用して MQTT に接続します。暗号化された接続を 必要とするブローカーで有効にしてください（通常ポート
      8883）。標準の Mosquitto アドオンでは不要です。
  mqtt_ca_file:
    name: MQTT CA 証明書ファイル
    description: >-
      ブローカーの TLS 証明書を検証するための CA 証明書のパス。通常 /ssl/
      に保存されます（例：/ssl/ca.crt）。自己署名証明書の場合のみ 必要です。
  mqtt_reject_unauthorized:
    name: MQTT TLS 証明書を検証
    description: >-
      ブローカーの TLS 証明書を検証できない場合に接続を拒否します。 セキュリティのために有効のままにしてください。CA ファイルのない
      自己署名証明書の場合のみ無効にしてください。
  auto_discover_networks:
    name: C-Bus ネットワークを自動検出
    description: >-
      接続時に C-Gate からネットワーク ID を自動的に検出します。検出された ネットワークはポーリングと HA Discovery
      に使用されます。自動検出が 問題を起こす場合のみ無効にしてください。デフォルト：有効。
  getall_networks:
    name: 監視する C-Bus ネットワーク
    description: >-
      デバイス状態をポーリングする C-Bus ネットワーク ID。デフォルト：254 （ほとんどの環境での標準 C-Bus ネットワーク）。C-Gate
      Toolkit の プロジェクトツリーでネットワーク ID を確認できます。
  getall_on_start:
    name: 起動時にすべてのデバイスをポーリング
    description: アドオン起動時にすべてのデバイス状態を要求し、Home Assistant を 現在の C-Bus 状態と同期します。デフォルト：有効。
  getall_period:
    name: ポーリング間隔（秒）
    description: すべてのデバイス状態を再ポーリングする頻度。低い値 = より新しい 状態ですが C-Gate トラフィックが増加します。デフォルト：3600 （1
      時間）。
  getall_app_periods:
    name: アプリごとのポーリング間隔
    description: >-
      特定の C-Bus アプリケーションのポーリング間隔を上書きします。 各エントリには app_id（例："56" は Lighting）と
      period_sec（0 で 無効化）があります。
  retain_reads:
    name: MQTT 状態メッセージを保持
    description: 状態メッセージに MQTT 保持フラグを設定し、新しいサブスクライバーが 最後の既知のデバイス状態をすぐに受信できるようにします。デフォルト： 無効。
  message_interval:
    name: コマンド間隔（ミリ秒）
    description: C-Gate に送信するコマンド間の最小遅延。高速なコマンドで C-Gate が 過負荷になるのを防ぎます。デフォルト：200ms。
  ha_discovery_prefix:
    name: Discovery トピックプレフィックス
    description: >-
      HA Discovery メッセージの MQTT トピックプレフィックス。Home Assistant の MQTT Discovery
      プレフィックスと一致させる必要が あります。デフォルト：homeassistant。
  ha_discovery_networks:
    name: Discovery ネットワーク
    description: >-
      デバイス検出のためにスキャンする C-Bus ネットワーク ID。空の場合、 「監視する C-Bus ネットワーク」のネットワークを使用します。
      デフォルト：254。
  ha_discovery_cover_app_id:
    name: カバーアプリケーション ID
    description: >-
      カバー（ブラインド、シャッター、ガレージドア）用の C-Bus アプリ ID。一般的な値：203（Enable
      Control）。カバー検出をスキップするには 空のままにしてください。
  ha_discovery_cover_tilt_app_id:
    name: カバー傾斜アプリケーション ID
    description: ベネチアンブラインドの傾斜制御用の C-Bus アプリ ID。グループ番号で カバーとペアリングされます。傾斜をスキップするには空のままにして
      ください。
  ha_discovery_switch_app_id:
    name: スイッチアプリケーション ID
    description: スイッチグループ用の C-Bus アプリ ID。スイッチ検出をスキップするには 空のままにしてください。
  ha_discovery_relay_app_id:
    name: リレーアプリケーション ID
    description: グループがリレー駆動のスイッチ（コンセント）になる C-Bus アプリ ID。スキップするには空のまま。
  ha_discovery_pir_app_id:
    name: PIR アプリケーション ID
    description: グループがモーション binary_sensor になる C-Bus アプリ ID。そのアプリのレベル追跡も停止します。スキップするには空のまま。
  ha_discovery_unlisted_groups:
    name: プロジェクト外グループを検出
    description: >-
      Toolkit プロジェクトに無くても、照明系グループがバスに現れた初回に Home Assistant
      エンティティを作ります。既定はオフ。未使用およびシーン用アドレスもイベントストリームに流れます。オフにすると残ったエンティティを撤回します。
  ha_discovery_trigger_app_id:
    name: トリガーアプリケーション ID
    description: トリガーグループ（キーパッド、シーン）用の C-Bus アプリ ID。 一般的な値：202。トリガー検出をスキップするには空のままにして ください。
  ha_discovery_scene_enabled:
    name: シーンエンティティを有効化
    description: 各トリガーグループに対して、イベントおよびボタンエンティティに加えて Home Assistant シーンエンティティを作成します。デフォルト：有効。
  ha_discovery_auto_type:
    name: Auto-detect Device Types
    description: >-
      Automatically classify Lighting (56) groups whose label looks like a
      motorised cover (blind, shutter, etc.) as Home Assistant cover entities
      instead of lights. Manual type overrides always take precedence. Default:
      enabled.
  ha_discovery_auto_type_name_heuristics:
    name: Auto-detect Using Label Keywords
    description: >-
      When auto-detection is on, match cover keywords in the group label. Turn
      off to disable keyword matching while keeping other auto-detection.
      Default: enabled.
  ha_discovery_auto_type_cover_keywords:
    name: Cover Detection Keywords
    description: >-
      Case-insensitive keywords in a Lighting group label that mark it as a
      cover (matching also catches plurals). Defaults: blind, shutter, shade,
      awning, curtain, roller, garage door.
  ha_discovery_hvac_app_id:
    name: HVAC アプリケーション ID
    description: >-
      照明互換 HVAC グループ（PAC/タッチスクリーン経由で公開）用の C-Bus アプリ ID。ネイティブ Air Conditioning
      アプリ 172 ではありません — PAC またはタッチスクリーンによって照明スタイルアプリにミラーされた グループにのみ使用してください。HVAC
      検出をスキップするには空のまま にしてください。
  ha_hvac_temperature_unit:
    name: HVAC 温度単位
    description: HVAC 空調エンティティの温度単位。C は摂氏、F は華氏。デフォルト：C。
  cbus_aircon_app_id:
    name: 空調アプリケーション ID
    description: >-
      ネイティブの読み取り専用の室温のための C-Bus 空調（Air Conditioning）アプリケーション ID（例:
      172）。zone_temperature ブロードキャストをデコードし、current_temperature を
      cbus/read/{network}/172/{zone}/current_temperature に公開します。デフォルトは無効です。
  cbus_aircon_control_enabled:
    name: 空調制御
    description: >-
      Home Assistant がネイティブ C-Bus
      サーモスタットを制御（モードと温度の設定）できるようにします。デフォルトは無効です。稼働中の暖房/冷房に書き込みます。空調アプリケーション ID
      の設定が必要です。
  cbus_security_app_id:
    name: セキュリティアプリケーション ID
    description: >-
      アラームゾーンセンサー用の C-Bus セキュリティアプリケーション ID（デフォルト
      208）。ゾーンごとにバイナリセンサーを1つ公開します（sealed はオフ、unsealed/open/short
      はオン）。接続時にゾーン状態を同期します。無効にするには 0 を設定してください。
  cbus_security_control_enabled:
    name: セキュリティパネル制御
    description: >-
      Home Assistant によるアラームパネルの武装（away、night、home、vacation）を許可します。武装のみ: C-Bus
      には解除コマンドがないため、Home Assistant の Disarm ボタンは何もしません。デフォルトはオフです。武装コマンドは C-Bus
      上で PIN を伴わないため、コマンドトピックに発行できるものはすべてパネルを武装できます。セキュリティアプリケーション ID の設定が必要です。
  cbus_security_disarm_enabled:
    name: セキュリティパネルの解除
    description: >-
      Home Assistant によるアラームパネルの解除も許可します。セキュリティパネル制御が必要です。デフォルトはオフです。C-Bus
      には解除コマンドがないため、キーパッドエミュレーションで PIN をパネルに入力します。Home Assistant
      が独自のキーパッドを表示し、入力内容を MQTT で送信します。PIN はどこにも保存されませんが、解除のたびに MQTT
      ブローカーを経由します。信頼できるブローカーでのみ、できれば TLS を使って有効にしてください。
  cbus_security_bypass_enabled:
    name: 開いたゾーンを無視して強制的に武装
    description: >-
      ゾーンが開いている状態でも、パネルの # キーを使って強制的に武装することを Home Assistant
      に許可します。セキュリティパネル制御が必要です。デフォルトはオフです。武装とは意図的に分けています。開いたドアを無視して武装したアラームは武装済みに見えても、そのドアを監視していないため、意識的な選択であるべきです。自動では行われません。
  cbus_measurement_app_id:
    name: 測定アプリケーションID
    description: >-
      アナログ/数値センサーの読み取り値（温度、電力、照度など）のためのC-Bus測定アプリケーションID（デフォルト228）。cbus/read/{network}/228/{device}/{channel}/value
      と /unit に発行し、cbus/write/{network}/228/{device}/{channel}/data（ペイロード
      "value,multiplier,units"）で注入された読み取り値を受け付けます —
      例えばスクリプト/仮想センサー向けです。デフォルトでオフです。
  cbus_clock_enabled:
    name: C-Bus ネットワーク時計
    description: >-
      時計ブロードキャスト（アプリ 223）を2つの診断センサーとしてデコードし、接続時に C-Gate
      へ更新を要求します。読み取り専用で、ネットワーク時計は設定しません。実キャプチャが少ないため既定はオフです。
  cbus_scene_module_enabled:
    name: Scene Module コマンド
    description: >-
      C-Bus Scene Module のシーン再生・記録 MQTT コマンドを受け付けます。既定はオフ。多くは Trigger Control
      シーンを使い、記録はモジュールメモリを上書きします。
  cbus_enable_control_app_id:
    name: Enable Control アプリケーションID
    description: >-
      C-Bus Enable Control アプリケーションID（通常 203）。MQTT の set / label / remove
      書き込み用。空で無効。remove は C-Gate グループオブジェクトを削除します。remove トピックに ON を発行してください。ラベルは
      hex 符号化。Home Assistant エンティティは作成しません。
  cbus_raw_event_log_apps:
    name: 生イベントキャプチャ対象アプリ
    description: 生の C-Gate イベント行をログし raw MQTT トピックへ再公開する C-Bus アプリ ID。空で無効。うるさいので通常は空のまま。
  ha_bridge_diagnostics_enabled:
    name: Bridge 診断を有効化
    description: Bridge ヘルスエンティティ（準備状態、接続、キュー深度）を Home Assistant に公開します。デフォルト：有効。
  ha_bridge_diagnostics_interval_sec:
    name: 診断間隔（秒）
    description: Bridge 診断状態の更新頻度。デフォルト：60。
  cni_offline_notification:
    name: CNI オフライン通知
    description: >-
      C-Bus ネットワークの CNI/PCI リンクがオフラインになった場合に Home Assistant
      通知を表示し、再接続時に解除します。Home Assistant アドオン環境が必要です。デフォルトは無効です。
  stale_device_detection_enabled:
    name: 古いデバイスの検出を有効化
    description: 報告を停止した C-Bus デバイスを検出し、警告センサーを公開します。 デフォルト：有効。
  stale_device_threshold_hours:
    name: 古いデバイスの閾値（時間）
    description: デバイスが古いと見なされるまでの状態更新のない時間数。デフォルト：24。
  stale_device_check_interval_sec:
    name: 古いデバイスのチェック間隔（秒）
    description: 古いデバイスをスキャンする頻度。デフォルト：3600（1 時間）。
  connection_pool_size:
    name: 接続プールサイズ
    description: C-Gate への並列 TCP 接続数。高スループットのインストールでは増加し、 古い C-Gate では 1 に減らしてください。デフォルト：3。
  connection_health_check_interval_sec:
    name: ヘルスチェック間隔（秒）
    description: C-Gate 接続が正常かどうかを確認する頻度。デフォルト：30。
  connection_keep_alive_interval_sec:
    name: Keep-Alive 間隔（秒）
    description: C-Gate 接続を ping する頻度。サイレント TCP 切断を防止します。 デフォルト：60。
  cover_ramp_duration_sec:
    name: カバー昇降時間（秒）
    description: カバーが完全に開閉するまでの予想時間。Bridge はこのウィンドウ中に 推定位置を公開します。デフォルト：5。
  cbus_label_file:
    name: カスタムラベルファイル
    description: カスタムデバイス名を含む JSON ファイルのパス。未設定の場合、一般的な パスから自動検出されます。ファイルは変更が監視されます。
  web_api_key:
    name: Web API キー
    description: ラベルエディタでの書き込み操作用の API キー。ポート 8080 を HA ingress 外に公開する場合に設定してください。
  web_allow_unauthenticated_mutations:
    name: 未認証の Web 書き込みを許可（安全でない）
    description: API キーなしで書き込みエンドポイントを許可します。このアドオンへの ネットワークアクセスを完全に信頼している場合を除き、無効のままに
      してください。
  web_allowed_origins:
    name: 許可された Web オリジン（CORS）
    description: >-
      ブラウザアクセス用の CORS 許可リスト。https://ha.example.com のような
      完全なオリジンを入力してください。クロスオリジンアクセスを無効にするには 空のままにしてください。
  web_mutation_rate_limit_per_minute:
    name: Web 書き込みレート制限
    description: クライアントあたりの 1 分間の最大変更 API リクエスト数。デフォルト： 120。
  ha_discovery_type_from_label_prefix:
    name: ラベルプレフィックスからタイプを判定
    description: >-
      エンティティドメインプレフィックスで始まるグループラベルを、そのデバイスタイプとして検出します(例:cover.bedroom_shutter
      はカバー、switch.porch_light はスイッチ)。対応プレフィックス:
      light.、cover.、switch.、relay.、pir.。手動の type_overrides
      エントリが常に優先されます。デフォルトはオフです。
  ha_discovery_type_from_unit:
    name: C-Bus ユニットタイプからタイプを判定
    description: >-
      グループ名がすでにブラインドであると判別できない場合、各エンティティのタイプをそのグループを駆動する C-Bus
      ユニットから判定します。調光器チャンネルは調光可能なライト、リレーチャンネルはオン/オフのライト、bus coupler
      などの入力ユニットのみが接続されたグループはバイナリセンサーになります。手動の type_overrides
      エントリと、ブラインドであると判別できる名前(例:
      blind、shutter)は引き続き優先されます。リレーはライト、ブラインド、バルブのいずれも駆動しうるためです。認識できないユニットタイプのグループは変更されません。これを有効にすると、既存のエンティティのタイプが変わる場合があります。
