        Wie oft überprüft wird, ob C-Gate Verbindungen gesund sind. Standard: 30.
      es: >-
        Con qué frecuencia verificar que las conexiones de C-Gate estén
        saludables. Predeterminado: 30.
      fr: >-
        Fréquence de vérification de la santé des connexions C-Gate. Par défaut
        : 30.
      it: >-
        Con quale frequenza verificare che le connessioni C-Gate siano sane.
        Predefinito: 30.
      nl: >-
        Hoe vaak wordt gecontroleerd of C-Gate verbindingen gezond zijn.
        Standaard: 30.
      pt: >-
        Com que frequência verificar se as ligações C-Gate estão saudáveis.
        Predefinido: 30.
      ru: >-
        Как часто проверять работоспособность подключений C-Gate. По умолчанию:
        30.
      zh: >-
        验证 C-Gate 连接健康状况的频率。默认：30。
      ja: >-
        C-Gate 接続が正常かどうかを確認する頻度。デフォルト：30。
      ko: >-
        C-Gate 연결이 정상인지 확인하는 빈도. 기본값: 30.
      pl: >-
        Jak często weryfikować czy połączenia C-Gate są zdrowe. Domyślnie: 30.
      sv: >-
        Hur ofta C-Gate anslutningar kontrolleras. Standard: 30.
      no: >-
        Hvor ofte C-Gate tilkoblinger kontrolleres. Standard: 30.
      da: >-
        Hvor ofte C-Gate forbindelser kontrolleres. Standard: 30.
      cs: >-
        Jak často ověřovat zdraví připojení C-Gate. Výchozí: 30.
      uk: >-
        Як часто перевіряти працездатність підключень C-Gate. За замовчуванням:
        30.
  connection_keep_alive_interval_sec:
    name:
      en: Keep-Alive Interval (seconds)
      de: Keep-Alive-Intervall (Sekunden)
      es: Intervalo de Keep-Alive (segundos)
      fr: Intervalle de Keep-Alive (secondes)
      it: Intervallo Keep-Alive (secondi)
      nl: Keep-Alive-interval (seconden)
      pt: Intervalo de Keep-Alive (segundos)
      ru: Интервал Keep-Alive (секунды)
      zh: Keep-Alive 间隔（秒）
      ja: Keep-Alive 間隔（秒）
      ko: Keep-Alive 간격 (초)
      pl: Interwał Keep-Alive (sekundy)
      sv: Keep-Alive intervall (sekunder)
      no: Keep-Alive intervall (sekunder)
      da: Keep-Alive interval (sekunder)
      cs: Interval Keep-Alive (sekundy)
      uk: Інтервал Keep-Alive (секунди)
    description:
      en: >-
        How often to ping C-Gate connections. Prevents silent TCP drops.
        Default: 60.
      de: >-
        Wie oft C-Gate Verbindungen angepingt werden. Verhindert stille
        TCP-Abbrüche. Standard: 60.
      es: >-
        Con qué frecuencia hacer ping a las conexiones de C-Gate. Previene
        desconexiones TCP silenciosas. Predeterminado: 60.
      fr: >-
        Fréquence de ping des connexions C-Gate. Empêche les déconnexions TCP
        silencieuses. Par défaut : 60.
      it: >-
        Con quale frequenza fare ping alle connessioni C-Gate. Previene
        disconnessioni TCP silenziose. Predefinito: 60.
      nl: >-
        Hoe vaak C-Gate verbindingen worden gepingd. Voorkomt stille
        TCP-verbroken verbindingen. Standaard: 60.
      pt: >-
        Com que frequência fazer ping às ligações C-Gate. Previne desconexões
        TCP silenciosas. Predefinido: 60.
      ru: >-
        Как часто пинговать подключения C-Gate. Предотвращает тихие разрывы TCP.
        По умолчанию: 60.
      zh: >-
        Ping C-Gate 连接的频率。防止静默 TCP 断开。默认：60。
      ja: >-
        C-Gate 接続を ping する頻度。サイレント TCP 切断を防止します。 デフォルト：60。
      ko: >-
        C-Gate 연결에 ping하는 빈도. 무음 TCP 끊김을 방지합니다. 기본값: 60.
      pl: >-
        Jak często pingować połączenia C-Gate. Zapobiega cichym zerwaniom TCP.
        Domyślnie: 60.
      sv: >-
        Hur ofta C-Gate anslutningar pingas. Förhindrar tysta TCP-avbrott.
        Standard: 60.
      no: >-
        Hvor ofte C-Gate tilkoblinger pinges. Forhindrer stille TCP-avbrudd.
        Standard: 60.
      da: >-
        Hvor ofte C-Gate forbindelser pinges. Forhindrer stille TCP-afbrydelser.
        Standard: 60.
      cs: >-
        Jak často pingovat připojení C-Gate. Zabraňuje tichým přerušením TCP.
        Výchozí: 60.
      uk: >-
        Як часто пінгувати підключення C-Gate. Запобігає тихим розривам TCP. За
        замовчуванням: 60.
