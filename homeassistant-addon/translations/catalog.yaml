      zh: 允许的 Web 来源（CORS）
      ja: 許可された Web オリジン（CORS）
      ko: 허용된 Web 오리진 (CORS)
      pl: Dozwolone źródła web (CORS)
      sv: Tillåtna webbkällor (CORS)
      no: Tillatte webkilder (CORS)
      da: Tilladte webkilder (CORS)
      cs: Povolené webové zdroje (CORS)
      uk: Дозволені веб-джерела (CORS)
    description:
      en: >-
        CORS allowlist for browser access. Enter full origins like
        https://ha.example.com. Leave empty to disable cross-origin access.
      de: >-
        CORS-Allowlist für Browser-Zugriff. Vollständige Ursprünge eingeben wie
        https://ha.example.com. Leer lassen, um Cross-Origin-Zugriff zu
        deaktivieren.
      es: >-
        Lista de permitidos CORS para acceso desde navegador. Ingrese orígenes
        completos como https://ha.example.com. Dejar vacío para deshabilitar el
        acceso cross-origin.
      fr: >-
        Liste d'autorisation CORS pour l'accès navigateur. Entrez les origines
        complètes comme https://ha.example.com. Laisser vide pour désactiver
        l'accès cross-origin.
      it: >-
        Lista CORS consentita per l'accesso dal browser. Inserire origini
        complete come https://ha.example.com. Lasciare vuoto per disabilitare
        l'accesso cross-origin.
      nl: >-
        CORS-allowlist voor browsertoegang. Voer volledige origines in zoals
        https://ha.example.com. Laat leeg om cross-origin toegang uit te
        schakelen.
      pt: >-
        Lista de permissões CORS para acesso via navegador. Introduza origens
        completas como https://ha.example.com. Deixe vazio para desativar o
        acesso cross-origin.
      ru: >-
        Список разрешённых источников CORS для доступа из браузера. Введите
        полные источники, например https://ha.example.com. Оставьте пустым для
        отключения кросс-доменного доступа.
      zh: >-
        用于浏览器访问的 CORS 允许列表。输入完整来源如 https://ha.example.com。留空以禁用跨域访问。
      ja: >-
        ブラウザアクセス用の CORS 許可リスト。https://ha.example.com のような
        完全なオリジンを入力してください。クロスオリジンアクセスを無効にするには 空のままにしてください。
      ko: >-
        브라우저 액세스를 위한 CORS 허용 목록. https://ha.example.com과 같은 전체 오리진을 입력하세요. 교차 출처
        액세스를 비활성화하려면 비워 두세요.
      pl: >-
        Lista dozwolonych CORS dla dostępu z przeglądarki. Wpisz pełne źródła
        jak https://ha.example.com. Pozostaw puste aby wyłączyć dostęp
        cross-origin.
      sv: >-
        CORS-tillåtslista för webbläsaråtkomst. Ange fullständiga källadresser
        som https://ha.example.com. Lämna tomt för att inaktivera cross-origin
        åtkomst.
      no: >-
        CORS-tillattliste for nettlesertilgang. Skriv inn fullstendige
        kildeadresser som https://ha.example.com. La stå tomt for å deaktivere
        cross-origin tilgang.
      da: >-
        CORS-tilladelsesliste for browseradgang. Indtast fulde kildeadresser som
        https://ha.example.com. Lad stå tomt for at deaktivere cross-origin
        adgang.
      cs: >-
        CORS seznam povolených pro přístup z prohlížeče. Zadejte úplné zdroje
        jako https://ha.example.com. Ponechte prázdné pro zakázání cross-origin
        přístupu.
      uk: >-
        Список дозволених джерел CORS для доступу з браузера. Введіть повні
        джерела, наприклад https://ha.example.com. Залиште порожнім для
        вимкнення крос-доменного доступу.
