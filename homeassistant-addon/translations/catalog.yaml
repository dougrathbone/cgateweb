      fr: ID d'app C-Bus dont les groupes deviennent des interrupteurs relais (classe
        prise). Laisser vide pour ignorer.
      it: ID app C-Bus i cui gruppi diventano interruttori a relè (classe presa).
        Lasciare vuoto per saltare.
      nl: C-Bus app-ID waarvan groepen relais-schakelaars worden (apparaatklasse
        stopcontact). Laat leeg om over te slaan.
      pt: ID de app C-Bus cujos grupos viram interruptores de relé (classe tomada).
        Deixe vazio para ignorar.
      ru: ID приложения C-Bus, группы которого становятся релейными выключателями.
        Оставьте пустым, чтобы пропустить.
      zh: 其组将成为继电器开关实体（插座设备类）的 C-Bus 应用 ID。留空以跳过。
      ja: グループがリレー駆動のスイッチ（コンセント）になる C-Bus アプリ ID。スキップするには空のまま。
      ko: 그룹이 릴레이 스위치(콘센트)가 되는 C-Bus 앱 ID. 건너뛰려면 비워 두세요.
      pl: ID aplikacji C-Bus, której grupy stają się przełącznikami przekaźnikowymi.
        Pozostaw puste, aby pominąć.
      sv: C-Bus app-ID vars grupper blir reläbaserade strömbrytare. Lämna tomt för att
        hoppa över.
      no: C-Bus app-ID der grupper blir relébrytere. La stå tomt for å hoppe over.
      da: C-Bus app-ID hvis grupper bliver relækontakter. Lad stå tomt for at springe
        over.
      cs: ID aplikace C-Bus, jejíž skupiny se stanou reléovými spínači. Ponechte
        prázdné pro přeskočení.
      uk: ID застосунку C-Bus, групи якого стають реле-вимикачами. Залиште порожнім,
        щоб пропустити.

  ha_discovery_pir_app_id:
    name:
      en: PIR Application ID
      de: PIR-Anwendungs-ID
      es: ID de aplicación PIR
      fr: ID d'application PIR
      it: ID applicazione PIR
      nl: PIR Applicatie-ID
      pt: ID de aplicação PIR
      ru: ID приложения PIR
      zh: PIR 应用程序 ID
      ja: PIR アプリケーション ID
      ko: PIR 애플리케이션 ID
      pl: ID aplikacji PIR
      sv: Applikations-ID för PIR
      no: Applikasjons-ID for PIR
      da: Applikations-ID for PIR
      cs: ID aplikace PIR
      uk: ID застосунку PIR
    description:
      en: C-Bus app ID whose groups become motion binary sensors. Also stops level
        tracking for that application. Leave empty to skip.
      de: C-Bus App-ID, deren Gruppen Bewegungs-Binärsensoren werden. Unterdrückt
        Level-Abfragen für diese App. Leer lassen zum Überspringen.
      es: ID de app C-Bus cuyos grupos se convierten en sensores binarios de
        movimiento. También desactiva el seguimiento de nivel. Dejar vacío para
        omitir.
      fr: ID d'app C-Bus dont les groupes deviennent des capteurs binaires de
        mouvement. Désactive aussi le suivi de niveau. Laisser vide pour ignorer.
      it: ID app C-Bus i cui gruppi diventano binary_sensor di movimento. Disattiva
        anche il tracking del livello. Lasciare vuoto per saltare.
      nl: C-Bus app-ID waarvan groepen bewegings-binary_sensors worden. Onderdrukt ook
        niveaumeting voor die app. Laat leeg om over te slaan.
      pt: ID de app C-Bus cujos grupos viram sensores binários de movimento. Também
        desativa o rastreio de nível. Deixe vazio para ignorar.
      ru: ID приложения C-Bus, группы которого становятся датчиками движения. Также
        отключает опрос уровня. Оставьте пустым, чтобы пропустить.
      zh: 其组将成为运动二进制传感器的 C-Bus 应用 ID。同时停止该应用的电平跟踪。留空以跳过。
      ja: グループがモーション binary_sensor になる C-Bus アプリ ID。そのアプリのレベル追跡も停止します。スキップするには空のまま。
      ko: 그룹이 모션 바이너리 센서가 되는 C-Bus 앱 ID. 해당 앱의 레벨 추적도 중단됩니다. 건너뛰려면 비워 두세요.
      pl: ID aplikacji C-Bus, której grupy stają się czujnikami ruchu. Wyłącza też
        śledzenie poziomu. Pozostaw puste, aby pominąć.
      sv: C-Bus app-ID vars grupper blir rörelsesensorer. Stoppar också nivåspårning
        för den appen. Lämna tomt för att hoppa över.
      no: C-Bus app-ID der grupper blir bevegelsessensorer. Stopper også nivåsporing
        for den appen. La stå tomt for å hoppe over.
      da: C-Bus app-ID hvis grupper bliver bevægelsessensorer. Stopper også
        niveausporing for den app. Lad stå tomt for at springe over.
      cs: ID aplikace C-Bus, jejíž skupiny se stanou pohybovými senzory. Také zastaví
        sledování úrovně. Ponechte prázdné pro přeskočení.
      uk: ID застосунку C-Bus, групи якого стають датчиками руху. Також зупиняє
        відстеження рівня. Залиште порожнім, щоб пропустити.

  ha_discovery_unlisted_groups:
    name:
      en: Discover unlisted groups
      de: Nicht gelistete Gruppen entdecken
      es: Descubrir grupos no listados
      fr: Découvrir les groupes non listés
      it: Rileva gruppi non in elenco
      nl: Onvermelde groepen ontdekken
      pt: Descobrir grupos não listados
      ru: Обнаруживать группы вне проекта
      zh: 发现未列入项目的组
      ja: プロジェクト外グループを検出
      ko: 프로젝트에 없는 그룹 검색
      pl: Wykrywaj grupy spoza projektu
      sv: Upptäck ogranskade grupper
      no: Oppdag uglistede grupper
      da: Opdag uglistede grupper
      cs: Objevovat skupiny mimo projekt
      uk: Виявляти групи поза проєктом
    description:
      en: "Create a Home Assistant entity the first time a lighting-style group
        appears on the bus even if it is missing from the Toolkit project. Off by
        default: unused and scene addresses also appear in the event stream.
        Turning this off retracts those leftover entities."
      de: "Legt eine Home-Assistant-Entität an, sobald eine Beleuchtungsgruppe auf dem
        Bus erscheint, auch wenn sie im Toolkit-Projekt fehlt. Standardmäßig aus:
        ungenutzte und Szenenadressen erscheinen ebenfalls, und behaltene
        Discovery-Configs müssen manuell vom Broker gelöscht werden."
      es: "Crea una entidad de Home Assistant la primera vez que un grupo de
        iluminación aparece en el bus aunque falte en el proyecto de Toolkit.
        Desactivado por defecto: las direcciones de escena y grupos no usados
        también aparecen, y hay que borrar a mano las configs retenidas en el
        broker."
      fr: "Crée une entité Home Assistant dès qu'un groupe d'éclairage apparaît sur le
        bus, même s'il manque au projet Toolkit. Désactivé par défaut : les
        adresses de scène apparaissent aussi, et les configs MQTT retenues doivent
        être retirées à la main."
      it: "Crea un'entità Home Assistant la prima volta che un gruppo di illuminazione
        compare sul bus anche se assente dal progetto Toolkit. Disattivato di
        default: anche indirizzi scena e gruppi inutilizzati compaiono, e le
        config retained vanno rimosse a mano dal broker."
      nl: "Maakt een Home Assistant-entiteit aan de eerste keer dat een lichtgroep op
        de bus verschijnt, ook als die ontbreekt in het Toolkit-project. Standaard
        uit: scène-adressen verschijnen ook, en retained discovery-configs moet je
        handmatig van de broker halen."
      pt: "Cria uma entidade Home Assistant na primeira vez que um grupo de iluminação
        aparece no barramento, mesmo ausente do projeto Toolkit. Desligado por
        padrão: endereços de cena também aparecem, e configs retidas no broker
        precisam ser apagadas à mão."
      ru: "Создаёт сущность Home Assistant при первом появлении группы освещения на
        шине, даже если её нет в проекте Toolkit. По умолчанию выкл.: адреса сцен
        тоже видны, а retained-конфиги нужно удалять с брокера вручную."
      zh: 总线首次出现照明类组时创建 Home Assistant 实体，即使 Toolkit
        项目中没有该组。默认关闭：场景和未使用地址也会出现，残留的发现配置需从 MQTT 代理上手动删除。
      ja: Toolkit プロジェクトに無くても、照明系グループがバスに現れた初回に Home Assistant
        エンティティを作ります。既定はオフ。シーン用アドレスも流れるため、残った discovery 設定はブローカーから手で消す必要があります。
      ko: "Toolkit 프로젝트에 없어도 조명 그룹이 버스에 처음 나타나면 Home Assistant 엔티티를 만듭니다. 기본 꺼짐: 장면
        주소도 나타나며, 남은 검색 설정은 브로커에서 직접 지워야 합니다."
      pl: "Tworzy encję Home Assistant, gdy grupa oświetleniowa pojawi się na
        magistrali, nawet jeśli nie ma jej w projekcie Toolkit. Domyślnie
        wyłączone: adresy scen też się pojawiają, a retained konfiguracje trzeba
        usunąć ręcznie z brokera."
      sv: "Skapar en Home Assistant-entitet första gången en belysningsgrupp syns på
        bussen även om den saknas i Toolkit-projektet. Av som standard:
        scenadresser syns också, och kvarvarande discovery-konfig måste tas bort
        från brokern för hand."
      no: "Oppretter en Home Assistant-entitet første gang en belysningsgruppe vises
        på bussen selv om den mangler i Toolkit-prosjektet. Av som standard:
        sceneadresser vises også, og gjenværende discovery-oppsett må slettes fra
        brokeren for hånd."
      da: "Opretter en Home Assistant-entitet første gang en belysningsgruppe vises på
        bussen, også hvis den mangler i Toolkit-projektet. Fra som standard:
        sceneadresser vises også, og tilbageholdte discovery-configs skal fjernes
        fra brokeren i hånden."
      cs: "Vytvoří entitu Home Assistant, když se osvětlovací skupina objeví na
        sběrnici, i když v projektu Toolkit chybí. Ve výchozím stavu vypnuto:
        objevují se i adresy scén a retained konfigurace je třeba z brokeru smazat
        ručně."
      uk: "Створює сутність Home Assistant, коли освітлювальна група вперше
        з'являється на шині, навіть якщо її немає в проєкті Toolkit. Типово
        вимкнено: адреси сцен теж з'являються, а retained-конфіги треба прибрати з
        брокера вручну."

  ha_discovery_trigger_app_id:
    name:
      en: Trigger Application ID
      de: Trigger-Anwendungs-ID
      es: ID de aplicación para triggers
      fr: ID d'application pour les déclencheurs
      it: ID applicazione per trigger
      nl: Trigger Applicatie-ID
      pt: ID de Aplicação de Triggers
      ru: ID приложения для триггеров
      zh: 触发器应用程序 ID
      ja: トリガーアプリケーション ID
      ko: 트리거 애플리케이션 ID
      pl: ID aplikacji wyzwalaczy
      sv: Applikations-ID för utlösare
      no: Applikasjons-ID for utløser
      da: Applikations-ID for udløsere
      cs: ID aplikace pro spouštěče
      uk: ID застосунку для тригерів
    description:
      en: >-
        C-Bus app ID for trigger groups (keypads, scenes). Common value: 202.
        Leave empty to skip trigger discovery.
      de: >-
        C-Bus App-ID für Triggergruppen (Tastenfelder, Szenen). Üblicher Wert:
        202. Leer lassen, um Triggererkennung zu überspringen.
      es: >-
        ID de app C-Bus para grupos de triggers (teclados, escenas). Valor
        común: 202. Dejar vacío para omitir el descubrimiento de triggers.
      fr: >-
        ID d'app C-Bus pour les groupes de déclencheurs (claviers, scènes).
        Valeur courante : 202. Laisser vide pour ignorer la découverte des
        déclencheurs.
      it: >-
        ID app C-Bus per gruppi di trigger (tastiere, scene). Valore comune:
        202. Lasciare vuoto per saltare il rilevamento dei trigger.
      nl: >-
        C-Bus app-ID voor triggergroepen (keypads, scènes). Veelgebruikte
        waarde: 202. Laat leeg om trigger-detectie over te slaan.
      pt: >-
        ID de app C-Bus para grupos de triggers (teclados, cenas). Valor comum:
        202. Deixe vazio para ignorar a descoberta de triggers.
      ru: >-
        ID приложения C-Bus для групп триггеров (клавиатуры, сцены). Обычное
        значение: 202. Оставьте пустым, чтобы пропустить обнаружение триггеров.
      zh: >-
        用于触发器组（键盘、场景）的 C-Bus 应用 ID。常用值：202。留空以 跳过触发器发现。
      ja: >-
        トリガーグループ（キーパッド、シーン）用の C-Bus アプリ ID。 一般的な値：202。トリガー検出をスキップするには空のままにして
        ください。
      ko: >-
        트리거 그룹 (키패드, 장면)용 C-Bus 앱 ID. 일반적인 값: 202. 트리거 검색을 건너뛰려면 비워 두세요.
      pl: >-
        ID aplikacji C-Bus dla grup wyzwalaczy (klawiatury, sceny). Typowa
        wartość: 202. Pozostaw puste aby pominąć wykrywanie wyzwalaczy.
      sv: >-
        C-Bus app-ID för utlösargrupper (knappsatser, scener). Vanligt värde:
        202. Lämna tomt för att hoppa över utlösarupptäckt.
      no: >-
        C-Bus app-ID for utløsergrupper (tastaturer, scener). Vanlig verdi: 202.
        La stå tomt for å hoppe over utløseroppdagelse.
      da: >-
        C-Bus app-ID for udløsergrupper (tastaturer, scener). Almindelig værdi:
        202. Lad stå tomt for at springe udløseroppdagelse over.
      cs: >-
        ID aplikace C-Bus pro skupiny spouštěčů (klávesnice, scény). Běžná
        hodnota: 202. Ponechte prázdné pro přeskočení objevování spouštěčů.
      uk: >-
        ID застосунку C-Bus для груп тригерів (клавіатури, сцени). Типове
        значення: 202. Залиште порожнім, щоб пропустити виявлення тригерів.
  ha_discovery_scene_enabled:
    name:
      en: Enable Scene Entities
      de: Szenen-Entitäten aktivieren
      es: Habilitar entidades de escena
      fr: Activer les entités de scène
      it: Abilita entità scena
      nl: Scène-entiteiten inschakelen
      pt: Ativar Entidades de Cena
      ru: Включить объекты сцен
      zh: 启用场景实体
      ja: シーンエンティティを有効化
      ko: 장면 엔티티 활성화
      pl: Włącz encje scen
      sv: Aktivera scenentiteter
      no: Aktiver sceneentiteter
      da: Aktivér sceneentiteter
      cs: Povolit entity scén
      uk: Увімкнути об'єкти сцен
    description:
      en: >-
        Create a Home Assistant scene entity for each trigger group, in addition
        to event and button entities. Default: enabled.
      de: >-
        Für jede Triggergruppe eine Home Assistant Szenen-Entität erstellen,
        zusätzlich zu Ereignis- und Tasten-Entitäten. Standard: aktiviert.
      es: >-
        Crear una entidad de escena de Home Assistant para cada grupo de
        trigger, además de las entidades de evento y botón. Predeterminado:
        habilitado.
      fr: >-
        Créer une entité de scène Home Assistant pour chaque groupe de
        déclencheur, en plus des entités d'événement et de bouton. Par défaut :
        activé.
      it: >-
        Creare un'entità scena di Home Assistant per ogni gruppo trigger, oltre
        alle entità evento e pulsante. Predefinito: abilitato.
      nl: >-
        Een Home Assistant scène-entiteit aanmaken voor elke triggergroep, naast
        gebeurtenis- en knop-entiteiten. Standaard: ingeschakeld.
      pt: >-
        Criar uma entidade de cena do Home Assistant para cada grupo de trigger,
        além das entidades de evento e botão. Predefinido: ativado.
      ru: >-
        Создавать объект сцены Home Assistant для каждой группы триггеров, в
        дополнение к объектам событий и кнопок. По умолчанию: включено.
      zh: >-
        为每个触发器组创建 Home Assistant 场景实体，除了事件和按钮实体。 默认：启用。
      ja: >-
        各トリガーグループに対して、イベントおよびボタンエンティティに加えて Home Assistant
        シーンエンティティを作成します。デフォルト：有効。
      ko: >-
        각 트리거 그룹에 대해 이벤트 및 버튼 엔티티 외에 Home Assistant 장면 엔티티를 생성합니다. 기본값: 활성화.
      pl: >-
        Utwórz encję sceny Home Assistant dla każdej grupy wyzwalaczy, oprócz
        encji zdarzeń i przycisków. Domyślnie: włączone.
      sv: >-
        Skapa en Home Assistant scenentitet för varje utlösargrupp, utöver
        händelse- och knappentiteter. Standard: aktiverat.
      no: >-
        Opprett en Home Assistant sceneentitet for hver utløsergruppe, i tillegg
        til hendelses- og knappentiteter. Standard: aktivert.
      da: >-
        Opret en Home Assistant sceneentitet for hver udløsergruppe, ud over
        hændelses- og knapentiteter. Standard: aktiveret.
      cs: >-
        Vytvořit entitu scény Home Assistant pro každou skupinu spouštěčů, navíc
        k entitám událostí a tlačítek. Výchozí: povoleno.
      uk: >-
        Створювати об'єкт сцени Home Assistant для кожної групи тригерів, на
        додаток до об'єктів подій та кнопок. За замовчуванням: увімкнено.
