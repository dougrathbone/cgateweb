      ja: >-
        スイッチグループ用の C-Bus アプリ ID。スイッチ検出をスキップするには 空のままにしてください。
      ko: >-
        스위치 그룹용 C-Bus 앱 ID. 스위치 검색을 건너뛰려면 비워 두세요.
      pl: >-
        ID aplikacji C-Bus dla grup przełączników. Pozostaw puste aby pominąć
        wykrywanie przełączników.
      sv: >-
        C-Bus app-ID för strömbrytargrupper. Lämna tomt för att hoppa över
