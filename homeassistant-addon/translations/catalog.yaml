  ha_discovery_type_from_label_prefix:
    name:
      en: Type From Label Prefix
      de: Typ aus Label-Präfix
      es: Tipo por prefijo de etiqueta
      fr: Type par préfixe d'étiquette
      it: Tipo da prefisso etichetta
      nl: Type uit labelprefix
      pt: Tipo por prefixo de etiqueta
      ru: Тип по префиксу метки
      zh: 从标签前缀识别类型
      ja: ラベルプレフィックスからタイプを判定
      ko: 레이블 접두사로 유형 결정
      pl: Typ z prefiksu etykiety
      sv: Typ från etiketttprefix
      no: Type fra etiketttprefiks
      da: Type fra label-præfiks
      cs: Typ z prefixu štítku
      uk: Тип за префіксом мітки
