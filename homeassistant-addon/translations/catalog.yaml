      cs: >-
        ID aplikace C-Bus pro skupiny spínačů. Ponechte prázdné pro přeskočení
        objevování spínačů.
      uk: >-
        ID застосунку C-Bus для груп вимикачів. Залиште порожнім, щоб пропустити
