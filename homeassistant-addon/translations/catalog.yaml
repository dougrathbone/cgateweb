      uk: >-
        Ключ API для операцій запису в редакторі міток. Задайте при відкритті
        порту 8080 за межами HA ingress.
  web_allow_unauthenticated_mutations:
    name:
      en: Allow Unauthenticated Web Writes (Unsafe)
      de: Unauthentifizierte Web-Schreibzugriffe erlauben (unsicher)
      es: Permitir escrituras web no autenticadas (inseguro)
      fr: Autoriser les écritures web non authentifiées (dangereux)
      it: Consenti scritture web non autenticate (non sicuro)
      nl: Ongeauthenticeerde webschrijfbewerkingen toestaan (onveilig)
      pt: Permitir Escritas Web Não Autenticadas (inseguro)
      ru: Разрешить неаутентифицированные веб-записи (небезопасно)
      zh: 允许未认证的 Web 写入（不安全）
      ja: 未認証の Web 書き込みを許可（安全でない）
      ko: 인증되지 않은 Web 쓰기 허용 (안전하지 않음)
      pl: Zezwól na nieuwierzytelnione zapisy web (niebezpieczne)
      sv: Tillåt oautentiserade webbskrivningar (osäkert)
      no: Tillat uautentiserte webskrivinger (usikkert)
      da: Tillad uautentificerede webskrivninger (usikkert)
      cs: Povolit neautentizované webové zápisy (nebezpečné)
      uk: Дозволити неавтентифіковані веб-записи (небезпечно)
    description:
      en: >-
        Allow write endpoints without an API key. Keep disabled unless you fully
        trust network access to this add-on.
      de: >-
        Schreibendpunkte ohne API-Schlüssel erlauben. Nur aktivieren, wenn Sie
        dem Netzwerkzugang zu diesem Add-on vollständig vertrauen.
      es: >-
        Permitir endpoints de escritura sin clave API. Mantener deshabilitado a
        menos que confíe plenamente en el acceso de red a este add-on.
      fr: >-
        Autoriser les endpoints d'écriture sans clé API. Garder désactivé sauf
        si vous faites entièrement confiance à l'accès réseau de ce module.
      it: >-
        Consentire endpoint di scrittura senza chiave API. Mantenere
        disabilitato a meno che non ci si fidi completamente dell'accesso di
        rete a questo componente aggiuntivo.
      nl: >-
        Schrijf-endpoints zonder API-sleutel toestaan. Uitgeschakeld houden
        tenzij u volledig vertrouwt op netwerktoegang tot deze add-on.
      pt: >-
        Permitir endpoints de escrita sem chave API. Manter desativado a menos
        que confie totalmente no acesso de rede a este add-on.
      ru: >-
        Разрешить конечные точки записи без ключа API. Оставить отключённым,
        если вы полностью не доверяете сетевому доступу к этому дополнению.
      zh: >-
        允许不带 API 密钥的写入端点。除非完全信任对此附加组件的网络访问， 否则保持禁用。
      ja: >-
        API キーなしで書き込みエンドポイントを許可します。このアドオンへの ネットワークアクセスを完全に信頼している場合を除き、無効のままに
        してください。
      ko: >-
        API 키 없이 쓰기 엔드포인트를 허용합니다. 이 애드온에 대한 네트워크 액세스를 완전히 신뢰하지 않는 한 비활성화 상태를
        유지하세요.
      pl: >-
        Zezwól na endpointy zapisu bez klucza API. Pozostaw wyłączone chyba że w
        pełni ufasz dostępowi sieciowemu do tego dodatku.
      sv: >-
        Tillåt skrivändpunkter utan API-nyckel. Behåll inaktiverat om du inte
        fullt ut litar på nätverksåtkomsten till detta tillägg.
      no: >-
        Tillat skriveendepunkter uten API-nøkkel. Behold deaktivert med mindre
        du fullt ut stoler på nettverkstilgangen til dette tillegget.
      da: >-
        Tillad skriveendepunkter uden API-nøgle. Behold deaktiveret medmindre du
        fuldt ud stoler på netværksadgangen til denne tilføjelse.
      cs: >-
        Povolit zápisové endpointy bez API klíče. Ponechte zakázané pokud plně
        nedůvěřujete síťovému přístupu k tomuto doplňku.
      uk: >-
        Дозволити кінцеві точки запису без ключа API. Залишити вимкненим, якщо
        ви повністю не довіряєте мережевому доступу до цього додатка.
  web_allowed_origins:
    name:
      en: Allowed Web Origins (CORS)
      de: Erlaubte Web-Ursprünge (CORS)
