      en: >-
        Treat a group label that starts with an entity-domain prefix as that
        device type for discovery (e.g. cover.bedroom_shutter becomes a cover,
        switch.porch_light a switch). Supported prefixes: light., cover.,
        switch., relay., pir. A manual type_overrides entry always wins. Off by
        default.
      de: >-
        Eine Gruppenbezeichnung mit Entitäts-Domain-Präfix als diesen Gerätetyp
        erkennen (z. B. wird cover.schlafzimmer_rollo zu einer Abdeckung,
        switch.terassen_licht zu einem Schalter). Unterstützte Präfixe: light.,
        cover., switch., relay., pir. Ein manueller type_overrides-Eintrag hat
        immer Vorrang. Standardmäßig deaktiviert.
      es: >-
        Tratar una etiqueta de grupo que empiece con un prefijo de dominio de
        entidad como ese tipo de dispositivo (p. ej. cover.persiana_dormitorio
        se convierte en cubierta, switch.luz_porche en interruptor). Prefijos
        soportados: light., cover., switch., relay., pir. Una entrada manual en
        type_overrides siempre tiene prioridad. Desactivado por defecto.
      fr: >-
        Traiter une étiquette de groupe commençant par un préfixe de domaine
        d'entité comme ce type d'appareil (p. ex. cover.volet_chambre devient
        une couverture, switch.lumiere_porche un interrupteur). Préfixes pris en
        charge : light., cover., switch., relay., pir. Une entrée manuelle
        type_overrides est toujours prioritaire. Désactivé par défaut.
      it: >-
        Considera un'etichetta di gruppo che inizia con un prefisso di dominio
        entità come quel tipo di dispositivo (es. cover.tapparella_camera
        diventa una copertura, switch.luce_portico un interruttore). Prefissi
        supportati: light., cover., switch., relay., pir. Una voce manuale
        type_overrides ha sempre la precedenza. Disattivato per impostazione
        predefinita.
      nl: >-
        Behandel een groepslabel dat begint met een entiteitsdomein-prefix als
        dat apparaattype (bijv. cover.slaapkamer_luik wordt een cover,
        switch.verandalamp een schakelaar). Ondersteunde prefixes: light.,
        cover., switch., relay., pir. Een handmatige type_overrides-vermelding
        gaat altijd voor. Standaard uit.
      pt: >-
        Tratar uma etiqueta de grupo que comece com um prefixo de domínio de
        entidade como esse tipo de dispositivo (ex.: cover.estore_quarto
        torna-se uma cobertura, switch.luz_alpendre um interruptor). Prefixos
        suportados: light., cover., switch., relay., pir. Uma entrada manual em
        type_overrides tem sempre prioridade. Desativado por predefinição.
      ru: >-
        Считать метку группы, начинающуюся с префикса домена сущности, этим
        типом устройства (напр., cover.rolstavni_spalnya станет покрытием,
        switch.svet_kryltso — выключателем). Поддерживаемые префиксы: light.,
        cover., switch., relay., pir. Ручная запись type_overrides всегда имеет
        приоритет. По умолчанию выключено.
      zh: >-
        将以实体域前缀开头的组标签识别为对应设备类型(例如 cover.bedroom_shutter 识别为窗帘,switch.porch_light
        识别为开关)。支持的前缀:light.、cover.、switch.、relay.、pir.。手动 type_overrides
        条目始终优先。默认关闭。
      ja: >-
        エンティティドメインプレフィックスで始まるグループラベルを、そのデバイスタイプとして検出します(例:cover.bedroom_shutter
        はカバー、switch.porch_light はスイッチ)。対応プレフィックス:
        light.、cover.、switch.、relay.、pir.。手動の type_overrides
        エントリが常に優先されます。デフォルトはオフです。
      ko: >-
        엔티티 도메인 접두사로 시작하는 그룹 레이블을 해당 장치 유형으로 인식합니다(예: cover.bedroom_shutter는 커버,
        switch.porch_light는 스위치). 지원 접두사: light., cover., switch., relay., pir.
        수동 type_overrides 항목이 항상 우선합니다. 기본값은 꺼짐입니다.
      pl: >-
        Traktuj etykietę grupy zaczynającą się od prefiksu domeny encji jako ten
        typ urządzenia (np. cover.zaluzje_sypialnia stanie się roletą,
        switch.swiatlo_ganek przełącznikiem). Obsługiwane prefiksy: light.,
        cover., switch., relay., pir. Ręczny wpis type_overrides zawsze ma
        pierwszeństwo. Domyślnie wyłączone.
      sv: >-
        Behandla en gruppetikett som börjar med ett entitetsdomänprefix som den
        enhetstypen (t.ex. cover.sovrum_persienn blir en cover,
        switch.altan_ljus en switch). Prefix som stöds: light., cover., switch.,
        relay., pir. En manuell type_overrides-post vinner alltid. Av som
        standard.
      no: >-
        Behandle en gruppeetikett som starter med et entitetsdomene-prefiks som
        den enhetstypen (f.eks. cover.soverom_persienne blir en cover,
        switch.terrasse_lys en switch). Støttede prefikser: light., cover.,
        switch., relay., pir. En manuell type_overrides-oppføring vinner alltid.
        Av som standard.
      da: >-
        Behandl en gruppelabel, der starter med et entitetsdomæne-præfiks, som
        den enhedstype (f.eks. cover.sovevaerelse_persienne bliver en cover,
        switch.have_lys en switch). Understøttede præfikser: light., cover.,
        switch., relay., pir. En manuel type_overrides-post vinder altid. Fra
        som standard.
      cs: >-
        Považovat štítek skupiny začínající prefixem domény entity za tento typ
        zařízení (např. cover.rolety_loznice se stane krytem,
        switch.svetlo_veranda spínačem). Podporované prefixy: light., cover.,
        switch., relay., pir. Ruční záznam type_overrides má vždy přednost. Ve
        výchozím stavu vypnuto.
      uk: >-
        Вважати мітку групи, що починається з префікса домену сутності, цим
        типом пристрою (напр., cover.rollety_spalnya стане покриттям,
        switch.svitlo_ganok — перемикачем). Підтримувані префікси: light.,
        cover., switch., relay., pir. Ручний запис type_overrides завжди має
        пріоритет. За замовчуванням вимкнено.
  ha_discovery_type_from_unit:
    name:
      en: Set entity type from C-Bus unit type
      de: Typ aus C-Bus-Gerätetyp
      es: Tipo por tipo de unidad C-Bus
      fr: Type selon le type d'unité C-Bus
      it: Tipo dal tipo di unità C-Bus
      nl: Type uit C-Bus-unittype
      pt: Tipo pelo tipo de unidade C-Bus
      ru: Тип по типу устройства C-Bus
      zh: 从 C-Bus 单元类型识别类型
      ja: C-Bus ユニットタイプからタイプを判定
      ko: C-Bus 유닛 유형으로 유형 결정
      pl: Typ z typu jednostki C-Bus
      sv: Typ från C-Bus-enhetstyp
      no: Type fra C-Bus-enhetstype
      da: Type fra C-Bus-enhedstype
      cs: Typ z typu jednotky C-Bus
      uk: Тип за типом пристрою C-Bus
    description:
      en: >-
        Decide each entity's type from the C-Bus unit that drives the group, for
        groups whose name does not already identify a cover. Dimmer channels
        become dimmable lights, relay channels become on/off lights, and groups
        driven only by an input unit such as a bus coupler become binary
        sensors. Manual type_overrides entries and a cover-identifying name
        (e.g. blind, shutter) still take priority, since a relay can equally
        drive a light, a blind or a valve. Groups driven by unrecognised unit
        types are left unchanged. Turning this on can change the type of
        entities you already have.
      de: >-
        Den Typ jeder Entität aus dem C-Bus-Gerät bestimmen, das die Gruppe
        ansteuert, sofern der Name der Gruppe nicht bereits eine Jalousie
        erkennen lässt. Dimmer-Kanäle werden dimmbare Lichter, Relais-Kanäle
        werden Ein/Aus-Lichter, und Gruppen, die nur von einem Eingangsgerät wie
        einem Bus Coupler angesteuert werden, werden Binärsensoren. Manuelle
        type_overrides-Einträge und ein Name, der eine Jalousie erkennen lässt
        (z. B. blind, shutter), haben weiterhin Vorrang, da ein Relais ebenso
        ein Licht, eine Jalousie oder ein Ventil ansteuern kann. Gruppen mit
        unbekanntem Gerätetyp bleiben unverändert. Das Aktivieren kann den Typ
        bereits vorhandener Entitäten ändern.
      es: >-
        Determinar el tipo de cada entidad a partir de la unidad C-Bus que
        controla el grupo, para los grupos cuyo nombre no identifique ya una
        persiana. Los canales de dimmer se convierten en luces regulables, los
        canales de relé en luces de encendido/apagado, y los grupos controlados
        solo por una unidad de entrada como un bus coupler en sensores binarios.
        Las entradas manuales en type_overrides y un nombre que identifique una
        persiana (p. ej. blind, shutter) siguen teniendo prioridad, ya que un
        relé puede controlar igualmente una luz, una persiana o una válvula. Los
        grupos con tipos de unidad no reconocidos quedan sin cambios. Activarlo
        puede cambiar el tipo de entidades que ya tienes.
      fr: >-
        Déterminer le type de chaque entité d'après l'unité C-Bus qui pilote le
        groupe, pour les groupes dont le nom n'identifie pas déjà un volet. Les
        canaux de variateur deviennent des lumières variables, les canaux de
        relais des lumières marche/arrêt, et les groupes pilotés uniquement par
        une unité d'entrée telle qu'un bus coupler des capteurs binaires. Une
        entrée manuelle type_overrides et un nom identifiant un volet (par ex.
        blind, shutter) restent prioritaires, car un relais peut tout aussi bien
        piloter une lumière, un volet ou une vanne. Les groupes pilotés par des
        types d'unité non reconnus restent inchangés. L'activer peut changer le
        type d'entités déjà existantes.
      it: >-
        Determina il tipo di ogni entità dall'unità C-Bus che comanda il gruppo,
        per i gruppi il cui nome non identifica già una tapparella. I canali
        dimmer diventano luci dimmerabili, i canali relè luci on/off e i gruppi
        comandati solo da un'unità di ingresso come un bus coupler diventano
        sensori binari. Le voci manuali type_overrides e un nome che identifica
        una tapparella (es. blind, shutter) hanno ancora la precedenza, poiché
        un relè può comandare altrettanto bene una luce, una tapparella o una
        valvola. I gruppi comandati da tipi di unità non riconosciuti restano
        invariati. Attivarlo può cambiare il tipo di entità già esistenti.
      nl: >-
        Bepaal het type van elke entiteit op basis van de C-Bus-unit die de
        groep aanstuurt, voor groepen waarvan de naam nog geen zonwering
        aanduidt. Dimmerkanalen worden dimbare lampen, relaiskanalen
        aan/uit-lampen, en groepen die alleen door een invoerunit zoals een bus
        coupler worden aangestuurd worden binaire sensoren. Een handmatige
        type_overrides-vermelding en een naam die zonwering aanduidt (bijv.
        blind, shutter) gaan nog steeds voor, omdat een relais net zo goed een
        lamp, zonwering of een klep kan aansturen. Groepen met niet-herkende
        unittypes blijven onveranderd. Dit aanzetten kan het type van bestaande
        entiteiten wijzigen.
      pt: >-
        Determinar o tipo de cada entidade a partir da unidade C-Bus que comanda
        o grupo, para grupos cujo nome ainda não identifique um estore. Canais
        de dimmer tornam-se luzes reguláveis, canais de relé luzes de
        ligar/desligar e grupos comandados apenas por uma unidade de entrada
        como um bus coupler tornam-se sensores binários. Uma entrada manual em
        type_overrides e um nome que identifique um estore (por ex. blind,
        shutter) continuam a ter prioridade, já que um relé pode igualmente
        comandar uma luz, um estore ou uma válvula. Os grupos com tipos de
        unidade não reconhecidos ficam inalterados. Ativar isto pode alterar o
        tipo de entidades que já existem.
      ru: >-
        Определять тип каждой сущности по устройству C-Bus, которое управляет
        группой, — для групп, имя которых само по себе не указывает на штору.
        Каналы диммера становятся регулируемыми светильниками, каналы реле —
        светильниками вкл/выкл, а группы, к которым подключено только устройство
        ввода (например, bus coupler), — бинарными сенсорами. Ручная запись
        type_overrides и имя, указывающее на штору (например, blind, shutter),
        по-прежнему имеют приоритет, поскольку реле может с равным успехом
        управлять светом, шторой или клапаном. Группы с нераспознанными типами
        устройств остаются без изменений. Включение может изменить тип уже
        существующих сущностей.
      zh: >-
        对于组名称尚未表明是遮阳帘的组,根据驱动该组的 C-Bus
        单元类型来决定每个实体的类型。调光器通道识别为可调光灯,继电器通道识别为开关式灯,仅由输入单元(例如 bus
        coupler)驱动的组识别为二元传感器。手动 type_overrides 条目以及能识别遮阳帘的名称(例如
        blind、shutter)仍然优先,因为继电器同样可以驱动灯、遮阳帘或阀门。由无法识别的单元类型驱动的组保持不变。开启此项可能会改变现有实体的类型。
      ja: >-
        グループ名がすでにブラインドであると判別できない場合、各エンティティのタイプをそのグループを駆動する C-Bus
        ユニットから判定します。調光器チャンネルは調光可能なライト、リレーチャンネルはオン/オフのライト、bus coupler
        などの入力ユニットのみが接続されたグループはバイナリセンサーになります。手動の type_overrides
        エントリと、ブラインドであると判別できる名前(例:
        blind、shutter)は引き続き優先されます。リレーはライト、ブラインド、バルブのいずれも駆動しうるためです。認識できないユニットタイプのグループは変更されません。これを有効にすると、既存のエンティティのタイプが変わる場合があります。
      ko: >-
        그룹 이름이 이미 블라인드를 나타내지 않는 그룹에 한해, 각 엔티티의 유형을 그룹을 구동하는 C-Bus 유닛에서 결정합니다. 디머
        채널은 밝기 조절 조명, 릴레이 채널은 켜기/끄기 조명이 되고, bus coupler 같은 입력 유닛만 연결된 그룹은 바이너리
        센서가 됩니다. 수동 type_overrides 항목과 블라인드를 나타내는 이름(예: blind, shutter)이 여전히
        우선하는데, 릴레이는 조명뿐 아니라 블라인드나 밸브도 구동할 수 있기 때문입니다. 인식할 수 없는 유닛 유형으로 구동되는 그룹은
        그대로 유지됩니다. 이 기능을 켜면 이미 있는 엔티티의 유형이 바뀔 수 있습니다.
      pl: >-
        Ustal typ każdej encji na podstawie jednostki C-Bus, która steruje
        grupą, dla grup, których nazwa nie wskazuje już na roletę. Kanały
        ściemniacza stają się ściemnialnymi światłami, kanały przekaźnika
        światłami wł/wył, a grupy sterowane wyłącznie przez jednostkę wejściową,
        taką jak bus coupler, stają się sensorami binarnymi. Ręczny wpis
        type_overrides oraz nazwa wskazująca na roletę (np. blind, shutter)
        nadal mają pierwszeństwo, ponieważ przekaźnik może równie dobrze
        sterować światłem, roletą lub zaworem. Grupy sterowane przez
        nierozpoznane typy jednostek pozostają bez zmian. Włączenie tej opcji
        może zmienić typ już istniejących encji.
      sv: >-
        Bestäm varje entitets typ utifrån den C-Bus-enhet som styr gruppen, för
        grupper vars namn inte redan identifierar en persienn. Dimmerkanaler
        blir dimbara lampor, reläkanaler blir på/av-lampor och grupper som bara
        styrs av en ingångsenhet som en bus coupler blir binära sensorer. En
        manuell type_overrides-post och ett namn som identifierar en persienn
        (t.ex. blind, shutter) vinner fortfarande, eftersom ett relä lika gärna
        kan styra en lampa, en persienn eller en ventil. Grupper med okända
        enhetstyper lämnas oförändrade. Att slå på detta kan ändra typen på
        entiteter du redan har.
      no: >-
        Bestem typen til hver entitet ut fra C-Bus-enheten som styrer gruppen,
        for grupper der navnet ikke allerede identifiserer en persienne.
        Dimmerkanaler blir dimbare lys, relékanaler blir av/på-lys, og grupper
        som bare styres av en inngangsenhet som en bus coupler blir binære
        sensorer. En manuell type_overrides-oppføring og et navn som
        identifiserer en persienne (f.eks. blind, shutter) vinner fortsatt,
        siden et relé like gjerne kan styre et lys, en persienne eller en
        ventil. Grupper med ukjente enhetstyper forblir uendret. Å slå dette på
        kan endre typen på entiteter du allerede har.
      da: >-
        Bestem hver entitets type ud fra den C-Bus-enhed, der styrer gruppen,
        for grupper hvis navn ikke allerede identificerer en persienne.
        Dæmperkanaler bliver dæmpbare lys, relækanaler bliver tænd/sluk-lys, og
        grupper der kun styres af en indgangsenhed som en bus coupler bliver
        binære sensorer. En manuel type_overrides-post og et
        persienne-identificerende navn (f.eks. blind, shutter) vinder stadig, da
        et relæ lige så godt kan styre et lys, en persienne eller en ventil.
        Grupper med ukendte enhedstyper forbliver uændrede. At slå dette til kan
        ændre typen på entiteter, du allerede har.
      cs: >-
        Určit typ každé entity podle jednotky C-Bus, která skupinu ovládá, u
        skupin, jejichž název sám o sobě neurčuje roletu. Kanály stmívače se
        stanou stmívatelnými světly, kanály relé světly zap/vyp a skupiny
        ovládané pouze vstupní jednotkou, například bus coupler, se stanou
        binárními senzory. Ruční záznam type_overrides i název určující roletu
        (např. blind, shutter) mají stále přednost, protože relé může stejně
        dobře ovládat světlo, roletu nebo ventil. Skupiny ovládané
        nerozpoznanými typy jednotek zůstanou nezměněné. Zapnutí může změnit typ
        entit, které již máte.
      uk: >-
        Визначати тип кожної сутності за пристроєм C-Bus, який керує групою, —
        для груп, назва яких сама по собі не вказує на штору. Канали димера
        стають регульованими світильниками, канали реле — світильниками
        увімк/вимк, а групи, до яких підключено лише пристрій входу (наприклад,
        bus coupler), — бінарними сенсорами. Ручний запис type_overrides і
        назва, що вказує на штору (наприклад, blind, shutter), досі мають
        пріоритет, оскільки реле може так само керувати світлом, шторою або
        клапаном. Групи з нерозпізнаними типами пристроїв залишаються без змін.
        Увімкнення може змінити тип уже наявних сутностей.
