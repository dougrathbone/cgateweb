      it: Prefisso del tema Discovery
      nl: Discovery Topicprefix
      pt: Prefixo do Tópico Discovery
      ru: Префикс топика Discovery
      zh: Discovery 主题前缀
      ja: Discovery トピックプレフィックス
      ko: Discovery 토픽 접두사
      pl: Prefiks tematu Discovery
      sv: Discovery ämnesprefix
      no: Discovery emneprefiks
      da: Discovery emnepræfiks
      cs: Prefix tématu Discovery
      uk: Префікс топіка Discovery
    description:
      en: >-
        MQTT topic prefix for HA Discovery messages. Must match your Home
        Assistant MQTT discovery prefix. Default: homeassistant.
      de: >-
        MQTT Topic-Präfix für HA Discovery Nachrichten. Muss mit Ihrem Home
        Assistant MQTT Discovery Präfix übereinstimmen. Standard: homeassistant.
      es: >-
        Prefijo del tema MQTT para mensajes de HA Discovery. Debe coincidir con
        el prefijo de MQTT Discovery de su Home Assistant. Predeterminado:
        homeassistant.
      fr: >-
        Préfixe du sujet MQTT pour les messages HA Discovery. Doit correspondre
        au préfixe MQTT Discovery de votre Home Assistant. Par défaut :
        homeassistant.
      it: >-
        Prefisso del tema MQTT per i messaggi HA Discovery. Deve corrispondere
        al prefisso MQTT Discovery del proprio Home Assistant. Predefinito:
        homeassistant.
      nl: >-
        MQTT topicprefix voor HA Discovery berichten. Moet overeenkomen met uw
        Home Assistant MQTT Discovery prefix. Standaard: homeassistant.
      pt: >-
        Prefixo do tópico MQTT para mensagens de HA Discovery. Deve corresponder
        ao prefixo de MQTT Discovery do seu Home Assistant. Predefinido:
        homeassistant.
      ru: >-
        Префикс топика MQTT для сообщений HA Discovery. Должен совпадать с
        префиксом MQTT Discovery вашего Home Assistant. По умолчанию:
        homeassistant.
      zh: >-
        HA Discovery 消息的 MQTT 主题前缀。必须与您的 Home Assistant MQTT Discovery
        前缀匹配。默认：homeassistant。
      ja: >-
        HA Discovery メッセージの MQTT トピックプレフィックス。Home Assistant の MQTT Discovery
        プレフィックスと一致させる必要が あります。デフォルト：homeassistant。
      ko: >-
        HA Discovery 메시지의 MQTT 토픽 접두사. Home Assistant의 MQTT Discovery 접두사와 일치해야
        합니다. 기본값: homeassistant.
      pl: >-
        Prefiks tematu MQTT dla wiadomości HA Discovery. Musi być zgodny z
        prefiksem MQTT Discovery w Home Assistant. Domyślnie: homeassistant.
      sv: >-
        MQTT ämnesprefix för HA Discovery meddelanden. Måste matcha ditt Home
        Assistant MQTT Discovery prefix. Standard: homeassistant.
      no: >-
        MQTT emneprefiks for HA Discovery meldinger. Må samsvare med ditt Home
        Assistant MQTT Discovery prefiks. Standard: homeassistant.
      da: >-
        MQTT emnepræfiks for HA Discovery beskeder. Skal matche dit Home
        Assistant MQTT Discovery præfiks. Standard: homeassistant.
      cs: >-
        Prefix MQTT tématu pro zprávy HA Discovery. Musí odpovídat vašemu
        prefixu MQTT Discovery v Home Assistant. Výchozí: homeassistant.
      uk: >-
        Префікс топіка MQTT для повідомлень HA Discovery. Має збігатися з
        префіксом MQTT Discovery вашого Home Assistant. За замовчуванням:
        homeassistant.
  ha_discovery_networks:
    name:
      en: Discovery Networks
      de: Discovery Netzwerke
      es: Redes de Discovery
      fr: Réseaux Discovery
      it: Reti Discovery
      nl: Discovery Netwerken
      pt: Redes de Discovery
      ru: Сети Discovery
      zh: Discovery 网络
      ja: Discovery ネットワーク
      ko: Discovery 네트워크
      pl: Sieci Discovery
      sv: Discovery nätverk
      no: Discovery nettverk
      da: Discovery netværk
      cs: Sítě Discovery
      uk: Мережі Discovery
    description:
      en: >-
        C-Bus network IDs to scan for device discovery. If empty, uses the
        networks from "C-Bus Networks to Monitor". Default: 254.
      de: >-
        C-Bus Netzwerk-IDs zum Scannen für die Geräteerkennung. Wenn leer,
        werden die Netzwerke aus "Zu überwachende C-Bus Netzwerke" verwendet.
        Standard: 254.
      es: >-
        IDs de red C-Bus para escanear en busca de dispositivos. Si está vacío,
        usa las redes de "Redes C-Bus a monitorizar". Predeterminado: 254.
      fr: >-
        IDs de réseau C-Bus à scanner pour la découverte des appareils. Si vide,
        utilise les réseaux de "Réseaux C-Bus à surveiller". Par défaut : 254.
      it: >-
        ID di rete C-Bus da scansionare per il rilevamento dei dispositivi. Se
        vuoto, usa le reti da "Reti C-Bus da monitorare". Predefinito: 254.
      nl: >-
        C-Bus netwerk-ID's om te scannen voor apparaatdetectie. Indien leeg,
        worden de netwerken uit "Te monitoren C-Bus netwerken" gebruikt.
        Standaard: 254.
      pt: >-
        IDs de rede C-Bus para pesquisar dispositivos. Se vazio, usa as redes de
        "Redes C-Bus a Monitorizar". Predefinido: 254.
      ru: >-
        Идентификаторы сетей C-Bus для сканирования при обнаружении устройств.
        Если пусто, используются сети из «Сети C-Bus для мониторинга». По
        умолчанию: 254.
      zh: >-
        用于设备发现扫描的 C-Bus 网络 ID。如果为空，则使用"监控的 C-Bus 网络"中的网络。默认：254。
      ja: >-
        デバイス検出のためにスキャンする C-Bus ネットワーク ID。空の場合、 「監視する C-Bus ネットワーク」のネットワークを使用します。
        デフォルト：254。
      ko: >-
        장치 검색을 위해 스캔할 C-Bus 네트워크 ID. 비어 있으면 "모니터링할 C-Bus 네트워크"의 네트워크를 사용합니다.
        기본값: 254.
      pl: >-
        Identyfikatory sieci C-Bus do skanowania w celu wykrywania urządzeń.
        Jeśli puste, używane są sieci z "Sieci C-Bus do monitorowania".
        Domyślnie: 254.
      sv: >-
        C-Bus nätverks-ID:n att skanna för enhetsupptäckt. Om tomt, används
        nätverken från "C-Bus nätverk att övervaka". Standard: 254.
      no: >-
        C-Bus nettverks-IDer å skanne for enhetsoppdagelse. Hvis tomt, brukes
        nettverkene fra "C-Bus nettverk å overvåke". Standard: 254.
      da: >-
        C-Bus netværks-ID'er der skal scannes for enhedsopdagelse. Hvis tomt,
        bruges netværkene fra "C-Bus netværk at overvåge". Standard: 254.
      cs: >-
        ID sítí C-Bus ke skenování pro objevování zařízení. Pokud je prázdné,
        použijí se sítě z "Sítě C-Bus ke sledování". Výchozí: 254.
      uk: >-
        Ідентифікатори мереж C-Bus для сканування при виявленні пристроїв. Якщо
        порожньо, використовуються мережі з «Мережі C-Bus для моніторингу». За
        замовчуванням: 254.
  ha_discovery_cover_app_id:
    name:
      en: Cover Application ID
      de: Abdeckungs-Anwendungs-ID
      es: ID de aplicación para cubiertas
      fr: ID d'application pour les volets
      it: ID applicazione per coperture
      nl: Cover Applicatie-ID
      pt: ID de Aplicação de Estores
      ru: ID приложения для штор
      zh: 窗帘应用程序 ID
      ja: カバーアプリケーション ID
      ko: 커버 애플리케이션 ID
      pl: ID aplikacji osłon
      sv: Applikations-ID för skydd
      no: Applikasjons-ID for tildekking
      da: Applikations-ID for afdækninger
      cs: ID aplikace pro kryty
      uk: ID застосунку для штор
    description:
      en: >-
        C-Bus app ID for covers (blinds, shutters, garage doors). Common value:
        203 (Enable Control). Leave empty to skip cover discovery.
      de: >-
        C-Bus App-ID für Abdeckungen (Jalousien, Rollläden, Garagentore).
        Üblicher Wert: 203 (Enable Control). Leer lassen, um Abdeckungserkennung
        zu überspringen.
      es: >-
        ID de app C-Bus para cubiertas (persianas, contraventanas, puertas de
        garaje). Valor común: 203 (Enable Control). Dejar vacío para omitir el
        descubrimiento de cubiertas.
      fr: >-
        ID d'app C-Bus pour les volets (stores, volets roulants, portes de
        garage). Valeur courante : 203 (Enable Control). Laisser vide pour
        ignorer la découverte des volets.
      it: >-
        ID app C-Bus per coperture (tapparelle, persiane, porte del garage).
        Valore comune: 203 (Enable Control). Lasciare vuoto per saltare il
        rilevamento delle coperture.
      nl: >-
        C-Bus app-ID voor covers (rolluiken, jaloezieën, garagedeuren).
        Veelgebruikte waarde: 203 (Enable Control). Laat leeg om cover-detectie
        over te slaan.
      pt: >-
        ID de app C-Bus para estores (persianas, portadas, portas de garagem).
        Valor comum: 203 (Enable Control). Deixe vazio para ignorar a descoberta
        de estores.
      ru: >-
        ID приложения C-Bus для штор (жалюзи, рольставни, гаражные ворота).
        Обычное значение: 203 (Enable Control). Оставьте пустым, чтобы
        пропустить обнаружение штор.
      zh: >-
        用于窗帘（百叶窗、卷帘、车库门）的 C-Bus 应用 ID。常用值：203 （Enable Control）。留空以跳过窗帘发现。
      ja: >-
        カバー（ブラインド、シャッター、ガレージドア）用の C-Bus アプリ ID。一般的な値：203（Enable
        Control）。カバー検出をスキップするには 空のままにしてください。
      ko: >-
        커버 (블라인드, 셔터, 차고문)용 C-Bus 앱 ID. 일반적인 값: 203 (Enable Control). 커버 검색을
        건너뛰려면 비워 두세요.
      pl: >-
        ID aplikacji C-Bus dla osłon (żaluzje, rolety, bramy garażowe). Typowa
        wartość: 203 (Enable Control). Pozostaw puste aby pominąć wykrywanie
        osłon.
      sv: >-
        C-Bus app-ID för skydd (persienner, rullgardiner, garageportar). Vanligt
        värde: 203 (Enable Control). Lämna tomt för att hoppa över
        skyddsupptäckt.
      no: >-
        C-Bus app-ID for tildekkinger (persienner, rullegardiner,
        garasjeporter). Vanlig verdi: 203 (Enable Control). La stå tomt for å
        hoppe over tildekkingsoppdagelse.
      da: >-
        C-Bus app-ID for afdækninger (persienner, rullegardiner, garageporte).
        Almindelig værdi: 203 (Enable Control). Lad stå tomt for at springe
        afdækningsopdagelse over.
      cs: >-
        ID aplikace C-Bus pro kryty (žaluzie, rolety, garážová vrata). Běžná
        hodnota: 203 (Enable Control). Ponechte prázdné pro přeskočení
        objevování krytů.
      uk: >-
        ID застосунку C-Bus для штор (жалюзі, ролети, гаражні ворота). Типове
        значення: 203 (Enable Control). Залиште порожнім, щоб пропустити
        виявлення штор.
  ha_discovery_cover_tilt_app_id:
    name:
      en: Cover Tilt Application ID
      de: Abdeckungs-Neigungsanwendungs-ID
      es: ID de aplicación para inclinación de cubiertas
      fr: ID d'application pour l'inclinaison des volets
      it: ID applicazione per inclinazione coperture
      nl: Cover Kantel Applicatie-ID
      pt: ID de Aplicação de Inclinação de Estores
      ru: ID приложения для наклона штор
      zh: 窗帘倾斜应用程序 ID
      ja: カバー傾斜アプリケーション ID
      ko: 커버 틸트 애플리케이션 ID
      pl: ID aplikacji pochylenia osłon
      sv: Applikations-ID för skyddslutning
      no: Applikasjons-ID for tildekkingsvipp
      da: Applikations-ID for afdækningstilt
      cs: ID aplikace pro naklápění krytů
      uk: ID застосунку для нахилу штор
    description:
      en: >-
        C-Bus app ID for venetian blind tilt control. Paired by group number
        with covers. Leave empty to skip tilt.
      de: >-
        C-Bus App-ID für die Neigungssteuerung von Jalousien. Wird über die
        Gruppennummer mit Abdeckungen gepaart. Leer lassen, um Neigung zu
        überspringen.
      es: >-
        ID de app C-Bus para control de inclinación de persianas venecianas. Se
        empareja por número de grupo con las cubiertas. Dejar vacío para omitir
        la inclinación.
      fr: >-
        ID d'app C-Bus pour le contrôle d'inclinaison des stores vénitiens.
        Associé par numéro de groupe aux volets. Laisser vide pour ignorer
        l'inclinaison.
      it: >-
        ID app C-Bus per il controllo dell'inclinazione delle veneziane.
        Abbinato per numero di gruppo alle coperture. Lasciare vuoto per saltare
        l'inclinazione.
      nl: >-
        C-Bus app-ID voor kantelbesturing van jaloezieën. Gekoppeld op
        groepsnummer aan covers. Laat leeg om kanteling over te slaan.
      pt: >-
        ID de app C-Bus para controlo de inclinação de persianas venezianas.
        Emparelhado por número de grupo com os estores. Deixe vazio para ignorar
        a inclinação.
      ru: >-
        ID приложения C-Bus для управления наклоном жалюзи. Связывается по
        номеру группы со шторами. Оставьте пустым, чтобы пропустить наклон.
      zh: >-
        用于百叶窗倾斜控制的 C-Bus 应用 ID。通过组号与窗帘配对。留空以 跳过倾斜。
      ja: >-
        ベネチアンブラインドの傾斜制御用の C-Bus アプリ ID。グループ番号で カバーとペアリングされます。傾斜をスキップするには空のままにして
        ください。
      ko: >-
        베네치안 블라인드 틸트 제어용 C-Bus 앱 ID. 그룹 번호로 커버와 페어링됩니다. 틸트를 건너뛰려면 비워 두세요.
      pl: >-
        ID aplikacji C-Bus dla sterowania pochyleniem żaluzji weneckich.
        Powiązane z osłonami po numerze grupy. Pozostaw puste aby pominąć
        pochylenie.
      sv: >-
        C-Bus app-ID för lutningsstyrning av persienner. Kopplas via gruppnummer
        med skydd. Lämna tomt för att hoppa över lutning.
      no: >-
        C-Bus app-ID for vippekontroll av persienner. Kobles via gruppenummer
        med tildekkinger. La stå tomt for å hoppe over vipp.
      da: >-
        C-Bus app-ID for tiltstyring af persienner. Kobles via gruppenummer med
        afdækninger. Lad stå tomt for at springe tilt over.
      cs: >-
        ID aplikace C-Bus pro ovládání naklápění žaluzií. Párováno podle čísla
        skupiny s kryty. Ponechte prázdné pro přeskočení naklápění.
      uk: >-
        ID застосунку C-Bus для керування нахилом жалюзі. Пов'язується за
        номером групи зі шторами. Залиште порожнім, щоб пропустити нахил.
