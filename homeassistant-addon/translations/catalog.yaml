# Source of truth for Home Assistant add-on UI translations.
# Edit this catalog (section → option → name|description → locale), then run:
#   npm run generate:translations
# Generated {locale}.yaml files are committed for HA Supervisor compatibility.
configuration:
  cgate_mode:
    name:
      en: C-Gate Mode
      de: C-Gate Modus
      es: Modo de C-Gate
      fr: Mode C-Gate
      it: Modalità C-Gate
      nl: C-Gate Modus
      pt: Modo C-Gate
      ru: Режим C-Gate
      zh: C-Gate 模式
      ja: C-Gate モード
      ko: C-Gate 모드
      pl: Tryb C-Gate
      sv: C-Gate läge
      no: C-Gate modus
      da: C-Gate tilstand
      cs: Režim C-Gate
      uk: Режим C-Gate
    description:
      en: >-
        How C-Gate is provided. "remote" connects to a C-Gate server running
        elsewhere on your network (most common). "managed" downloads and runs
        C-Gate locally inside this add-on.
      de: >-
        Wie C-Gate bereitgestellt wird. "remote" verbindet sich mit einem C-Gate
        Server an anderer Stelle in Ihrem Netzwerk (häufigster Fall). "managed"
        lädt C-Gate herunter und führt es lokal in diesem Add-on aus.
      es: >-
        Cómo se proporciona C-Gate. "remote" se conecta a un servidor C-Gate en
        otro lugar de su red (lo más común). "managed" descarga y ejecuta C-Gate
        localmente dentro de este add-on.
      fr: >-
        Comment C-Gate est fourni. "remote" se connecte à un serveur C-Gate
        fonctionnant ailleurs sur votre réseau (le plus courant). "managed"
        télécharge et exécute C-Gate localement dans ce module.
      it: >-
        Come viene fornito C-Gate. "remote" si connette a un server C-Gate in
        esecuzione altrove nella rete (più comune). "managed" scarica ed esegue
        C-Gate localmente all'interno di questo componente aggiuntivo.
      nl: >-
        Hoe C-Gate wordt aangeboden. "remote" maakt verbinding met een C-Gate
        server die elders op uw netwerk draait (meest voorkomend). "managed"
        downloadt en draait C-Gate lokaal binnen deze add-on.
      pt: >-
        Como o C-Gate é fornecido. "remote" liga-se a um servidor C-Gate noutro
        local da sua rede (mais comum). "managed" transfere e executa o C-Gate
        localmente dentro deste add-on.
      ru: >-
        Способ предоставления C-Gate. "remote" подключается к серверу C-Gate,
        работающему в другом месте вашей сети (наиболее распространённый).
        "managed" загружает и запускает C-Gate локально внутри этого дополнения.
      zh: >-
        C-Gate 的提供方式。"remote" 连接到网络上其他位置运行的 C-Gate 服务器 （最常见）。"managed"
        在此附加组件内本地下载并运行 C-Gate。
      ja: >-
        C-Gate の提供方法。"remote" はネットワーク上の別の場所で動作している C-Gate
        サーバーに接続します（最も一般的）。"managed" はこのアドオン内で C-Gate をローカルにダウンロードして実行します。
      ko: >-
        C-Gate 제공 방식. "remote"는 네트워크의 다른 곳에서 실행 중인 C-Gate 서버에 연결합니다 (가장 일반적).
        "managed"는 이 애드온 내에서 C-Gate를 로컬로 다운로드하여 실행합니다.
      pl: >-
        Sposób udostępniania C-Gate. "remote" łączy się z serwerem C-Gate
        działającym w innym miejscu sieci (najczęstsze). "managed" pobiera i
        uruchamia C-Gate lokalnie w tym dodatku.
      sv: >-
        Hur C-Gate tillhandahålls. "remote" ansluter till en C-Gate server som
        körs någon annanstans i ditt nätverk (vanligast). "managed" laddar ner
        och kör C-Gate lokalt i detta tillägg.
      no: >-
        Hvordan C-Gate tilbys. "remote" kobler til en C-Gate server som kjører
        et annet sted i nettverket ditt (vanligst). "managed" laster ned og
        kjører C-Gate lokalt i dette tillegget.
      da: >-
        Hvordan C-Gate leveres. "remote" forbinder til en C-Gate server der
        kører et andet sted på dit netværk (mest almindelig). "managed"
        downloader og kører C-Gate lokalt i denne tilføjelse.
      cs: >-
        Jak je C-Gate poskytován. "remote" se připojí k serveru C-Gate běžícímu
        jinde ve vaší síti (nejběžnější). "managed" stáhne a spustí C-Gate
        lokálně v tomto doplňku.
      uk: >-
        Спосіб надання C-Gate. "remote" підключається до сервера C-Gate, що
        працює в іншому місці вашої мережі (найпоширеніший). "managed"
        завантажує та запускає C-Gate локально всередині цього додатка.
  cgate_host:
    name:
      en: C-Gate Host (required)
      de: C-Gate Host (erforderlich)
      es: Host de C-Gate (obligatorio)
      fr: Hôte C-Gate (obligatoire)
      it: Host C-Gate (obbligatorio)
      nl: C-Gate Host (verplicht)
      pt: Host do C-Gate (obrigatório)
      ru: Хост C-Gate (обязательно)
      zh: C-Gate 主机（必填）
      ja: C-Gate ホスト（必須）
      ko: C-Gate 호스트 (필수)
      pl: Host C-Gate (wymagane)
      sv: C-Gate värd (obligatorisk)
      no: C-Gate vert (obligatorisk)
      da: C-Gate vært (påkrævet)
      cs: Hostitel C-Gate (povinné)
      uk: Хост C-Gate (обов'язково)
    description:
      en: >-
        IP address or hostname of your C-Gate server. For remote mode, enter the
        address of the machine running C-Gate. For managed mode, use 127.0.0.1.
      de: >-
        IP-Adresse oder Hostname Ihres C-Gate Servers. Im Remote-Modus die
        Adresse des Rechners mit C-Gate eingeben. Im Managed-Modus 127.0.0.1
        verwenden.
      es: >-
        Dirección IP o nombre de host de su servidor C-Gate. En modo remoto,
        ingrese la dirección de la máquina que ejecuta C-Gate. En modo
        gestionado, use 127.0.0.1.
      fr: >-
        Adresse IP ou nom d'hôte de votre serveur C-Gate. En mode distant,
        entrez l'adresse de la machine exécutant C-Gate. En mode géré, utilisez
        127.0.0.1.
      it: >-
        Indirizzo IP o nome host del server C-Gate. In modalità remota, inserire
        l'indirizzo della macchina che esegue C-Gate. In modalità gestita, usare
        127.0.0.1.
      nl: >-
        IP-adres of hostnaam van uw C-Gate server. In de externe modus het adres
        van de machine met C-Gate invoeren. In de beheerde modus 127.0.0.1
        gebruiken.
      pt: >-
        Endereço IP ou nome de host do seu servidor C-Gate. No modo remoto,
        introduza o endereço da máquina que executa o C-Gate. No modo
        gerenciado, use 127.0.0.1.
      ru: >-
        IP-адрес или имя хоста вашего сервера C-Gate. В удалённом режиме введите
        адрес машины с C-Gate. В управляемом режиме используйте 127.0.0.1.
      zh: >-
        C-Gate 服务器的 IP 地址或主机名。远程模式下，输入运行 C-Gate 的机器 地址。托管模式下，使用 127.0.0.1。
      ja: >-
        C-Gate サーバーの IP アドレスまたはホスト名。リモートモードでは C-Gate
        を実行しているマシンのアドレスを入力してください。マネージドモードでは 127.0.0.1 を使用してください。
      ko: >-
        C-Gate 서버의 IP 주소 또는 호스트명. 원격 모드에서는 C-Gate를 실행하는 머신의 주소를 입력하세요. 관리 모드에서는
        127.0.0.1을 사용하세요.
      pl: >-
        Adres IP lub nazwa hosta serwera C-Gate. W trybie zdalnym podaj adres
        maszyny z C-Gate. W trybie zarządzanym użyj 127.0.0.1.
      sv: >-
        IP-adress eller värdnamn för din C-Gate server. I fjärrläge, ange
        adressen till maskinen som kör C-Gate. I hanterat läge, använd
        127.0.0.1.
      no: >-
        IP-adresse eller vertsnavn for C-Gate serveren din. I fjernmodus, skriv
        inn adressen til maskinen som kjører C-Gate. I administrert modus, bruk
        127.0.0.1.
      da: >-
        IP-adresse eller værtsnavn for din C-Gate server. I fjerntilstand
        indtastes adressen på maskinen der kører C-Gate. I administreret
        tilstand bruges 127.0.0.1.
      cs: >-
        IP adresa nebo název hostitele vašeho serveru C-Gate. Ve vzdáleném
        režimu zadejte adresu stroje s C-Gate. Ve spravovaném režimu použijte
        127.0.0.1.
      uk: >-
        IP-адреса або ім'я хоста вашого сервера C-Gate. У віддаленому режимі
        введіть адресу машини з C-Gate. У керованому режимі використовуйте
        127.0.0.1.
  cgate_project:
    name:
      en: C-Gate Project Name (required)
      de: C-Gate Projektname (erforderlich)
      es: Nombre del proyecto C-Gate (obligatorio)
      fr: Nom du projet C-Gate (obligatoire)
      it: Nome del progetto C-Gate (obbligatorio)
      nl: C-Gate Projectnaam (verplicht)
      pt: Nome do Projeto C-Gate (obrigatório)
      ru: Имя проекта C-Gate (обязательно)
      zh: C-Gate 项目名称（必填）
      ja: C-Gate プロジェクト名（必須）
      ko: C-Gate 프로젝트 이름 (필수)
      pl: Nazwa projektu C-Gate (wymagane)
      sv: C-Gate projektnamn (obligatoriskt)
      no: C-Gate prosjektnavn (obligatorisk)
      da: C-Gate projektnavn (påkrævet)
      cs: Název projektu C-Gate (povinné)
      uk: Назва проєкту C-Gate (обов'язково)
    description:
      en: >-
        The name of your C-Bus project as configured in C-Gate (e.g., HOME,
        MYHOUSE). Find this in C-Gate Toolkit under your project tree.
      de: >-
        Der Name Ihres C-Bus Projekts wie in C-Gate konfiguriert (z.B. HOME,
        MYHOUSE). Finden Sie diesen im C-Gate Toolkit unter Ihrem Projektbaum.
      es: >-
        El nombre de su proyecto C-Bus como está configurado en C-Gate (por
        ejemplo, HOME, MYHOUSE). Encuéntrelo en C-Gate Toolkit bajo el árbol de
        su proyecto.
      fr: >-
        Le nom de votre projet C-Bus tel que configuré dans C-Gate (par exemple,
        HOME, MYHOUSE). Trouvez-le dans C-Gate Toolkit sous l'arborescence de
        votre projet.
      it: >-
        Il nome del progetto C-Bus come configurato in C-Gate (ad esempio, HOME,
        MYHOUSE). Trovalo in C-Gate Toolkit sotto l'albero del progetto.
      nl: >-
        De naam van uw C-Bus project zoals geconfigureerd in C-Gate (bijv. HOME,
        MYHOUSE). Vind dit in C-Gate Toolkit onder uw projectboom.
      pt: >-
        O nome do seu projeto C-Bus conforme configurado no C-Gate (ex.: HOME,
        MYHOUSE). Encontre-o no C-Gate Toolkit sob a árvore do projeto.
      ru: >-
        Имя вашего проекта C-Bus, настроенного в C-Gate (например, HOME,
        MYHOUSE). Найдите его в C-Gate Toolkit в дереве проекта.
      zh: >-
        在 C-Gate 中配置的 C-Bus 项目名称（例如 HOME、MYHOUSE）。在 C-Gate Toolkit 的项目树中查找。
      ja: >-
        C-Gate で設定された C-Bus プロジェクトの名前（例：HOME、MYHOUSE）。 C-Gate Toolkit
        のプロジェクトツリーで確認できます。
      ko: >-
        C-Gate에서 구성된 C-Bus 프로젝트 이름 (예: HOME, MYHOUSE). C-Gate Toolkit의 프로젝트 트리에서
        찾을 수 있습니다.
      pl: >-
        Nazwa projektu C-Bus skonfigurowana w C-Gate (np. HOME, MYHOUSE).
        Znajdziesz ją w C-Gate Toolkit w drzewie projektu.
      sv: >-
        Namnet på ditt C-Bus projekt som konfigurerat i C-Gate (t.ex. HOME,
        MYHOUSE). Hitta det i C-Gate Toolkit under ditt projektträd.
      no: >-
        Navnet på C-Bus prosjektet ditt som konfigurert i C-Gate (f.eks. HOME,
        MYHOUSE). Finn det i C-Gate Toolkit under prosjekttreet ditt.
      da: >-
        Navnet på dit C-Bus projekt som konfigureret i C-Gate (f.eks. HOME,
        MYHOUSE). Find det i C-Gate Toolkit under dit projekttræ.
      cs: >-
        Název vašeho projektu C-Bus nakonfigurovaný v C-Gate (např. HOME,
        MYHOUSE). Najdete jej v C-Gate Toolkit ve stromu projektu.
      uk: >-
        Назва вашого проєкту C-Bus, налаштованого в C-Gate (наприклад, HOME,
        MYHOUSE). Знайдіть її в C-Gate Toolkit у дереві проєкту.
  ha_discovery_enabled:
    name:
      en: Enable Home Assistant Discovery
      de: Home Assistant Discovery aktivieren
      es: Habilitar Home Assistant Discovery
      fr: Activer Home Assistant Discovery
      it: Abilita Home Assistant Discovery
      nl: Home Assistant Discovery inschakelen
      pt: Ativar Home Assistant Discovery
      ru: Включить Home Assistant Discovery
      zh: 启用 Home Assistant Discovery
      ja: Home Assistant Discovery を有効化
      ko: Home Assistant Discovery 활성화
      pl: Włącz Home Assistant Discovery
      sv: Aktivera Home Assistant Discovery
      no: Aktiver Home Assistant Discovery
      da: Aktivér Home Assistant Discovery
      cs: Povolit Home Assistant Discovery
      uk: Увімкнути Home Assistant Discovery
    description:
      en: >-
        Automatically register C-Bus devices with Home Assistant using MQTT
        Discovery. Most users should leave this enabled. Devices appear as
        entities without manual YAML configuration.
      de: >-
        C-Bus Geräte automatisch bei Home Assistant über MQTT Discovery
        registrieren. Die meisten Benutzer sollten dies aktiviert lassen. Geräte
        erscheinen als Entitäten ohne manuelle YAML-Konfiguration.
      es: >-
        Registrar automáticamente dispositivos C-Bus en Home Assistant usando
        MQTT Discovery. La mayoría de los usuarios deben dejarlo habilitado. Los
        dispositivos aparecen como entidades sin configuración YAML manual.
      fr: >-
        Enregistrer automatiquement les appareils C-Bus auprès de Home Assistant
        via MQTT Discovery. La plupart des utilisateurs devraient laisser ceci
        activé. Les appareils apparaissent comme des entités sans configuration
        YAML manuelle.
      it: >-
        Registrare automaticamente i dispositivi C-Bus in Home Assistant tramite
        MQTT Discovery. La maggior parte degli utenti dovrebbe lasciarlo
        abilitato. I dispositivi appaiono come entità senza configurazione YAML
        manuale.
      nl: >-
        Registreer C-Bus apparaten automatisch bij Home Assistant met MQTT
        Discovery. De meeste gebruikers moeten dit ingeschakeld laten. Apparaten
        verschijnen als entiteiten zonder handmatige YAML-configuratie.
      pt: >-
        Registar automaticamente dispositivos C-Bus no Home Assistant usando
        MQTT Discovery. A maioria dos utilizadores deve deixar isto ativado. Os
        dispositivos aparecem como entidades sem configuração YAML manual.
      ru: >-
        Автоматически регистрировать устройства C-Bus в Home Assistant с помощью
        MQTT Discovery. Большинству пользователей следует оставить включённым.
        Устройства появляются как объекты без ручной настройки YAML.
      zh: >-
        使用 MQTT Discovery 自动向 Home Assistant 注册 C-Bus 设备。大多数
        用户应保持启用。设备将作为实体出现，无需手动 YAML 配置。
      ja: >-
        MQTT Discovery を使用して C-Bus デバイスを Home Assistant に自動登録
        します。ほとんどのユーザーはこれを有効のままにしてください。手動の YAML 設定なしでデバイスがエンティティとして表示されます。
      ko: >-
        MQTT Discovery를 사용하여 C-Bus 장치를 Home Assistant에 자동으로 등록합니다. 대부분의 사용자는 이것을
        활성화 상태로 유지해야 합니다. 수동 YAML 구성 없이 장치가 엔티티로 표시됩니다.
      pl: >-
        Automatycznie rejestruj urządzenia C-Bus w Home Assistant za pomocą MQTT
        Discovery. Większość użytkowników powinna zostawić to włączone.
        Urządzenia pojawiają się jako encje bez ręcznej konfiguracji YAML.
      sv: >-
        Registrera C-Bus enheter automatiskt i Home Assistant med MQTT
        Discovery. De flesta användare bör lämna detta aktiverat. Enheter visas
        som entiteter utan manuell YAML-konfiguration.
      no: >-
        Registrer C-Bus enheter automatisk i Home Assistant ved hjelp av MQTT
        Discovery. De fleste brukere bør la dette være aktivert. Enheter vises
        som entiteter uten manuell YAML-konfigurasjon.
      da: >-
        Registrer automatisk C-Bus enheder i Home Assistant ved hjælp af MQTT
        Discovery. De fleste brugere bør lade dette være aktiveret. Enheder
        vises som entiteter uden manuel YAML-konfiguration.
      cs: >-
        Automaticky registrovat zařízení C-Bus v Home Assistant pomocí MQTT
        Discovery. Většina uživatelů by měla nechat povoleno. Zařízení se
        zobrazí jako entity bez ruční konfigurace YAML.
      uk: >-
        Автоматично реєструвати пристрої C-Bus у Home Assistant за допомогою
        MQTT Discovery. Більшість користувачів повинні залишити це увімкненим.
        Пристрої з'являються як об'єкти без ручного налаштування YAML.
  log_level:
    name:
      en: Log Level
      de: Protokollierungsstufe
      es: Nivel de registro
      fr: Niveau de journalisation
      it: Livello di registrazione
      nl: Logniveau
      pt: Nível de Registo
      ru: Уровень журналирования
      zh: 日志级别
      ja: ログレベル
      ko: 로그 수준
      pl: Poziom logowania
      sv: Loggnivå
      no: Loggnivå
      da: Logniveau
      cs: Úroveň logování
      uk: Рівень журналювання
    description:
      en: >-
        Logging verbosity. Use "info" for normal operation, "debug" for
        troubleshooting connection or discovery issues.
      de: >-
        Ausführlichkeit der Protokollierung. Verwenden Sie "info" für den
        Normalbetrieb, "debug" zur Fehlerbehebung bei Verbindungs- oder
        Discovery-Problemen.
      es: >-
        Nivel de detalle del registro. Use "info" para operación normal, "debug"
        para solucionar problemas de conexión o descubrimiento.
      fr: >-
        Niveau de détail de la journalisation. Utilisez "info" pour le
        fonctionnement normal, "debug" pour résoudre les problèmes de connexion
        ou de découverte.
      it: >-
        Livello di dettaglio della registrazione. Usare "info" per il
        funzionamento normale, "debug" per la risoluzione di problemi di
        connessione o discovery.
      nl: >-
        Logboekuitgebreidheid. Gebruik "info" voor normaal gebruik, "debug" voor
        het oplossen van verbindings- of discovery-problemen.
      pt: >-
        Verbosidade do registo. Use "info" para operação normal, "debug" para
        resolver problemas de ligação ou descoberta.
      ru: >-
        Подробность журналирования. Используйте "info" для обычной работы,
        "debug" для устранения проблем с подключением или обнаружением.
      zh: >-
        日志详细程度。正常运行使用 "info"，排查连接或发现问题使用 "debug"。
      ja: >-
        ログの詳細度。通常運用には "info"、接続やディスカバリの問題を トラブルシューティングするには "debug" を使用してください。
      ko: >-
        로그 상세도. 정상 운영에는 "info", 연결 또는 검색 문제 해결에는 "debug"를 사용하세요.
      pl: >-
        Szczegółowość logowania. Użyj "info" do normalnej pracy, "debug" do
        rozwiązywania problemów z połączeniem lub odkrywaniem.
      sv: >-
        Loggningsdetalj. Använd "info" för normal drift, "debug" för felsökning
        av anslutnings- eller upptäcktsproblem.
      no: >-
        Loggdetalj. Bruk "info" for normal drift, "debug" for feilsøking av
        tilkoblings- eller oppdagelsesproblemer.
      da: >-
        Logningsdetalje. Brug "info" til normal drift, "debug" til fejlfinding
        af forbindelses- eller opdagelsesproblemer.
      cs: >-
        Podrobnost logování. Použijte "info" pro normální provoz, "debug" pro
        řešení problémů s připojením nebo objevováním.
      uk: >-
        Детальність журналювання. Використовуйте "info" для звичайної роботи,
        "debug" для усунення проблем з підключенням або виявленням.
  cgate_port:
    name:
      en: C-Gate Command Port
      de: C-Gate Befehlsport
      es: Puerto de comandos de C-Gate
      fr: Port de commande C-Gate
      it: Porta comandi C-Gate
      nl: C-Gate Commandopoort
      pt: Porta de Comando do C-Gate
      ru: Командный порт C-Gate
      zh: C-Gate 命令端口
      ja: C-Gate コマンドポート
      ko: C-Gate 명령 포트
      pl: Port poleceń C-Gate
      sv: C-Gate kommandoport
      no: C-Gate kommandoport
      da: C-Gate kommandoport
      cs: Příkazový port C-Gate
      uk: Командний порт C-Gate
    description:
      en: >-
        TCP port for C-Gate command connections. Only change this if your C-Gate
        uses a non-standard port. Default: 20023.
      de: >-
        TCP-Port für C-Gate Befehlsverbindungen. Nur ändern, wenn Ihr C-Gate
        einen nicht-standardmäßigen Port verwendet. Standard: 20023.
      es: >-
        Puerto TCP para conexiones de comandos de C-Gate. Solo cambie esto si su
        C-Gate usa un puerto no estándar. Predeterminado: 20023.
      fr: >-
