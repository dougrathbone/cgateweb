      en: >-
        API key for write operations in the label editor. Set this when exposing
        port 8080 beyond HA ingress.
      de: >-
        API-Schlüssel für Schreiboperationen im Label-Editor. Setzen Sie diesen,
        wenn Port 8080 über HA Ingress hinaus freigegeben wird.
      es: >-
        Clave API para operaciones de escritura en el editor de etiquetas.
        Configure esto al exponer el puerto 8080 más allá de HA ingress.
      fr: >-
        Clé API pour les opérations d'écriture dans l'éditeur de labels.
        Définissez-la lorsque le port 8080 est exposé au-delà de HA ingress.
      it: >-
        Chiave API per operazioni di scrittura nell'editor di etichette.
        Impostare quando la porta 8080 è esposta oltre HA ingress.
      nl: >-
        API-sleutel voor schrijfbewerkingen in de label-editor. Stel dit in
        wanneer poort 8080 buiten HA ingress wordt blootgesteld.
      pt: >-
        Chave API para operações de escrita no editor de etiquetas. Defina ao
        expor a porta 8080 para além do HA ingress.
      ru: >-
        Ключ API для операций записи в редакторе меток. Задайте при открытии
