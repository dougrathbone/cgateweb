  ha_discovery_hvac_app_id:
    name:
      en: HVAC Application ID
      de: HVAC-Anwendungs-ID
      es: ID de aplicación HVAC
      fr: ID d'application HVAC
      it: ID applicazione HVAC
      nl: HVAC Applicatie-ID
      pt: ID de Aplicação HVAC
      ru: ID приложения HVAC
      zh: HVAC 应用程序 ID
      ja: HVAC アプリケーション ID
      ko: HVAC 애플리케이션 ID
      pl: ID aplikacji HVAC
      sv: HVAC applikations-ID
      no: HVAC applikasjons-ID
      da: HVAC applikations-ID
      cs: ID aplikace HVAC
      uk: ID застосунку HVAC
    description:
      en: >-
        C-Bus app ID for a lighting-compatible HVAC group
        (PAC/touchscreen-exposed). NOT the native Air Conditioning app 172 — use
        only for groups mirrored onto a lighting-style app by a PAC or
        touchscreen. Leave empty to skip.
      de: >-
        C-Bus App-ID für eine beleuchtungskompatible HVAC-Gruppe
        (PAC/touchscreen-exponiert). NICHT die native Air Conditioning App 172 —
        nur für Gruppen verwenden, die von einem PAC oder Touchscreen auf eine
        beleuchtungsartige App gespiegelt werden. Leer lassen, um HVAC-Erkennung
        zu überspringen.
      es: >-
        ID de app C-Bus para un grupo HVAC compatible con iluminación
        (PAC/expuesto en pantalla táctil). NO es la app nativa Air Conditioning
        172 — úselo solo para grupos reflejados a una app de estilo iluminación
        por un PAC o pantalla táctil. Dejar vacío para omitir el descubrimiento
        HVAC.
      fr: >-
        ID d'app C-Bus pour un groupe HVAC compatible éclairage (PAC/exposé sur
        écran tactile). PAS l'app native Air Conditioning 172 — à utiliser
        uniquement pour les groupes reflétés sur une app de style éclairage par
        un PAC ou un écran tactile. Laisser vide pour ignorer la découverte
        HVAC.
      it: >-
        ID app C-Bus per un gruppo HVAC compatibile con illuminazione
        (PAC/esposto su touchscreen). NON è l'app nativa Air Conditioning 172 —
        usare solo per gruppi rispecchiati su un'app di tipo illuminazione da un
        PAC o touchscreen. Lasciare vuoto per saltare il rilevamento HVAC.
      nl: >-
        C-Bus app-ID voor een verlichtingscompatibele HVAC-groep
        (PAC/touchscreen-blootgesteld). NIET de native Air Conditioning app 172
        — gebruik alleen voor groepen die door een PAC of touchscreen worden
        gespiegeld op een verlichtingsstijl app. Laat leeg om HVAC-detectie over
        te slaan.
      pt: >-
        ID de app C-Bus para um grupo HVAC compatível com iluminação
        (PAC/exposto em ecrã tátil). NÃO é a app nativa Air Conditioning 172 —
        use apenas para grupos refletidos numa app de estilo iluminação por um
        PAC ou ecrã tátil. Deixe vazio para ignorar a descoberta HVAC.
      ru: >-
        ID приложения C-Bus для освещения-совместимой группы HVAC (PAC/через
        сенсорную панель). НЕ нативное приложение Air Conditioning 172 —
        используйте только для групп, отражённых на приложение освещения PAC или
        сенсорной панелью. Оставьте пустым, чтобы пропустить обнаружение HVAC.
      zh: >-
        用于照明兼容 HVAC 组（PAC/触摸屏暴露）的 C-Bus 应用 ID。不是原生 Air Conditioning 应用 172 —
        仅用于由 PAC 或触摸屏镜像到照明风格应用 的组。留空以跳过 HVAC 发现。
      ja: >-
        照明互換 HVAC グループ（PAC/タッチスクリーン経由で公開）用の C-Bus アプリ ID。ネイティブ Air Conditioning
        アプリ 172 ではありません — PAC またはタッチスクリーンによって照明スタイルアプリにミラーされた
        グループにのみ使用してください。HVAC 検出をスキップするには空のまま にしてください。
      ko: >-
        조명 호환 HVAC 그룹(PAC/터치스크린 노출)용 C-Bus 앱 ID. 네이티브 Air Conditioning 앱 172가
        아닙니다 — PAC 또는 터치스크린에 의해 조명 스타일 앱으로 미러링된 그룹에만 사용하세요. HVAC 검색을 건너뛰려면 비워
        두세요.
      pl: >-
        ID aplikacji C-Bus dla grupy HVAC kompatybilnej z oświetleniem
        (PAC/narażonej przez ekran dotykowy). NIE jest to natywna aplikacja Air
        Conditioning 172 — używaj tylko dla grup odzwierciedlonych na aplikację
        w stylu oświetlenia przez PAC lub ekran dotykowy. Pozostaw puste aby
        pominąć wykrywanie HVAC.
      sv: >-
        C-Bus app-ID för en belysningskompatibel HVAC-grupp
        (PAC/touchscreen-exponerad). INTE den inbyggda Air Conditioning-appen
        172 — använd endast för grupper som speglas till en belysningsstil-app
        av en PAC eller touchscreen. Lämna tomt för att hoppa över
        HVAC-upptäckt.
      no: >-
        C-Bus app-ID for en belysningskompatibel HVAC-gruppe
        (PAC/touchscreen-eksponert). IKKE den innebygde Air Conditioning-appen
        172 — bruk kun for grupper som speiles til en belysningsstil-app av en
        PAC eller touchscreen. La stå tomt for å hoppe over HVAC-oppdagelse.
      da: >-
        C-Bus app-ID for en belysningskompatibel HVAC-gruppe
        (PAC/touchscreen-eksponeret). IKKE den native Air Conditioning-app 172 —
        brug kun for grupper der spejles til en belysningsstil-app af en PAC
        eller touchscreen. Lad stå tomt for at springe HVAC-opdagelse over.
      cs: >-
        ID aplikace C-Bus pro osvětlením-kompatibilní skupinu HVAC (PAC/přes
        dotykový displej). NENÍ to nativní aplikace Air Conditioning 172 —
        používejte pouze pro skupiny zrcadlené na osvětlení-styl aplikaci PAC
        nebo dotykovým displejem. Ponechte prázdné pro přeskočení objevování
        HVAC.
      uk: >-
        ID застосунку C-Bus для освітлення-сумісної групи HVAC (PAC/через
        сенсорний екран). НЕ нативний застосунок Air Conditioning 172 —
        використовуйте лише для груп, відображених на освітлення-стиль
        застосунок PAC або сенсорним екраном. Залиште порожнім, щоб пропустити
        виявлення HVAC.
  ha_hvac_temperature_unit:
    name:
      en: HVAC Temperature Unit
      de: HVAC Temperatureinheit
      es: Unidad de temperatura HVAC
      fr: Unité de température HVAC
      it: Unità di temperatura HVAC
      nl: HVAC Temperatuureenheid
      pt: Unidade de Temperatura HVAC
      ru: Единица температуры HVAC
      zh: HVAC 温度单位
      ja: HVAC 温度単位
      ko: HVAC 온도 단위
      pl: Jednostka temperatury HVAC
      sv: HVAC temperaturenhet
      no: HVAC temperaturenhet
      da: HVAC temperaturenhed
      cs: Jednotka teploty HVAC
      uk: Одиниця температури HVAC
    description:
      en: >-
        Temperature unit for HVAC climate entities. C for Celsius, F for
        Fahrenheit. Default: C.
      de: >-
        Temperatureinheit für HVAC Klima-Entitäten. C für Celsius, F für
        Fahrenheit. Standard: C.
      es: >-
        Unidad de temperatura para entidades de clima HVAC. C para Celsius, F
        para Fahrenheit. Predeterminado: C.
      fr: >-
        Unité de température pour les entités climat HVAC. C pour Celsius, F
        pour Fahrenheit. Par défaut : C.
      it: >-
        Unità di temperatura per le entità clima HVAC. C per Celsius, F per
        Fahrenheit. Predefinito: C.
      nl: >-
        Temperatuureenheid voor HVAC klimaat-entiteiten. C voor Celsius, F voor
        Fahrenheit. Standaard: C.
      pt: >-
        Unidade de temperatura para entidades de clima HVAC. C para Celsius, F
        para Fahrenheit. Predefinido: C.
      ru: >-
        Единица температуры для климатических объектов HVAC. C для Цельсия, F
        для Фаренгейта. По умолчанию: C.
      zh: >-
        HVAC 气候实体的温度单位。C 表示摄氏度，F 表示华氏度。默认：C。
      ja: >-
        HVAC 空調エンティティの温度単位。C は摂氏、F は華氏。デフォルト：C。
      ko: >-
        HVAC 기후 엔티티의 온도 단위. C는 섭씨, F는 화씨. 기본값: C.
      pl: >-
        Jednostka temperatury dla encji klimatu HVAC. C dla Celsjusza, F dla
        Fahrenheita. Domyślnie: C.
      sv: >-
        Temperaturenhet för HVAC klimatentiteter. C för Celsius, F för
        Fahrenheit. Standard: C.
      no: >-
        Temperaturenhet for HVAC klimaentiteter. C for Celsius, F for
        Fahrenheit. Standard: C.
      da: >-
        Temperaturenhed for HVAC klimaentiteter. C for Celsius, F for
        Fahrenheit. Standard: C.
      cs: >-
        Jednotka teploty pro klimatické entity HVAC. C pro Celsius, F pro
        Fahrenheit. Výchozí: C.
      uk: >-
        Одиниця температури для кліматичних об'єктів HVAC. C для Цельсія, F для
        Фаренгейта. За замовчуванням: C.
  cbus_aircon_app_id:
    name:
      en: Air Conditioning Application ID
      de: Anwendungs-ID für Klimaanlage
      es: ID de aplicación de aire acondicionado
      fr: ID d'application de climatisation
      it: ID applicazione climatizzazione
      nl: Applicatie-ID voor airconditioning
      pt: ID da aplicação de ar condicionado
      ru: ID приложения кондиционирования
      zh: 空调应用 ID
      ja: 空調アプリケーション ID
      ko: 공조 애플리케이션 ID
      pl: ID aplikacji klimatyzacji
      sv: Applikations-ID för luftkonditionering
      no: Applikasjons-ID for klimaanlegg
      da: Applikations-ID for klimaanlæg
      cs: ID aplikace klimatizace
      uk: ID застосунку кондиціонування
    description:
      en: >-
        C-Bus Air Conditioning application id (e.g. 172) for native read-only
        room-temperature. Decodes zone_temperature broadcasts and publishes
        current_temperature to
        cbus/read/{network}/172/{zone}/current_temperature. Off by default.
      de: >-
        C-Bus Air Conditioning Anwendungs-ID (z. B. 172) für native,
        schreibgeschützte Raumtemperatur. Dekodiert zone_temperature-Broadcasts
        und veröffentlicht current_temperature unter
        cbus/read/{network}/172/{zone}/current_temperature. Standardmäßig
        deaktiviert.
      es: >-
        ID de la aplicación de aire acondicionado de C-Bus (p. ej. 172) para
        temperatura ambiente nativa de solo lectura. Decodifica los mensajes
        zone_temperature y publica current_temperature en
        cbus/read/{network}/172/{zone}/current_temperature. Desactivado por
        defecto.
      fr: >-
        ID de l'application Air Conditioning C-Bus (p. ex. 172) pour la
        température ambiante native en lecture seule. Décode les diffusions
        zone_temperature et publie current_temperature sur
        cbus/read/{network}/172/{zone}/current_temperature. Désactivé par
        défaut.
      it: >-
        ID dell'applicazione Air Conditioning di C-Bus (es. 172) per la
        temperatura ambiente nativa in sola lettura. Decodifica i broadcast
        zone_temperature e pubblica current_temperature su
        cbus/read/{network}/172/{zone}/current_temperature. Disattivato per
        impostazione predefinita.
      nl: >-
        C-Bus Air Conditioning applicatie-id (bijv. 172) voor native
        alleen-lezen kamertemperatuur. Decodeert zone_temperature-broadcasts en
        publiceert current_temperature naar
        cbus/read/{network}/172/{zone}/current_temperature. Standaard
        uitgeschakeld.
      pt: >-
        ID da aplicação Air Conditioning do C-Bus (ex.: 172) para temperatura
        ambiente nativa só de leitura. Descodifica as transmissões
        zone_temperature e publica current_temperature em
        cbus/read/{network}/172/{zone}/current_temperature. Desativado por
        predefinição.
      ru: >-
        ID приложения Air Conditioning C-Bus (например, 172) для нативной
        комнатной температуры только для чтения. Декодирует широковещательные
        сообщения zone_temperature и публикует current_temperature в
        cbus/read/{network}/172/{zone}/current_temperature. По умолчанию
        отключено.
      zh: >-
        C-Bus 空调（Air Conditioning）应用 ID（例如 172），用于原生只读室温。解码 zone_temperature
        广播并将 current_temperature 发布到
        cbus/read/{network}/172/{zone}/current_temperature。默认关闭。
      ja: >-
        ネイティブの読み取り専用の室温のための C-Bus 空調（Air Conditioning）アプリケーション ID（例:
        172）。zone_temperature ブロードキャストをデコードし、current_temperature を
        cbus/read/{network}/172/{zone}/current_temperature に公開します。デフォルトは無効です。
      ko: >-
        네이티브 읽기 전용 실내 온도를 위한 C-Bus 공조(Air Conditioning) 애플리케이션 ID(예: 172).
        zone_temperature 브로드캐스트를 디코딩하여 current_temperature를
        cbus/read/{network}/172/{zone}/current_temperature에 게시합니다. 기본값은 비활성화입니다.
      pl: >-
        ID aplikacji Air Conditioning C-Bus (np. 172) dla natywnej temperatury
        pokojowej tylko do odczytu. Dekoduje komunikaty zone_temperature i
        publikuje current_temperature w
        cbus/read/{network}/172/{zone}/current_temperature. Domyślnie wyłączone.
      sv: >-
        C-Bus Air Conditioning-applikations-id (t.ex. 172) för inbyggd
        skrivskyddad rumstemperatur. Avkodar zone_temperature-sändningar och
        publicerar current_temperature till
        cbus/read/{network}/172/{zone}/current_temperature. Avstängt som
        standard.
      no: >-
        C-Bus Air Conditioning-applikasjons-id (f.eks. 172) for innebygd
        skrivebeskyttet romtemperatur. Dekoder zone_temperature-kringkastinger
        og publiserer current_temperature til
        cbus/read/{network}/172/{zone}/current_temperature. Av som standard.
      da: >-
        C-Bus Air Conditioning-applikations-id (f.eks. 172) til indbygget
        skrivebeskyttet rumtemperatur. Afkoder zone_temperature-udsendelser og
        udgiver current_temperature til
        cbus/read/{network}/172/{zone}/current_temperature. Slået fra som
        standard.
      cs: >-
        ID aplikace Air Conditioning C-Bus (např. 172) pro nativní pokojovou
        teplotu jen pro čtení. Dekóduje vysílání zone_temperature a publikuje
        current_temperature do
        cbus/read/{network}/172/{zone}/current_temperature. Ve výchozím
        nastavení vypnuto.
      uk: >-
        ID застосунку Air Conditioning C-Bus (наприклад, 172) для нативної
        кімнатної температури лише для читання. Декодує широкомовлення
        zone_temperature і публікує current_temperature у
        cbus/read/{network}/172/{zone}/current_temperature. Вимкнено за
        замовчуванням.
  cbus_aircon_control_enabled:
    name:
      en: Air Conditioning Control
      de: Klimaanlagen-Steuerung
      es: Control de aire acondicionado
      fr: Contrôle de la climatisation
      it: Controllo climatizzazione
      nl: Airconditioning-besturing
      pt: Controlo do ar condicionado
      ru: Управление кондиционированием
      zh: 空调控制
      ja: 空調制御
      ko: 공조 제어
      pl: Sterowanie klimatyzacją
      sv: Styrning av luftkonditionering
      no: Styring av klimaanlegg
      da: Styring af klimaanlæg
      cs: Ovládání klimatizace
      uk: Керування кондиціонуванням
    description:
      en: >-
        Allow Home Assistant to control native C-Bus thermostats (set mode and
        temperature). Your thermostats still appear in Home Assistant as
        read-only climate entities without this — enabling it only adds the set
        mode/temperature commands, which write to live heating/cooling and add
        C-Bus traffic. Off by default. Requires the Air Conditioning Application
        ID to be set.
      de: >-
        Home Assistant erlauben, native C-Bus-Thermostate zu steuern (Modus und
        Temperatur). Standardmäßig deaktiviert — es schreibt in die laufende
        Heizung/Kühlung. Erfordert eine gesetzte Air-Conditioning-Anwendungs-ID.
      es: >-
        Permitir que Home Assistant controle los termostatos C-Bus nativos (modo
        y temperatura). Desactivado por defecto: escribe en la
        calefacción/refrigeración activa. Requiere configurar el ID de
        aplicación de aire acondicionado.
      fr: >-
        Autoriser Home Assistant à contrôler les thermostats C-Bus natifs (mode
        et température). Désactivé par défaut : écrit sur le chauffage/la
        climatisation en service. Nécessite un ID d’application de climatisation
        défini.
      it: >-
        Consenti a Home Assistant di controllare i termostati C-Bus nativi
        (modalità e temperatura). Disattivato per impostazione predefinita:
        scrive sull’impianto attivo. Richiede un ID applicazione climatizzazione
        impostato.
      nl: >-
        Sta Home Assistant toe om native C-Bus-thermostaten te bedienen (modus
        en temperatuur). Standaard uitgeschakeld — het schrijft naar de actieve
        verwarming/koeling. Vereist een ingestelde
        airconditioning-applicatie-id.
      pt: >-
        Permitir que o Home Assistant controle os termostatos C-Bus nativos
        (modo e temperatura). Desativado por predefinição: escreve no sistema de
        aquecimento/arrefecimento ativo. Requer o ID da aplicação de ar
        condicionado definido.
      ru: >-
        Разрешить Home Assistant управлять нативными термостатами C-Bus (режим и
        температура). По умолчанию отключено — запись в работающее
        отопление/охлаждение. Требуется заданный ID приложения
        кондиционирования.
      zh: >-
        允许 Home Assistant 控制原生 C-Bus 温控器（设置模式和温度）。默认关闭——它会写入正在运行的供暖/制冷。需要设置空调应用
        ID。
      ja: >-
        Home Assistant がネイティブ C-Bus
        サーモスタットを制御（モードと温度の設定）できるようにします。デフォルトは無効です。稼働中の暖房/冷房に書き込みます。空調アプリケーション ID
        の設定が必要です。
      ko: >-
        Home Assistant가 네이티브 C-Bus 온도조절기를 제어(모드 및 온도 설정)하도록 허용합니다. 기본값은 비활성화입니다.
        작동 중인 난방/냉방에 기록합니다. 공조 애플리케이션 ID 설정이 필요합니다.
      pl: >-
        Zezwól Home Assistant na sterowanie natywnymi termostatami C-Bus (tryb i
        temperatura). Domyślnie wyłączone — zapisuje do działającego
        ogrzewania/chłodzenia. Wymaga ustawionego ID aplikacji klimatyzacji.
      sv: >-
        Tillåt Home Assistant att styra inbyggda C-Bus-termostater (läge och
        temperatur). Avstängt som standard — det skriver till aktiv värme/kyla.
        Kräver att applikations-id för luftkonditionering är inställt.
      no: >-
        Tillat Home Assistant å styre innebygde C-Bus-termostater (modus og
        temperatur). Av som standard — det skriver til aktiv oppvarming/kjøling.
        Krever at applikasjons-id for klimaanlegg er satt.
      da: >-
        Tillad Home Assistant at styre indbyggede C-Bus-termostater (tilstand og
        temperatur). Slået fra som standard — det skriver til aktiv
        opvarmning/køling. Kræver, at applikations-id for klimaanlæg er angivet.
      cs: >-
        Povolit Home Assistant ovládat nativní termostaty C-Bus (režim a
        teplotu). Ve výchozím nastavení vypnuto — zapisuje do aktivního
        vytápění/chlazení. Vyžaduje nastavené ID aplikace klimatizace.
      uk: >-
        Дозволити Home Assistant керувати нативними термостатами C-Bus (режим і
        температура). Вимкнено за замовчуванням — запис у працююче
        опалення/охолодження. Потребує встановленого ID застосунку
        кондиціонування.
  cbus_security_app_id:
    name:
      en: Security Application ID
      de: Sicherheitsanwendungs-ID
      es: ID de aplicación de seguridad
      fr: ID d'application de sécurité
      it: ID applicazione sicurezza
      nl: Beveiligingsapplicatie-id
      pt: ID da aplicação de segurança
      ru: ID приложения безопасности
      zh: 安防应用 ID
      ja: セキュリティアプリケーション ID
      ko: 보안 애플리케이션 ID
      pl: ID aplikacji bezpieczeństwa
      sv: Säkerhetsapplikations-id
      no: Sikkerhetsapplikasjons-id
      da: Sikkerhedsapplikations-id
      cs: ID aplikace zabezpečení
      uk: ID застосунку безпеки
    description:
      en: >-
        C-Bus Security application id (default 208) for alarm zone sensors.
        Publishes one binary sensor per zone — sealed is off; unsealed, open or
        short is on — and syncs the zone states on connect. Set to 0 to disable.
      de: >-
        C-Bus-Sicherheitsanwendungs-ID (Standard 208) für Alarmzonensensoren.
        Veröffentlicht einen Binärsensor pro Zone — sealed ist aus; unsealed,
        open oder short ist an — und synchronisiert die Zonenstände beim
        Verbindungsaufbau. Zum Deaktivieren auf 0 setzen.
      es: >-
        ID de la aplicación Security de C-Bus (208 por defecto) para sensores de
        zonas de alarma. Publica un sensor binario por zona — sealed es off;
        unsealed, open o short es on — y sincroniza el estado de las zonas al
        conectar. Establezca 0 para desactivar.
      fr: >-
        ID de l'application Security C-Bus (208 par défaut) pour les capteurs de
        zones d'alarme. Publie un capteur binaire par zone — sealed = off ;
        unsealed, open ou short = on — et synchronise l'état des zones à la
        connexion. Réglez sur 0 pour désactiver.
      it: >-
        ID dell'applicazione Security C-Bus (predefinito 208) per i sensori
        delle zone di allarme. Pubblica un sensore binario per zona — sealed è
        off; unsealed, open o short è on — e sincronizza lo stato delle zone
        alla connessione. Impostare 0 per disattivare.
      nl: >-
        C-Bus-beveiligingsapplicatie-id (standaard 208) voor alarmzonesensoren.
        Publiceert één binaire sensor per zone — sealed is uit; unsealed, open
        of short is aan — en synchroniseert de zonestatus bij verbinding. Stel
        in op 0 om uit te schakelen.
      pt: >-
        ID da aplicação Security do C-Bus (predefinição 208) para sensores de
        zonas de alarme. Publica um sensor binário por zona — sealed é off;
        unsealed, open ou short é on — e sincroniza o estado das zonas ao ligar.
        Defina 0 para desativar.
      ru: >-
        ID приложения Security C-Bus (по умолчанию 208) для датчиков зон
        охранной сигнализации. Публикует один бинарный датчик на зону — sealed
        это выкл.; unsealed, open или short это вкл. — и синхронизирует
        состояние зон при подключении. Установите 0 для отключения.
      zh: >-
        用于报警区域传感器的 C-Bus 安防（Security）应用 ID（默认 208）。每个区域发布一个二进制传感器——sealed
        为关；unsealed、open 或 short 为开——并在连接时同步区域状态。设置为 0 可禁用。
      ja: >-
        アラームゾーンセンサー用の C-Bus セキュリティアプリケーション ID（デフォルト
        208）。ゾーンごとにバイナリセンサーを1つ公開します（sealed はオフ、unsealed/open/short
        はオン）。接続時にゾーン状態を同期します。無効にするには 0 を設定してください。
      ko: >-
        알람 존 센서용 C-Bus 보안 애플리케이션 ID(기본값 208). 존당 바이너리 센서 하나를 게시합니다(sealed는 꺼짐,
        unsealed/open/short는 켜짐). 연결 시 존 상태를 동기화합니다. 비활성화하려면 0으로 설정하세요.
      pl: >-
        ID aplikacji Security C-Bus (domyślnie 208) dla czujników stref
        alarmowych. Publikuje jeden czujnik binarny na strefę — sealed to wył.;
        unsealed, open lub short to wł. — i synchronizuje stan stref przy
        połączeniu. Ustaw 0, aby wyłączyć.
      sv: >-
        C-Bus säkerhetsapplikations-id (standard 208) för larmzonssensorer.
        Publicerar en binär sensor per zon — sealed är av; unsealed, open eller
        short är på — och synkroniserar zonernas status vid anslutning. Sätt
        till 0 för att stänga av.
      no: >-
        C-Bus sikkerhetsapplikasjons-id (standard 208) for alarmsonsensorer.
        Publiserer én binær sensor per sone — sealed er av; unsealed, open eller
        short er på — og synkroniserer sonestatus ved tilkobling. Sett til 0 for
        å deaktivere.
      da: >-
        C-Bus sikkerhedsapplikations-id (standard 208) til alarmzonesensorer.
        Udgiver én binær sensor pr. zone — sealed er fra; unsealed, open eller
        short er til — og synkroniserer zonernes status ved tilslutning. Sæt til
        0 for at deaktivere.
      cs: >-
        ID aplikace Security C-Bus (výchozí 208) pro snímače alarmových zón.
        Publikuje jeden binární snímač na zónu — sealed je vypnuto; unsealed,
        open nebo short je zapnuto — a synchronizuje stav zón při připojení. Pro
        vypnutí nastavte 0.
      uk: >-
        ID застосунку Security C-Bus (типово 208) для датчиків зон охоронної
        сигналізації. Публікує один бінарний датчик на зону — sealed це вимк.;
        unsealed, open або short це увімк. — і синхронізує стан зон під час
        підключення. Встановіть 0 для вимкнення.
  cbus_security_control_enabled:
    name:
      en: Security Panel Control
      de: Alarmanlagen-Steuerung
      es: Control de la alarma
      fr: Contrôle de l'alarme
      it: Controllo allarme
      nl: Alarmpaneel-bediening
      pt: Controlo do alarme
      ru: Управление сигнализацией
      zh: 安防面板控制
      ja: セキュリティパネル制御
      ko: 보안 패널 제어
      pl: Sterowanie alarmem
      sv: Larmstyrning
      no: Alarmstyring
      da: Alarmstyring
      cs: Ovládání alarmu
      uk: Керування сигналізацією
    description:
      en: >-
        Allow Home Assistant to arm the security panel (away, night, home,
        vacation). Arming only: C-Bus has no disarm command, so Home Assistant's
        Disarm button does nothing. Off by default: the arm command carries no
        PIN on the C-Bus network, so anything that can publish to the command
        topic can arm your panel. Requires the Security Application ID to be
        set.
      de: >-
        Home Assistant erlauben, die Alarmanlage zu schärfen (Away, Night, Home,
        Vacation). Nur Schärfen: C-Bus hat keinen Entschärfen-Befehl, daher
        bewirkt die Disarm-Schaltfläche in Home Assistant nichts. Standardmäßig
        deaktiviert: Der Arm-Befehl trägt keine PIN im C-Bus-Netz, daher kann
        alles, was auf das Befehlstopic veröffentlichen kann, Ihre Alarmanlage
        schärfen. Erfordert eine gesetzte Sicherheitsanwendungs-ID.
      es: >-
        Permitir que Home Assistant arme la central de alarma (away, night,
        home, vacation). Solo armado: C-Bus no tiene ningún comando de
        desarmado, por lo que el botón Disarm de Home Assistant no hace nada.
        Desactivado por defecto: el comando de armado no lleva ningún PIN en el
        bus C-Bus, por lo que cualquier cosa que pueda publicar en el topic de
        comandos puede armar su central. Requiere configurar el ID de aplicación
        de seguridad.
      fr: >-
        Autoriser Home Assistant à armer la centrale d'alarme (away, night,
        home, vacation). Armement uniquement : C-Bus ne dispose d'aucune
        commande de désarmement, donc le bouton Disarm de Home Assistant ne fait
        rien. Désactivé par défaut : la commande d'armement ne transporte aucun
        code PIN sur le bus C-Bus, donc tout ce qui peut publier sur le topic de
        commande peut armer votre centrale. Nécessite un ID d'application de
        sécurité défini.
      it: >-
        Consenti a Home Assistant di inserire la centrale di allarme (away,
        night, home, vacation). Solo inserimento: C-Bus non ha alcun comando di
        disinserimento, quindi il pulsante Disarm di Home Assistant non fa
        nulla. Disattivato per impostazione predefinita: il comando di
        inserimento non trasporta alcun PIN sul bus C-Bus, quindi qualsiasi cosa
        possa pubblicare sul topic dei comandi può inserire la tua centrale.
        Richiede un ID applicazione sicurezza impostato.
      nl: >-
        Sta Home Assistant toe het alarmsysteem in te schakelen (away, night,
        home, vacation). Alleen inschakelen: C-Bus heeft geen
        uitschakelcommando, dus de Disarm-knop in Home Assistant doet niets.
        Standaard uitgeschakeld: het arm-commando bevat geen PIN op de C-Bus,
        dus alles wat op het commando-topic kan publiceren kan uw alarmsysteem
        inschakelen. Vereist een ingestelde beveiligingsapplicatie-id.
      pt: >-
        Permitir que o Home Assistant arme a central de alarme (away, night,
        home, vacation). Apenas armar: o C-Bus não tem nenhum comando para
        desarmar, pelo que o botão Disarm do Home Assistant não faz nada.
        Desativado por predefinição: o comando de armar não transporta nenhum
        PIN no bus C-Bus, pelo que qualquer coisa que possa publicar no tópico
        de comandos pode armar a sua central. Requer o ID da aplicação de
        segurança definido.
      ru: >-
        Разрешить Home Assistant ставить охранную сигнализацию на охрану (away,
        night, home, vacation). Только постановка: в C-Bus нет команды снятия с
        охраны, поэтому кнопка Disarm в Home Assistant ничего не делает. По
        умолчанию выключено: команда постановки не передаёт PIN-код в сети
        C-Bus, поэтому всё, что может публиковать в топик команд, может
        поставить вашу сигнализацию на охрану. Требуется установленный ID
        приложения безопасности.
      zh: >-
        允许 Home Assistant 布防安防面板（away、night、home、vacation）。仅布防：C-Bus 没有撤防命令，因此
        Home Assistant 的 Disarm 按钮不起作用。默认关闭：布防命令在 C-Bus 上不携带 PIN
        码，因此任何能向命令主题发布消息的实体都能布防您的面板。需要设置安防应用 ID。
      ja: >-
        Home Assistant によるアラームパネルの武装（away、night、home、vacation）を許可します。武装のみ: C-Bus
        には解除コマンドがないため、Home Assistant の Disarm ボタンは何もしません。デフォルトはオフです。武装コマンドは
        C-Bus 上で PIN を伴わないため、コマンドトピックに発行できるものはすべてパネルを武装できます。セキュリティアプリケーション ID
        の設定が必要です。
      ko: >-
        Home Assistant가 보안 패널을 설정(away, night, home, vacation)하도록 허용합니다. 설정만 가능:
        C-Bus에는 해제 명령이 없으므로 Home Assistant의 Disarm 버튼은 아무 동작도 하지 않습니다. 기본값은
        꺼짐입니다. 설정 명령은 C-Bus에서 PIN 없이 전송되므로 명령 토픽에 게시할 수 있는 모든 것이 패널을 설정할 수 있습니다.
        보안 애플리케이션 ID가 설정되어 있어야 합니다.
      pl: >-
        Zezwól Home Assistant na uzbrajanie centrali alarmowej (away, night,
        home, vacation). Tylko uzbrajanie: C-Bus nie ma polecenia rozbrojenia,
        więc przycisk Disarm w Home Assistant nic nie robi. Domyślnie wyłączone:
        polecenie uzbrojenia nie przenosi żadnego kodu PIN w sieci C-Bus, więc
        wszystko, co może publikować na temacie poleceń, może uzbroić Twoją
        centralę. Wymaga ustawionego ID aplikacji bezpieczeństwa.
      sv: >-
        Tillåt Home Assistant att tillkoppla larmcentralen (away, night, home,
        vacation). Endast tillkoppling: C-Bus har inget frånkopplingskommando,
        så Disarm-knappen i Home Assistant gör ingenting. Avstängt som standard:
        tillkopplingskommandot bär ingen PIN på C-Bus, så allt som kan publicera
        på kommando-topicen kan tillkoppla ditt larm. Kräver att
        säkerhetsapplikations-id är inställt.
      no: >-
        Tillat Home Assistant å koble til alarmen (away, night, home, vacation).
        Kun tilkobling: C-Bus har ingen frakoblingskommando, så Disarm-knappen i
        Home Assistant gjør ingenting. Av som standard: tilkoblingskommandoen
        bærer ingen PIN på C-Bus, så alt som kan publisere på kommando-topicen
        kan koble til alarmen din. Krever at sikkerhetsapplikasjons-id er satt.
      da: >-
        Tillad Home Assistant at tilkoble alarmcentralen (away, night, home,
        vacation). Kun tilkobling: C-Bus har ingen frakoblingskommando, så
        Disarm-knappen i Home Assistant gør ingenting. Slået fra som standard:
        tilkoblingskommandoen bærer ingen PIN på C-Bus, så alt der kan publicere
        på kommando-topic'en kan tilkoble din alarm. Kræver, at
        sikkerhedsapplikations-id er angivet.
      cs: >-
        Povolit Home Assistant aktivovat zabezpečovací ústřednu (away, night,
        home, vacation). Pouze aktivace: C-Bus nemá žádný příkaz k deaktivaci,
        takže tlačítko Disarm v Home Assistant nic neudělá. Ve výchozím
        nastavení vypnuto: příkaz aktivace nenese žádný PIN na sběrnici C-Bus,
        takže cokoliv, co může publikovat na příkazovém tématu, může vaši
        ústřednu aktivovat. Vyžaduje nastavené ID aplikace zabezpečení.
      uk: >-
        Дозволити Home Assistant ставити охоронну сигналізацію на охорону (away,
        night, home, vacation). Лише постановка: у C-Bus немає команди зняття з
        охорони, тому кнопка Disarm у Home Assistant нічого не робить. Типово
        вимкнено: команда постановки не передає PIN-код у мережі C-Bus, тому
        все, що може публікувати в топік команд, може поставити вашу
        сигналізацію на охорону. Потрібен установлений ID застосунку безпеки.
  cbus_security_disarm_enabled:
    name:
      en: Security Panel Disarm
      de: Alarmanlage entschärfen
      es: Desarmado de la alarma
      fr: Désarmement de l'alarme
      it: Disinserimento allarme
      nl: Alarm uitschakelen
      pt: Desarmar o alarme
      ru: Снятие с охраны
      zh: 安防面板撤防
      ja: セキュリティパネルの解除
      ko: 보안 패널 해제
      pl: Rozbrajanie alarmu
      sv: Frånkoppling av larm
      no: Frakobling av alarm
      da: Frakobling af alarm
      cs: Deaktivace alarmu
      uk: Зняття з охорони
    description:
      en: >-
        Also allow Home Assistant to disarm the security panel. Requires
        Security Panel Control. Off by default. C-Bus has no disarm command, so
        the PIN is typed at the panel using keypad emulation: Home Assistant
        shows its own keypad and sends what you type over MQTT. The PIN is not
        stored anywhere, but it does cross your MQTT broker on every disarm, so
        only enable this on a broker you trust, ideally with TLS.
      de: >-
        Home Assistant zusätzlich erlauben, die Alarmanlage zu entschärfen.
        Erfordert Alarmanlagen-Steuerung. Standardmäßig deaktiviert. C-Bus hat
        keinen Entschärfen-Befehl, daher wird die PIN per Tastaturemulation an
        der Anlage eingegeben: Home Assistant zeigt ein eigenes Tastenfeld und
        sendet die Eingabe über MQTT. Die PIN wird nirgends gespeichert, läuft
        aber bei jedem Entschärfen über Ihren MQTT-Broker. Aktivieren Sie dies
        nur bei einem vertrauenswürdigen Broker, idealerweise mit TLS.
      es: >-
        Permitir también que Home Assistant desarme la central de alarma.
        Requiere Control de la alarma. Desactivado por defecto. C-Bus no tiene
        comando de desarmado, por lo que el PIN se teclea en la central mediante
        emulación de teclado: Home Assistant muestra su propio teclado y envía
        lo que escribe por MQTT. El PIN no se almacena en ningún sitio, pero
        atraviesa su broker MQTT en cada desarmado, así que actívelo solo en un
        broker de confianza, preferiblemente con TLS.
      fr: >-
        Autoriser également Home Assistant à désarmer la centrale d'alarme.
        Nécessite Contrôle de l'alarme. Désactivé par défaut. C-Bus ne dispose
        d'aucune commande de désarmement, le code PIN est donc saisi sur la
        centrale par émulation de clavier : Home Assistant affiche son propre
        clavier et envoie la saisie via MQTT. Le code PIN n'est stocké nulle
        part, mais il transite par votre broker MQTT à chaque désarmement ; ne
        l'activez que sur un broker de confiance, idéalement avec TLS.
      it: >-
        Consenti a Home Assistant anche di disinserire la centrale di allarme.
        Richiede Controllo allarme. Disattivato per impostazione predefinita.
        C-Bus non ha un comando di disinserimento, quindi il PIN viene digitato
        sulla centrale tramite emulazione della tastiera: Home Assistant mostra
        la propria tastiera e invia quanto digitato via MQTT. Il PIN non viene
        memorizzato da nessuna parte, ma attraversa il tuo broker MQTT a ogni
        disinserimento: attivalo solo su un broker di cui ti fidi,
        preferibilmente con TLS.
      nl: >-
        Sta Home Assistant ook toe het alarmsysteem uit te schakelen. Vereist
        Alarmpaneel-bediening. Standaard uitgeschakeld. C-Bus heeft geen
        uitschakelcommando, dus de pincode wordt via toetsenbordemulatie op het
        paneel ingevoerd: Home Assistant toont een eigen toetsenblok en stuurt
        uw invoer via MQTT. De pincode wordt nergens opgeslagen, maar gaat bij
        elke uitschakeling via uw MQTT-broker. Schakel dit alleen in op een
        broker die u vertrouwt, bij voorkeur met TLS.
      pt: >-
        Permitir também que o Home Assistant desarme a central de alarme. Requer
        Controlo do alarme. Desativado por predefinição. O C-Bus não tem comando
        para desarmar, por isso o PIN é introduzido na central através de
        emulação de teclado: o Home Assistant mostra o seu próprio teclado e
        envia o que escrever por MQTT. O PIN não é guardado em lado nenhum, mas
        atravessa o seu broker MQTT em cada desarme, pelo que só deve ativar
        isto num broker de confiança, de preferência com TLS.
      ru: >-
        Также разрешить Home Assistant снимать сигнализацию с охраны. Требуется
        Управление сигнализацией. По умолчанию выключено. В C-Bus нет команды
        снятия с охраны, поэтому PIN-код вводится на панели с помощью эмуляции
        клавиатуры: Home Assistant показывает собственную клавиатуру и
        отправляет введённое по MQTT. PIN-код нигде не сохраняется, но при
        каждом снятии проходит через ваш MQTT-брокер, поэтому включайте это
        только на доверенном брокере, желательно с TLS.
      zh: >-
        同时允许 Home Assistant 撤防安防面板。需要先启用安防面板控制。默认关闭。C-Bus 没有撤防命令，因此通过键盘模拟在面板上输入
        PIN 码：Home Assistant 显示自己的键盘并通过 MQTT 发送您输入的内容。PIN 码不会保存在任何地方，但每次撤防都会经过您的
        MQTT 代理，因此请仅在您信任的代理上启用，最好配合 TLS。
      ja: >-
        Home Assistant によるアラームパネルの解除も許可します。セキュリティパネル制御が必要です。デフォルトはオフです。C-Bus
        には解除コマンドがないため、キーパッドエミュレーションで PIN をパネルに入力します。Home Assistant
        が独自のキーパッドを表示し、入力内容を MQTT で送信します。PIN はどこにも保存されませんが、解除のたびに MQTT
        ブローカーを経由します。信頼できるブローカーでのみ、できれば TLS を使って有効にしてください。
      ko: >-
        Home Assistant가 보안 패널을 해제하는 것도 허용합니다. 보안 패널 제어가 필요합니다. 기본값은 꺼짐입니다.
        C-Bus에는 해제 명령이 없으므로 키패드 에뮬레이션으로 패널에 PIN을 입력합니다. Home Assistant가 자체 키패드를
        표시하고 입력한 값을 MQTT로 전송합니다. PIN은 어디에도 저장되지 않지만 해제할 때마다 MQTT 브로커를 거치므로 신뢰할 수
        있는 브로커에서만, 가급적 TLS와 함께 사용하세요.
      pl: >-
        Zezwól Home Assistant również na rozbrajanie centrali alarmowej. Wymaga
        Sterowania alarmem. Domyślnie wyłączone. C-Bus nie ma polecenia
        rozbrojenia, więc kod PIN jest wprowadzany na centrali przez emulację
        klawiatury: Home Assistant wyświetla własną klawiaturę i wysyła wpisane
        cyfry przez MQTT. Kod PIN nie jest nigdzie przechowywany, ale przy
        każdym rozbrojeniu przechodzi przez Twojego brokera MQTT, więc włączaj
        to tylko na zaufanym brokerze, najlepiej z TLS.
      sv: >-
        Tillåt även Home Assistant att frånkoppla larmcentralen. Kräver
        Larmstyrning. Avstängt som standard. C-Bus har inget
        frånkopplingskommando, så PIN-koden knappas in på centralen via
        tangentbordsemulering: Home Assistant visar en egen knappsats och
        skickar det du knappar in över MQTT. PIN-koden lagras ingenstans, men
        den passerar din MQTT-broker vid varje frånkoppling, så aktivera detta
        bara på en broker du litar på, helst med TLS.
      no: >-
        Tillat også Home Assistant å koble fra alarmen. Krever Alarmstyring. Av
        som standard. C-Bus har ingen frakoblingskommando, så PIN-koden tastes
        inn på sentralen via tastaturemulering: Home Assistant viser sitt eget
        tastatur og sender det du taster over MQTT. PIN-koden lagres ingen
        steder, men den går gjennom MQTT-brokeren din ved hver frakobling, så
        aktiver dette kun på en broker du stoler på, helst med TLS.
      da: >-
        Tillad også Home Assistant at frakoble alarmcentralen. Kræver
        Alarmstyring. Slået fra som standard. C-Bus har ingen
        frakoblingskommando, så PIN-koden indtastes på centralen via
        tastaturemulering: Home Assistant viser sit eget tastatur og sender det,
        du taster, over MQTT. PIN-koden gemmes ingen steder, men den passerer
        din MQTT-broker ved hver frakobling, så aktivér kun dette på en broker,
        du stoler på, helst med TLS.
      cs: >-
        Umožnit Home Assistant také deaktivovat zabezpečovací ústřednu. Vyžaduje
        Ovládání alarmu. Ve výchozím nastavení vypnuto. C-Bus nemá příkaz k
        deaktivaci, takže se PIN zadává na ústřednu pomocí emulace klávesnice:
        Home Assistant zobrazí vlastní klávesnici a odešle zadané číslice přes
        MQTT. PIN se nikam neukládá, ale při každé deaktivaci prochází vaším
        MQTT brokerem. Zapínejte pouze na brokeru, kterému důvěřujete, ideálně s
        TLS.
      uk: >-
        Також дозволити Home Assistant знімати сигналізацію з охорони. Потребує
        Керування сигналізацією. Типово вимкнено. У C-Bus немає команди зняття з
        охорони, тому PIN-код вводиться на панелі за допомогою емуляції
        клавіатури: Home Assistant показує власну клавіатуру та надсилає введене
        через MQTT. PIN-код ніде не зберігається, але під час кожного зняття
        проходить через ваш MQTT-брокер, тому вмикайте це лише на довіреному
        брокері, бажано з TLS.
  cbus_security_bypass_enabled:
    name:
      en: Force Arm Past Open Zones
      de: Scharfschalten trotz offener Zonen
      es: Forzar armado con zonas abiertas
      fr: Forcer l'armement malgré les zones ouvertes
      it: Forza inserimento con zone aperte
      nl: Inschakelen forceren bij open zones
      pt: Forçar armar com zonas abertas
      ru: Принудительная постановка при открытых зонах
      zh: 忽略未闭合区域强制布防
      ja: 開いたゾーンを無視して強制的に武装
      ko: 열린 구역 무시하고 강제 설정
      pl: Wymuś uzbrojenie mimo otwartych stref
      sv: Tvinga tillkoppling med öppna zoner
      no: Tvungen tilkobling med åpne soner
      da: Tvungen tilkobling med åbne zoner
      cs: Vynucené zajištění při otevřených zónách
      uk: Примусова постановка за відкритих зон
    description:
      en: >-
        Allow Home Assistant to force the alarm to arm when a zone is open,
        using the panel's # key. Requires Security Panel Control. Off by
        default. This is separate from arming on purpose: an alarm armed past an
        open door looks armed but is not covering that door, so it should be a
        deliberate choice. It is never automatic - the add-on will not bypass a
        zone on your behalf.
      de: >-
        Home Assistant erlauben, das Scharfschalten bei offener Zone über die
        #-Taste der Anlage zu erzwingen. Erfordert Alarmanlagen-Steuerung.
        Standardmäßig deaktiviert. Bewusst getrennt vom Scharfschalten: eine
        trotz offener Tür scharfe Anlage wirkt scharf, überwacht diese Tür aber
        nicht - das sollte eine bewusste Entscheidung sein. Geschieht nie
        automatisch.
      es: >-
        Permitir que Home Assistant fuerce el armado con una zona abierta,
        usando la tecla # de la central. Requiere Control de la alarma.
        Desactivado por defecto. Está separado del armado a propósito: una
        alarma armada con una puerta abierta parece armada pero no cubre esa
        puerta, así que debe ser una decisión consciente. Nunca es automático.
      fr: >-
        Autoriser Home Assistant à forcer l'armement avec une zone ouverte, via
        la touche # de la centrale. Nécessite Contrôle de l'alarme. Désactivé
        par défaut. Volontairement distinct de l'armement : une alarme armée
        malgré une porte ouverte semble armée mais ne couvre pas cette porte,
        cela doit donc être un choix délibéré. Jamais automatique.
      it: >-
        Consenti a Home Assistant di forzare l'inserimento con una zona aperta,
        usando il tasto # della centrale. Richiede Controllo allarme.
        Disattivato per impostazione predefinita. Volutamente separato
        dall'inserimento: un allarme inserito con una porta aperta sembra
        inserito ma non copre quella porta, quindi deve essere una scelta
        consapevole. Non avviene mai automaticamente.
      nl: >-
        Sta Home Assistant toe het inschakelen te forceren terwijl een zone open
        is, met de #-toets van het paneel. Vereist Alarmpaneel-bediening.
        Standaard uitgeschakeld. Bewust gescheiden van inschakelen: een alarm
        dat is ingeschakeld met een open deur lijkt ingeschakeld maar bewaakt
        die deur niet, dus dat hoort een bewuste keuze te zijn. Gebeurt nooit
        automatisch.
      pt: >-
        Permitir que o Home Assistant force o armar com uma zona aberta, usando
        a tecla # da central. Requer Controlo do alarme. Desativado por
        predefinição. Separado do armar de propósito: um alarme armado com uma
        porta aberta parece armado mas não cobre essa porta, por isso deve ser
        uma decisão consciente. Nunca é automático.
      ru: >-
        Разрешить Home Assistant принудительно ставить на охрану при открытой
        зоне, используя клавишу # на панели. Требуется Управление сигнализацией.
        По умолчанию выключено. Намеренно отделено от постановки: сигнализация,
        поставленная при открытой двери, выглядит поставленной, но эту дверь не
        охраняет, поэтому это должно быть осознанным решением. Никогда не
        происходит автоматически.
      zh: >-
        允许 Home Assistant 在区域未闭合时，使用面板的 #
        键强制布防。需要先启用安防面板控制。默认关闭。这与布防特意分开：忽略未关闭的门强制布防后，警报看起来已布防，但并未防护该门，因此应当是有意识的选择。绝不会自动执行。
      ja: >-
        ゾーンが開いている状態でも、パネルの # キーを使って強制的に武装することを Home Assistant
        に許可します。セキュリティパネル制御が必要です。デフォルトはオフです。武装とは意図的に分けています。開いたドアを無視して武装したアラームは武装済みに見えても、そのドアを監視していないため、意識的な選択であるべきです。自動では行われません。
      ko: >-
        구역이 열려 있어도 패널의 # 키를 사용해 강제로 설정하도록 Home Assistant에 허용합니다. 보안 패널 제어가
        필요합니다. 기본값은 꺼짐입니다. 설정과 의도적으로 분리했습니다. 열린 문을 무시하고 설정된 경보는 설정된 것처럼 보이지만 그
        문을 감시하지 않으므로 의식적인 선택이어야 합니다. 자동으로 실행되지 않습니다.
      pl: >-
        Zezwól Home Assistant na wymuszenie uzbrojenia przy otwartej strefie,
        klawiszem # centrali. Wymaga Sterowania alarmem. Domyślnie wyłączone.
        Celowo oddzielone od uzbrajania: alarm uzbrojony mimo otwartych drzwi
        wygląda na uzbrojony, ale ich nie chroni, więc powinna to być świadoma
        decyzja. Nigdy nie dzieje się automatycznie.
      sv: >-
        Tillåt Home Assistant att tvinga tillkoppling när en zon är öppen, med
        centralens #-tangent. Kräver Larmstyrning. Avstängt som standard.
        Medvetet skilt från tillkoppling: ett larm som tillkopplats förbi en
        öppen dörr ser tillkopplat ut men bevakar inte den dörren, så det bör
        vara ett medvetet val. Sker aldrig automatiskt.
      no: >-
        Tillat Home Assistant å tvinge tilkobling når en sone er åpen, med
        sentralens #-tast. Krever Alarmstyring. Av som standard. Bevisst skilt
        fra tilkobling: et alarmsystem tilkoblet forbi en åpen dør ser tilkoblet
        ut, men dekker ikke den døren, så det bør være et bevisst valg. Skjer
        aldri automatisk.
      da: >-
        Tillad Home Assistant at gennemtvinge tilkobling, når en zone er åben,
        med centralens #-tast. Kræver Alarmstyring. Slået fra som standard.
        Bevidst adskilt fra tilkobling: et alarmsystem tilkoblet forbi en åben
        dør ser tilkoblet ud, men dækker ikke den dør, så det bør være et
        bevidst valg. Sker aldrig automatisk.
      cs: >-
        Umožnit Home Assistant vynutit zajištění, i když je zóna otevřená,
        pomocí klávesy # na ústředně. Vyžaduje Ovládání alarmu. Ve výchozím
        nastavení vypnuto. Záměrně oddělené od zajištění: alarm zajištěný přes
        otevřené dveře vypadá zajištěný, ale tyto dveře nehlídá, takže to má být
        vědomé rozhodnutí. Nikdy se neděje automaticky.
      uk: >-
        Дозволити Home Assistant примусово ставити на охорону за відкритої зони,
        використовуючи клавішу # на панелі. Потребує Керування сигналізацією.
        Типово вимкнено. Навмисно відокремлено від постановки: сигналізація,
        поставлена за відкритих дверей, виглядає поставленою, але цих дверей не
        охороняє, тому це має бути свідомим рішенням. Ніколи не відбувається
        автоматично.
  cbus_measurement_app_id:
    name:
      en: Measurement Application ID
      de: Messanwendungs-ID
      es: ID de aplicación de medición
      fr: ID d'application de mesure
      it: ID applicazione di misura
      nl: Meettoepassing-ID
      pt: ID da aplicação de medição
      ru: ID приложения измерения
      zh: 测量应用 ID
      ja: 測定アプリケーションID
      ko: 측정 애플리케이션 ID
      pl: ID aplikacji pomiarowej
      sv: Mätapplikations-ID
      no: Måleapplikasjons-ID
      da: Måleapplikations-id
      cs: ID měřicí aplikace
      uk: ID застосунку вимірювання
    description:
      en: >-
        C-Bus Measurement application id (default 228) for analogue/numeric
        sensor readings (temperature, power, light level, etc). Publishes
        cbus/read/{network}/228/{device}/{channel}/value and /unit, and accepts
        injected readings on cbus/write/{network}/228/{device}/{channel}/data
        (payload "value,multiplier,units") — e.g. for scripted/virtual sensors.
        Off by default.
      de: >-
        C-Bus-Messanwendungs-ID (Standard 228) für analoge/numerische
        Sensormesswerte (Temperatur, Leistung, Lichtstärke usw.). Veröffentlicht
        cbus/read/{network}/228/{device}/{channel}/value und /unit und
        akzeptiert eingespeiste Messwerte über
        cbus/write/{network}/228/{device}/{channel}/data (Payload
        "value,multiplier,units") — z. B. für skriptgesteuerte/virtuelle
        Sensoren. Standardmäßig deaktiviert.
      es: >-
        ID de la aplicación de medición C-Bus (por defecto 228) para lecturas
        analógicas/numéricas de sensores (temperatura, potencia, nivel de luz,
        etc). Publica cbus/read/{network}/228/{device}/{channel}/value y /unit,
        y acepta lecturas inyectadas en
        cbus/write/{network}/228/{device}/{channel}/data (payload
        "value,multiplier,units") — por ejemplo, para sensores virtuales/con
        script. Desactivado por defecto.
      fr: >-
        ID de l'application de mesure C-Bus (par défaut 228) pour les relevés
        analogiques/numériques de capteurs (température, puissance, niveau de
        lumière, etc). Publie cbus/read/{network}/228/{device}/{channel}/value
        et /unit, et accepte les relevés injectés sur
        cbus/write/{network}/228/{device}/{channel}/data (payload
        "value,multiplier,units") — par exemple pour des capteurs
        virtuels/scriptés. Désactivé par défaut.
      it: >-
        ID dell'applicazione di misura C-Bus (predefinito 228) per letture
        analogiche/numeriche dei sensori (temperatura, potenza, livello di luce,
        ecc). Pubblica cbus/read/{network}/228/{device}/{channel}/value e /unit,
        e accetta letture iniettate su
        cbus/write/{network}/228/{device}/{channel}/data (payload
        "value,multiplier,units") — ad esempio per sensori virtuali/scriptati.
        Disattivato per impostazione predefinita.
      nl: >-
        C-Bus Meettoepassing-id (standaard 228) voor analoge/numerieke
        sensormetingen (temperatuur, vermogen, lichtniveau, enz). Publiceert
        cbus/read/{network}/228/{device}/{channel}/value en /unit, en accepteert
        geïnjecteerde metingen op
        cbus/write/{network}/228/{device}/{channel}/data (payload
        "value,multiplier,units") — bijvoorbeeld voor gescripte/virtuele
        sensoren. Standaard uitgeschakeld.
      pt: >-
        ID da aplicação de medição C-Bus (predefinição 228) para leituras
        analógicas/numéricas de sensores (temperatura, potência, nível de luz,
        etc). Publica cbus/read/{network}/228/{device}/{channel}/value e /unit,
        e aceita leituras injetadas em
        cbus/write/{network}/228/{device}/{channel}/data (payload
        "value,multiplier,units") — por exemplo, para sensores
        virtuais/programados. Desativado por predefinição.
      ru: >-
        ID приложения измерения C-Bus (по умолчанию 228) для аналоговых/числовых
        показаний датчиков (температура, мощность, уровень освещённости и т.
        д.). Публикует cbus/read/{network}/228/{device}/{channel}/value и /unit,
        а также принимает введённые показания через
        cbus/write/{network}/228/{device}/{channel}/data (полезная нагрузка
        "value,multiplier,units") — например, для скриптовых/виртуальных
        датчиков. По умолчанию отключено.
      zh: >-
        C-Bus 测量应用 ID（默认 228），用于模拟/数值传感器读数（温度、功率、光照度等）。发布到
        cbus/read/{network}/228/{device}/{channel}/value 和 /unit，并接受通过
        cbus/write/{network}/228/{device}/{channel}/data（负载为
        "value,multiplier,units"）注入的读数——例如用于脚本/虚拟传感器。默认关闭。
      ja: >-
        アナログ/数値センサーの読み取り値（温度、電力、照度など）のためのC-Bus測定アプリケーションID（デフォルト228）。cbus/read/{network}/228/{device}/{channel}/value
        と /unit に発行し、cbus/write/{network}/228/{device}/{channel}/data（ペイロード
        "value,multiplier,units"）で注入された読み取り値を受け付けます —
        例えばスクリプト/仮想センサー向けです。デフォルトでオフです。
      ko: >-
        아날로그/숫자 센서 값(온도, 전력, 조도 등)을 위한 C-Bus 측정 애플리케이션 ID(기본값 228)입니다.
        cbus/read/{network}/228/{device}/{channel}/value 및 /unit에 게시하며,
        cbus/write/{network}/228/{device}/{channel}/data(페이로드
        "value,multiplier,units")를 통해 주입된 값을 받아들입니다 — 예: 스크립트/가상 센서용. 기본값은
        꺼짐입니다.
      pl: >-
        ID aplikacji pomiarowej C-Bus (domyślnie 228) dla
        analogowych/numerycznych odczytów czujników (temperatura, moc, poziom
        światła itp). Publikuje cbus/read/{network}/228/{device}/{channel}/value
        i /unit oraz akceptuje wstrzykiwane odczyty na
        cbus/write/{network}/228/{device}/{channel}/data (ładunek
        "value,multiplier,units") — np. dla skryptowych/wirtualnych czujników.
        Domyślnie wyłączone.
      sv: >-
        C-Bus mätapplikations-id (standard 228) för analoga/numeriska
        sensoravläsningar (temperatur, effekt, ljusnivå, etc). Publicerar
        cbus/read/{network}/228/{device}/{channel}/value och /unit, och
        accepterar injicerade avläsningar på
        cbus/write/{network}/228/{device}/{channel}/data (payload
        "value,multiplier,units") — t.ex. för skriptade/virtuella sensorer.
        Avstängt som standard.
      no: >-
        C-Bus måleapplikasjons-id (standard 228) for analoge/numeriske
        sensoravlesninger (temperatur, effekt, lysnivå, osv). Publiserer
        cbus/read/{network}/228/{device}/{channel}/value og /unit, og godtar
        injiserte avlesninger på
        cbus/write/{network}/228/{device}/{channel}/data (payload
        "value,multiplier,units") — f.eks. for skriptede/virtuelle sensorer. Av
        som standard.
      da: >-
        C-Bus måleapplikations-id (standard 228) til analoge/numeriske
        sensoraflæsninger (temperatur, effekt, lysniveau osv). Publicerer
        cbus/read/{network}/228/{device}/{channel}/value og /unit, og accepterer
        injicerede aflæsninger på
        cbus/write/{network}/228/{device}/{channel}/data (payload
        "value,multiplier,units") — f.eks. til scriptede/virtuelle sensorer.
        Slået fra som standard.
      cs: >-
        ID měřicí aplikace C-Bus (výchozí 228) pro analogové/číselné hodnoty ze
        senzorů (teplota, výkon, úroveň osvětlení atd). Publikuje
        cbus/read/{network}/228/{device}/{channel}/value a /unit a přijímá
        vložené hodnoty přes cbus/write/{network}/228/{device}/{channel}/data
        (payload "value,multiplier,units") — např. pro skriptované/virtuální
        senzory. Ve výchozím nastavení vypnuto.
      uk: >-
        ID застосунку вимірювання C-Bus (за замовчуванням 228) для
        аналогових/числових показань датчиків (температура, потужність, рівень
        освітлення тощо). Публікує
        cbus/read/{network}/228/{device}/{channel}/value і /unit, а також
        приймає введені показання через
        cbus/write/{network}/228/{device}/{channel}/data (корисне навантаження
        "value,multiplier,units") — наприклад, для скриптових/віртуальних
        датчиків. За замовчуванням вимкнено.
  cbus_clock_enabled:
    name:
      en: C-Bus network clock
      de: C-Bus Netzwerk-Uhr
      es: Reloj de red C-Bus
      fr: Horloge réseau C-Bus
      it: Orologio di rete C-Bus
      nl: C-Bus netwerkklok
      pt: Relógio de rede C-Bus
      ru: Сетевые часы C-Bus
      zh: C-Bus 网络时钟
      ja: C-Bus ネットワーク時計
      ko: C-Bus 네트워크 시계
      pl: Zegar sieci C-Bus
      sv: C-Bus nätverksklocka
      no: C-Bus nettverksklokke
      da: C-Bus netværksur
      cs: Síťové hodiny C-Bus
      uk: Мережевий годинник C-Bus
    description:
      en: "Decode Clock and Timekeeping broadcasts (app 223) as two diagnostic
        sensors, and ask C-Gate for a clock refresh on connect. Read-only: this
        never sets the network clock. Off by default because the message format
        rests on a small live capture."
      de: "Dekodiert Uhr-Broadcasts (App 223) als zwei Diagnosesensoren und fordert
        beim Verbinden eine Uhr-Aktualisierung an. Nur lesen: die Netzwerkuhr wird
        nie gesetzt. Standardmäßig aus, weil das Nachrichtenformat nur durch
        wenige Live-Mitschnitte belegt ist."
      es: "Decodifica los avisos de reloj (app 223) como dos sensores de diagnóstico y
        pide a C-Gate un refresco al conectar. Solo lectura: nunca pone el reloj.
        Desactivado por defecto porque el formato se basa en pocas capturas
        reales."
      fr: "Décode les diffusions d'horloge (app 223) en deux capteurs de diagnostic et
        demande un rafraîchissement à C-Gate à la connexion. Lecture seule :
        n'écrit jamais l'horloge. Désactivé par défaut, le format reposant sur peu
        de captures."
      it: "Decodifica i broadcast dell'orologio (app 223) come due sensori diagnostici
        e chiede a C-Gate un refresh all'avvio. Sola lettura: non imposta
        l'orologio. Disattivo di default perché il formato poggia su poche catture
        live."
      nl: "Decodeert klok-uitzendingen (app 223) als twee diagnosesensoren en vraagt
        C-Gate bij verbinden om een verversing. Alleen lezen: de netwerkklok wordt
        nooit gezet. Standaard uit omdat het berichtformaat op weinig live
        captures rust."
      pt: "Descodifica os broadcasts do relógio (app 223) em dois sensores de
        diagnóstico e pede ao C-Gate um refresh ao ligar. Só leitura: nunca define
        o relógio. Desligado por padrão porque o formato assenta em poucas
        capturas reais."
      ru: "Декодирует широковещания часов (приложение 223) в два диагностических
        датчика и запрашивает обновление у C-Gate при подключении. Только чтение:
        часы сети не задаются. По умолчанию выкл., формат подтверждён немногими
        живыми захватами."
      zh: 将时钟广播（应用 223）解码为两个诊断传感器，并在连接时向 C-Gate 请求刷新。只读：从不设置网络时钟。默认关闭，因为报文格式仅有少量实捕获。
      ja: 時計ブロードキャスト（アプリ 223）を2つの診断センサーとしてデコードし、接続時に C-Gate
        へ更新を要求します。読み取り専用で、ネットワーク時計は設定しません。実キャプチャが少ないため既定はオフです。
      ko: "시계 브로드캐스트(앱 223)를 두 개의 진단 센서로 디코딩하고 연결 시 C-Gate에 새로고침을 요청합니다. 읽기 전용: 네트워크
        시계를 설정하지 않습니다. 실측 캡처가 적어 기본은 꺼짐입니다."
      pl: "Dekoduje rozgłoszenia zegara (aplikacja 223) jako dwa czujniki
        diagnostyczne i prosi C-Gate o odświeżenie przy połączeniu. Tylko odczyt:
        nigdy nie ustawia zegara. Domyślnie wyłączone, bo format opiera się na
        niewielu przechwyceniach."
      sv: "Avkodar klockutsändningar (app 223) som två diagnostiksensorer och ber
        C-Gate om en uppdatering vid anslutning. Endast läsning: sätter aldrig
        nätverksklockan. Av som standard eftersom formatet vilar på få
        live-inspelningar."
      no: "Dekoder klokke-kringkastinger (app 223) som to diagnostikksensorer og ber
        C-Gate om oppdatering ved tilkobling. Kun lesing: setter aldri
        nettverksklokken. Av som standard fordi formatet hviler på få
        live-opptak."
      da: "Afkoder ur-udsendelser (app 223) som to diagnostiske sensorer og beder
        C-Gate om en opdatering ved forbindelse. Kun læsning: sætter aldrig
        netværksuret. Fra som standard, fordi formatet bygger på få
        live-optagelser."
      cs: "Dekóduje vysílání hodin (aplikace 223) jako dva diagnostické senzory a při
        připojení požádá C-Gate o obnovení. Pouze čtení: hodiny sítě nenastavuje.
        Ve výchozím stavu vypnuto, formát stojí na málo živých záznamech."
      uk: "Декодує трансляції годинника (застосунок 223) як два діагностичні сенсори й
        просить C-Gate про оновлення під час з'єднання. Лише читання: мережевий
        годинник не встановлює. Типово вимкнено, бо формат підтверджено небагатьма
        захопленнями."

  cbus_scene_module_enabled:
    name:
      en: Scene Module commands
      de: Scene-Module-Befehle
      es: Comandos del Scene Module
      fr: Commandes Scene Module
      it: Comandi Scene Module
      nl: Scene Module-commando's
      pt: Comandos do Scene Module
      ru: Команды Scene Module
      zh: Scene Module 命令
      ja: Scene Module コマンド
      ko: Scene Module 명령
      pl: Polecenia Scene Module
      sv: Scene Module-kommandon
      no: Scene Module-kommandoer
      da: Scene Module-kommandoer
      cs: Příkazy Scene Module
      uk: Команди Scene Module
    description:
      en: "Accept MQTT commands that play or record scenes on a C-Bus Scene Module.
        Off by default: most installs use Trigger Control scenes instead, and a
        record write overwrites module memory."
      de: "Akzeptiert MQTT-Befehle zum Abspielen oder Aufzeichnen von Szenen auf einem
        C-Bus Scene Module. Standardmäßig aus: die meisten Anlagen nutzen
        Trigger-Control-Szenen, und Record überschreibt den Modulspeicher."
      es: "Acepta comandos MQTT para reproducir o grabar escenas en un Scene Module
        C-Bus. Desactivado por defecto: la mayoría usa escenas de Trigger Control,
        y grabar sobrescribe la memoria del módulo."
      fr: "Accepte les commandes MQTT pour jouer ou enregistrer des scènes sur un
        Scene Module C-Bus. Désactivé par défaut : la plupart des installs
        utilisent Trigger Control, et un enregistrement écrase la mémoire du
        module."
      it: "Accetta comandi MQTT per riprodurre o registrare scene su un Scene Module
        C-Bus. Disattivo di default: la maggior parte usa scene Trigger Control, e
        la registrazione sovrascrive la memoria del modulo."
      nl: "Accepteert MQTT-commando's om scènes op een C-Bus Scene Module af te spelen
        of op te nemen. Standaard uit: de meeste installs gebruiken Trigger
        Control, en opnemen overschrijft het modulegeheugen."
      pt: "Aceita comandos MQTT para reproduzir ou gravar cenas num Scene Module
        C-Bus. Desligado por padrão: a maioria usa cenas de Trigger Control, e
        gravar sobrescreve a memória do módulo."
      ru: "Принимает MQTT-команды воспроизведения и записи сцен на C-Bus Scene Module.
        По умолчанию выкл.: чаще используют сцены Trigger Control, а запись
        перезаписывает память модуля."
      zh: 接受在 C-Bus Scene Module 上播放或录制场景的 MQTT 命令。默认关闭：多数安装使用 Trigger Control
        场景，录制会覆盖模块存储器。
      ja: C-Bus Scene Module のシーン再生・記録 MQTT コマンドを受け付けます。既定はオフ。多くは Trigger Control
        シーンを使い、記録はモジュールメモリを上書きします。
      ko: "C-Bus Scene Module에서 장면을 재생하거나 녹음하는 MQTT 명령을 받습니다. 기본 꺼짐: 대부분 Trigger
        Control 장면을 쓰며, 녹음은 모듈 메모리를 덮어씁니다."
      pl: "Przyjmuje polecenia MQTT odtwarzania i nagrywania scen na C-Bus Scene
        Module. Domyślnie wyłączone: większość używa scen Trigger Control, a zapis
        nadpisuje pamięć modułu."
      sv: "Tar emot MQTT-kommandon som spelar upp eller spelar in scener på en C-Bus
        Scene Module. Av som standard: de flesta använder Trigger Control, och
        inspelning skriver över modulens minne."
      no: "Godtar MQTT-kommandoer som spiller av eller tar opp scener på en C-Bus
        Scene Module. Av som standard: de fleste bruker Trigger Control, og opptak
        overskriver modulminnet."
      da: "Accepterer MQTT-kommandoer der afspiller eller optager scener på et C-Bus
        Scene Module. Fra som standard: de fleste bruger Trigger Control, og
        optagelse overskriver modulets hukommelse."
      cs: "Přijímá MQTT příkazy pro přehrání nebo nahrání scén na C-Bus Scene Module.
        Ve výchozím stavu vypnuto: většina používá scény Trigger Control a nahrání
        přepíše paměť modulu."
      uk: "Приймає MQTT-команди відтворення й запису сцен на C-Bus Scene Module.
        Типово вимкнено: більшість використовує сцени Trigger Control, а запис
        перезаписує пам'ять модуля."

  cbus_enable_control_app_id:
    name:
      en: Enable Control Application ID
      de: Enable-Control-Anwendungs-ID
      es: ID de aplicación Enable Control
      fr: ID d'application Enable Control
      it: ID applicazione Enable Control
      nl: Enable Control-toepassings-ID
      pt: ID da aplicação Enable Control
      ru: ID приложения Enable Control
      zh: Enable Control 应用 ID
      ja: Enable Control アプリケーションID
      ko: Enable Control 애플리케이션 ID
      pl: ID aplikacji Enable Control
      sv: Enable Control-applikations-ID
      no: Enable Control-applikasjons-ID
      da: Enable Control-applikations-id
      cs: ID aplikace Enable Control
      uk: ID застосунку Enable Control
    description:
      en: >-
        C-Bus Enable Control application id (typically 203) for MQTT set, label
        and remove writes. Leave empty to disable. Remove deletes the C-Gate
        group object — publish ON on the remove topic. Labels are hex-encoded.
        No Home Assistant entities are created.
      de: >-
        C-Bus Enable-Control-Anwendungs-ID (typisch 203) für MQTT-Schreibvorgänge
        set, label und remove. Leer lassen zum Deaktivieren. Remove löscht das
        C-Gate-Gruppenobjekt — ON auf das Remove-Topic veröffentlichen. Labels
        werden hex-kodiert. Es werden keine Home-Assistant-Entitäten erstellt.
      es: >-
        ID de aplicación Enable Control de C-Bus (típicamente 203) para escrituras
        MQTT set, label y remove. Vacío para desactivar. Remove elimina el objeto
        de grupo de C-Gate: publique ON en el topic remove. Las etiquetas se
        codifican en hex. No se crean entidades de Home Assistant.
      fr: >-
        ID d'application Enable Control C-Bus (typiquement 203) pour les écritures
        MQTT set, label et remove. Laisser vide pour désactiver. Remove supprime
        l'objet groupe C-Gate — publiez ON sur le topic remove. Les libellés sont
        encodés en hex. Aucune entité Home Assistant n'est créée.
      it: >-
        ID applicazione Enable Control C-Bus (in genere 203) per scritture MQTT
        set, label e remove. Lasciare vuoto per disattivare. Remove elimina
        l'oggetto gruppo C-Gate: pubblicare ON sul topic remove. Le etichette
        sono in hex. Non vengono create entità Home Assistant.
      nl: >-
        C-Bus Enable Control-toepassings-ID (meestal 203) voor MQTT-writes set,
        label en remove. Leeg laten om uit te schakelen. Remove verwijdert het
        C-Gate-groepsobject — publiceer ON op het remove-topic. Labels zijn
        hex-gecodeerd. Er worden geen Home Assistant-entiteiten aangemaakt.
      pt: >-
        ID da aplicação Enable Control C-Bus (tipicamente 203) para escritas MQTT
        set, label e remove. Deixe vazio para desativar. Remove apaga o objeto de
        grupo do C-Gate — publique ON no tópico remove. Etiquetas em hex. Não
        cria entidades do Home Assistant.
      ru: >-
        ID приложения Enable Control C-Bus (обычно 203) для MQTT-записей set,
        label и remove. Пусто — выкл. Remove удаляет объект группы C-Gate —
        публикуйте ON в топик remove. Метки в hex. Сущности Home Assistant не
        создаются.
      zh: C-Bus Enable Control 应用 ID（通常为 203），用于 MQTT 的 set、label 和 remove 写入。留空即关闭。remove 会删除 C-Gate
        组对象——请在 remove 主题发布 ON。标签以十六进制编码。不会创建 Home Assistant 实体。
      ja: C-Bus Enable Control アプリケーションID（通常 203）。MQTT の set / label / remove 書き込み用。空で無効。remove は
        C-Gate グループオブジェクトを削除します。remove トピックに ON を発行してください。ラベルは hex 符号化。Home
        Assistant エンティティは作成しません。
      ko: "C-Bus Enable Control 애플리케이션 ID(보통 203). MQTT set, label, remove 쓰기용. 비우면
        꺼짐. remove는 C-Gate 그룹 객체를 삭제하므로 remove 토픽에 ON을 게시하세요. 라벨은 hex 인코딩.
        Home Assistant 엔티티는 만들지 않습니다."
      pl: >-
        ID aplikacji Enable Control C-Bus (zazwyczaj 203) dla zapisów MQTT set,
        label i remove. Puste wyłącza. Remove usuwa obiekt grupy C-Gate —
        publikuj ON na temacie remove. Etykiety w hex. Nie tworzy encji Home
        Assistant.
      sv: >-
        C-Bus Enable Control-applikations-ID (vanligen 203) för MQTT-skrivningar
        set, label och remove. Tomt inaktiverar. Remove tar bort C-Gate-gruppobjektet
        — publicera ON på remove-ämnet. Etiketter hex-kodas. Inga Home
        Assistant-entiteter skapas.
      no: >-
        C-Bus Enable Control-applikasjons-ID (vanligvis 203) for MQTT-skriving
        set, label og remove. Tomt slår av. Remove sletter C-Gate-gruppeobjektet
        — publiser ON på remove-emnet. Etiketter hex-kodes. Ingen Home
        Assistant-entiteter opprettes.
      da: >-
        C-Bus Enable Control-applikations-id (typisk 203) til MQTT-skrivninger
        set, label og remove. Tomt slår fra. Remove sletter C-Gate-gruppeobjektet
        — publicér ON på remove-emnet. Etiketter hex-kodes. Der oprettes ingen
        Home Assistant-entiteter.
      cs: >-
        ID aplikace Enable Control C-Bus (typicky 203) pro MQTT zápisy set, label
        a remove. Prázdné vypne. Remove smaže objekt skupiny C-Gate — publikujte
        ON na téma remove. Štítky v hex. Nevytváří entity Home Assistant.
      uk: >-
        ID застосунку Enable Control C-Bus (зазвичай 203) для MQTT-записів set,
        label і remove. Порожнє вимикає. Remove видаляє об'єкт групи C-Gate —
        публікуйте ON у топік remove. Мітки в hex. Сутності Home Assistant не
        створюються.

  cbus_raw_event_log_apps:
    name:
      en: Raw event capture apps
      de: Apps für Rohereignis-Aufzeichnung
      es: Apps de captura de eventos en bruto
      fr: Apps de capture d'événements bruts
      it: App cattura eventi grezzi
      nl: Apps voor ruwe-eventopname
      pt: Apps de captura de eventos em bruto
      ru: Приложения для сырого захвата событий
      zh: 原始事件捕获应用
      ja: 生イベントキャプチャ対象アプリ
      ko: 원시 이벤트 캡처 앱
      pl: Aplikacje przechwytywania surowych zdarzeń
      sv: Appar för rå händelseinspelning
      no: Appar for rå hendelsesfangst
      da: Apps til rå hændelsesfangst
      cs: Aplikace pro zachytávání surových událostí
      uk: Застосунки для сирого захоплення подій
    description:
      en: >-
        C-Bus application IDs whose raw C-Gate event lines are logged and
        republished to the raw MQTT topic for protocol capture. Empty disables.
        Noisy; leave empty in normal use.
      de: >-
        C-Bus-Anwendungs-IDs, deren rohe C-Gate-Ereigniszeilen protokolliert und
        auf das raw-MQTT-Topic veröffentlicht werden. Leer deaktiviert. Laut;
        im Normalbetrieb leer lassen.
      es: >-
        IDs de aplicación C-Bus cuyas líneas de eventos C-Gate en bruto se
        registran y republican en el topic MQTT raw. Vacío desactiva. Es ruidoso;
        déjelo vacío en uso normal.
      fr: >-
        ID d'application C-Bus dont les lignes d'événements C-Gate brutes sont
        journalisées et republiees sur le topic MQTT raw. Vide désactive. Bruyant ;
        laisser vide en usage normal.
      it: >-
        ID applicazione C-Bus le cui righe evento C-Gate grezze vengono registrate
        e ripubblicate sul topic MQTT raw. Vuoto disattiva. Rumoroso; lasciare
        vuoto nell'uso normale.
      nl: >-
        C-Bus-app-ID's waarvan ruwe C-Gate-eventregels worden gelogd en opnieuw
        gepubliceerd op het raw-MQTT-topic. Leeg schakelt uit. Luidruchtig; laat
        leeg bij normaal gebruik.
      pt: >-
        IDs de aplicação C-Bus cujas linhas de evento C-Gate em bruto são
        registadas e republicadas no tópico MQTT raw. Vazio desativa. Ruidoso;
        deixe vazio no uso normal.
      ru: >-
        ID приложений C-Bus, чьи сырые строки событий C-Gate пишутся в журнал и
        публикуются в MQTT-топик raw. Пусто выключает. Шумно; в обычной работе
        оставляйте пустым.
      zh: C-Bus 应用 ID，将其原始 C-Gate 事件行记录并发布到 raw MQTT 主题以供协议捕获。留空即关闭。较吵，日常使用请保持为空。
      ja: 生の C-Gate イベント行をログし raw MQTT トピックへ再公開する C-Bus アプリ ID。空で無効。うるさいので通常は空のまま。
      ko: 원시 C-Gate 이벤트 줄을 기록하고 raw MQTT 토픽으로 다시 게시할 C-Bus 앱 ID. 비우면 꺼짐. 로그가 많으니 평소에는 비워 두세요.
      pl: >-
        ID aplikacji C-Bus, których surowe linie zdarzeń C-Gate są logowane i
        publikowane na temat MQTT raw. Puste wyłącza. Głośne; w normalnym użyciu
        zostaw puste.
      sv: >-
        C-Bus-applikations-ID vars råa C-Gate-händelserader loggas och publiceras
        till MQTT-ämnet raw. Tomt inaktiverar. Bullrigt; lämna tomt vid vanlig
        användning.
      no: >-
        C-Bus-applikasjons-ID-er hvis rå C-Gate-hendelseslinjer logges og
        publiseres til MQTT-emnet raw. Tomt slår av. Støyete; la stå tomt i
        vanlig bruk.
      da: >-
        C-Bus-applikations-id'er hvis rå C-Gate-hændelseslinjer logges og
        publiceres til MQTT-emnet raw. Tomt slår fra. Støjende; lad stå tomt ved
        normal brug.
      cs: >-
        ID aplikací C-Bus, jejichž surové řádky událostí C-Gate se logují a
        publikují do MQTT tématu raw. Prázdné vypne. Hlučné; při běžném použití
        nechte prázdné.
      uk: >-
        ID застосунків C-Bus, чиї сирі рядки подій C-Gate журналюються й
        публікуються в MQTT-топік raw. Порожнє вимикає. Шумно; у звичайній роботі
        залишайте порожнім.

  ha_bridge_diagnostics_enabled:
    name:
      en: Enable Bridge Diagnostics
      de: Bridge-Diagnose aktivieren
      es: Habilitar diagnósticos del bridge
      fr: Activer les diagnostics du bridge
      it: Abilita diagnostica del bridge
      nl: Bridge Diagnostiek inschakelen
      pt: Ativar Diagnósticos do Bridge
      ru: Включить диагностику bridge
      zh: 启用 Bridge 诊断
      ja: Bridge 診断を有効化
      ko: Bridge 진단 활성화
      pl: Włącz diagnostykę bridge
      sv: Aktivera bridge-diagnostik
      no: Aktiver bridge-diagnostikk
      da: Aktivér bridge-diagnostik
      cs: Povolit diagnostiku bridge
      uk: Увімкнути діагностику bridge
    description:
      en: >-
        Publish bridge health entities (ready state, connections, queue depth)
        to Home Assistant. Default: enabled.
      de: >-
        Bridge-Gesundheitsentitäten (Bereitschaftszustand, Verbindungen,
        Warteschlangentiefe) an Home Assistant veröffentlichen. Standard:
        aktiviert.
      es: >-
        Publicar entidades de salud del bridge (estado de preparación,
        conexiones, profundidad de cola) en Home Assistant. Predeterminado:
        habilitado.
      fr: >-
        Publier les entités de santé du bridge (état de préparation, connexions,
        profondeur de file d'attente) dans Home Assistant. Par défaut : activé.
      it: >-
        Pubblicare entità di salute del bridge (stato di pronto, connessioni,
        profondità della coda) in Home Assistant. Predefinito: abilitato.
      nl: >-
        Bridge-gezondheidsentiteiten (gereedstatus, verbindingen,
        wachtrijdiepte) publiceren naar Home Assistant. Standaard: ingeschakeld.
      pt: >-
        Publicar entidades de saúde do bridge (estado de prontidão, ligações,
        profundidade da fila) no Home Assistant. Predefinido: ativado.
      ru: >-
        Публиковать объекты состояния bridge (готовность, подключения, глубина
        очереди) в Home Assistant. По умолчанию: включено.
      zh: >-
        向 Home Assistant 发布 Bridge 健康实体（就绪状态、连接、队列深度）。 默认：启用。
      ja: >-
        Bridge ヘルスエンティティ（準備状態、接続、キュー深度）を Home Assistant に公開します。デフォルト：有効。
      ko: >-
        Bridge 상태 엔티티 (준비 상태, 연결, 큐 깊이)를 Home Assistant에 게시합니다. 기본값: 활성화.
      pl: >-
        Publikuj encje zdrowia bridge (stan gotowości, połączenia, głębokość
        kolejki) do Home Assistant. Domyślnie: włączone.
      sv: >-
        Publicera bridge-hälsoentiteter (redo-status, anslutningar, ködjup) till
        Home Assistant. Standard: aktiverat.
      no: >-
        Publiser bridge-helseentiteter (klar-status, tilkoblinger, kødybde) til
        Home Assistant. Standard: aktivert.
      da: >-
        Publicer bridge-sundhedsentiteter (klar-status, forbindelser, kødybde)
        til Home Assistant. Standard: aktiveret.
      cs: >-
        Publikovat entity zdraví bridge (stav připravenosti, připojení, hloubka
        fronty) do Home Assistant. Výchozí: povoleno.
      uk: >-
        Публікувати об'єкти стану bridge (готовність, підключення, глибина
        черги) до Home Assistant. За замовчуванням: увімкнено.
  ha_bridge_diagnostics_interval_sec:
    name:
      en: Diagnostics Interval (seconds)
      de: Diagnoseintervall (Sekunden)
      es: Intervalo de diagnósticos (segundos)
      fr: Intervalle de diagnostics (secondes)
      it: Intervallo di diagnostica (secondi)
      nl: Diagnostiekinterval (seconden)
      pt: Intervalo de Diagnósticos (segundos)
      ru: Интервал диагностики (секунды)
      zh: 诊断间隔（秒）
      ja: 診断間隔（秒）
      ko: 진단 간격 (초)
      pl: Interwał diagnostyki (sekundy)
      sv: Diagnostikintervall (sekunder)
      no: Diagnostikkintervall (sekunder)
      da: Diagnostikinterval (sekunder)
      cs: Interval diagnostiky (sekundy)
      uk: Інтервал діагностики (секунди)
    description:
      en: >-
        How often bridge diagnostic states are refreshed. Default: 60.
      de: >-
        Wie oft die Bridge-Diagnosezustände aktualisiert werden. Standard: 60.
      es: >-
        Con qué frecuencia se actualizan los estados de diagnóstico del bridge.
        Predeterminado: 60.
      fr: >-
        Fréquence de rafraîchissement des états de diagnostic du bridge. Par
        défaut : 60.
      it: >-
        Con quale frequenza vengono aggiornati gli stati di diagnostica del
        bridge. Predefinito: 60.
      nl: >-
        Hoe vaak bridge-diagnostiekstatussen worden vernieuwd. Standaard: 60.
      pt: >-
        Com que frequência os estados de diagnóstico do bridge são atualizados.
        Predefinido: 60.
      ru: >-
        Как часто обновляются диагностические состояния bridge. По умолчанию: 60.
      zh: >-
        Bridge 诊断状态的刷新频率。默认：60。
      ja: >-
        Bridge 診断状態の更新頻度。デフォルト：60。
      ko: >-
        Bridge 진단 상태가 새로 고침되는 빈도. 기본값: 60.
      pl: >-
        Jak często odświeżane są stany diagnostyczne bridge. Domyślnie: 60.
      sv: >-
        Hur ofta bridge-diagnostikstatus uppdateras. Standard: 60.
      no: >-
        Hvor ofte bridge-diagnostikkstatuser oppdateres. Standard: 60.
      da: >-
        Hvor ofte bridge-diagnostikstatuser opdateres. Standard: 60.
      cs: >-
        Jak často se aktualizují diagnostické stavy bridge. Výchozí: 60.
      uk: >-
        Як часто оновлюються діагностичні стани bridge. За замовчуванням: 60.
  cni_offline_notification:
    name:
      en: CNI Offline Notification
      de: CNI-Offline-Benachrichtigung
      es: Notificación de CNI desconectado
      fr: Notification CNI hors ligne
      it: Notifica CNI offline
      nl: CNI-offline melding
      pt: Notificação de CNI offline
      ru: Уведомление об отключении CNI
      zh: CNI 离线通知
      ja: CNI オフライン通知
      ko: CNI 오프라인 알림
      pl: Powiadomienie o offline CNI
      sv: CNI offline-avisering
      no: CNI offline-varsling
      da: CNI offline-notifikation
      cs: Oznámení o offline CNI
      uk: Сповіщення про офлайн CNI
    description:
      en: >-
        Raise a Home Assistant persistent notification if a C-Bus network’s
        CNI/PCI link goes offline, and dismiss it when it reconnects. Requires
        the Home Assistant add-on environment. Off by default.
      de: >-
        Eine Home Assistant Benachrichtigung auslösen, wenn die
        CNI/PCI-Verbindung eines C-Bus-Netzwerks offline geht, und sie bei
        erneuter Verbindung verwerfen. Erfordert die Home Assistant
        Add-on-Umgebung. Standardmäßig deaktiviert.
      es: >-
        Mostrar una notificación de Home Assistant si el enlace CNI/PCI de una
        red C-Bus se desconecta, y descartarla al reconectarse. Requiere el
        entorno del complemento de Home Assistant. Desactivado por defecto.
      fr: >-
        Émettre une notification Home Assistant si le lien CNI/PCI d’un réseau
        C-Bus passe hors ligne, et la supprimer à la reconnexion. Nécessite
        l’environnement de module complémentaire Home Assistant. Désactivé par
        défaut.
      it: >-
        Mostra una notifica di Home Assistant se il collegamento CNI/PCI di una
        rete C-Bus va offline e rimuovila alla riconnessione. Richiede
        l’ambiente add-on di Home Assistant. Disattivato per impostazione
        predefinita.
      nl: >-
        Een Home Assistant-melding tonen als de CNI/PCI-verbinding van een
        C-Bus-netwerk offline gaat, en deze verwijderen bij herverbinding.
        Vereist de Home Assistant add-on-omgeving. Standaard uitgeschakeld.
      pt: >-
        Mostrar uma notificação do Home Assistant se a ligação CNI/PCI de uma
        rede C-Bus ficar offline e dispensá-la ao reconectar. Requer o ambiente
        de add-on do Home Assistant. Desativado por predefinição.
      ru: >-
        Показывать уведомление Home Assistant, если связь CNI/PCI сети C-Bus
        переходит в офлайн, и отклонять его при восстановлении. Требуется среда
        дополнения Home Assistant. По умолчанию отключено.
      zh: >-
        当 C-Bus 网络的 CNI/PCI 连接离线时显示 Home Assistant 通知，并在重新连接时关闭。需要 Home
        Assistant 加载项环境。默认关闭。
      ja: >-
        C-Bus ネットワークの CNI/PCI リンクがオフラインになった場合に Home Assistant
        通知を表示し、再接続時に解除します。Home Assistant アドオン環境が必要です。デフォルトは無効です。
      ko: >-
        C-Bus 네트워크의 CNI/PCI 링크가 오프라인이 되면 Home Assistant 알림을 표시하고 다시 연결되면 해제합니다.
        Home Assistant 애드온 환경이 필요합니다. 기본값은 비활성화입니다.
      pl: >-
        Wyświetl powiadomienie Home Assistant, jeśli łącze CNI/PCI sieci C-Bus
        przejdzie w tryb offline, i odrzuć je po ponownym połączeniu. Wymaga
        środowiska dodatku Home Assistant. Domyślnie wyłączone.
      sv: >-
        Visa en Home Assistant-avisering om en C-Bus-nätverks CNI/PCI-länk går
        offline, och ta bort den vid återanslutning. Kräver Home
        Assistant-tilläggsmiljön. Avstängt som standard.
      no: >-
        Vis et Home Assistant-varsel hvis CNI/PCI-koblingen til et
        C-Bus-nettverk går offline, og fjern det ved gjentilkobling. Krever Home
        Assistant-tilleggsmiljøet. Av som standard.
      da: >-
        Vis en Home Assistant-notifikation hvis en C-Bus-netværks
        CNI/PCI-forbindelse går offline, og afvis den ved genforbindelse. Kræver
        Home Assistant-tilføjelsesmiljøet. Slået fra som standard.
      cs: >-
        Zobrazit oznámení Home Assistant, pokud spojení CNI/PCI sítě C-Bus
        přejde do offline, a po obnovení jej zrušit. Vyžaduje prostředí doplňku
        Home Assistant. Ve výchozím nastavení vypnuto.
      uk: >-
        Показувати сповіщення Home Assistant, якщо зв’язок CNI/PCI мережі C-Bus
        переходить в офлайн, і відхиляти його після відновлення. Потребує
        середовища додатка Home Assistant. Вимкнено за замовчуванням.
  stale_device_detection_enabled:
    name:
      en: Enable Stale Device Detection
      de: Erkennung veralteter Geräte aktivieren
      es: Habilitar detección de dispositivos inactivos
      fr: Activer la détection d'appareils inactifs
      it: Abilita rilevamento dispositivi inattivi
      nl: Detectie van verouderde apparaten inschakelen
      pt: Ativar Deteção de Dispositivos Inativos
      ru: Включить обнаружение устаревших устройств
      zh: 启用过时设备检测
      ja: 古いデバイスの検出を有効化
      ko: 오래된 장치 감지 활성화
      pl: Włącz wykrywanie nieaktywnych urządzeń
      sv: Aktivera upptäckt av inaktiva enheter
      no: Aktiver oppdagelse av inaktive enheter
      da: Aktivér opdagelse af inaktive enheder
      cs: Povolit detekci neaktivních zařízení
      uk: Увімкнути виявлення застарілих пристроїв
    description:
      en: >-
        Detect C-Bus devices that stop reporting and publish a warning sensor.
        Default: enabled.
      de: >-
        C-Bus Geräte erkennen, die keine Meldungen mehr senden, und einen
        Warnsensor veröffentlichen. Standard: aktiviert.
      es: >-
        Detectar dispositivos C-Bus que dejan de reportar y publicar un sensor
        de advertencia. Predeterminado: habilitado.
      fr: >-
        Détecter les appareils C-Bus qui cessent de signaler et publier un
        capteur d'avertissement. Par défaut : activé.
      it: >-
        Rilevare i dispositivi C-Bus che smettono di rispondere e pubblicare un
        sensore di avviso. Predefinito: abilitato.
      nl: >-
        C-Bus apparaten detecteren die stoppen met rapporteren en een
        waarschuwingssensor publiceren. Standaard: ingeschakeld.
      pt: >-
        Detetar dispositivos C-Bus que deixam de reportar e publicar um sensor
        de aviso. Predefinido: ativado.
      ru: >-
        Обнаруживать устройства C-Bus, которые перестали отвечать, и публиковать
        датчик предупреждения. По умолчанию: включено.
      zh: >-
        检测停止报告的 C-Bus 设备并发布警告传感器。默认：启用。
      ja: >-
        報告を停止した C-Bus デバイスを検出し、警告センサーを公開します。 デフォルト：有効。
      ko: >-
        보고를 중단한 C-Bus 장치를 감지하고 경고 센서를 게시합니다. 기본값: 활성화.
      pl: >-
        Wykrywaj urządzenia C-Bus które przestają raportować i publikuj czujnik
        ostrzeżenia. Domyślnie: włączone.
      sv: >-
        Upptäck C-Bus enheter som slutar rapportera och publicera en
        varningssensor. Standard: aktiverat.
      no: >-
        Oppdag C-Bus enheter som slutter å rapportere og publiser en
        advarselssensor. Standard: aktivert.
      da: >-
        Opdag C-Bus enheder der holder op med at rapportere og publicer en
        advarselssensor. Standard: aktiveret.
      cs: >-
        Detekovat zařízení C-Bus která přestala hlásit a publikovat varovný
        senzor. Výchozí: povoleno.
      uk: >-
        Виявляти пристрої C-Bus, які перестали відповідати, та публікувати
        датчик попередження. За замовчуванням: увімкнено.
  stale_device_threshold_hours:
    name:
      en: Stale Device Threshold (hours)
      de: Schwellenwert für veraltete Geräte (Stunden)
      es: Umbral de dispositivo inactivo (horas)
      fr: Seuil d'inactivité (heures)
      it: Soglia dispositivo inattivo (ore)
      nl: Drempel voor verouderd apparaat (uren)
      pt: Limite de Dispositivo Inativo (horas)
      ru: Порог устаревшего устройства (часы)
      zh: 过时设备阈值（小时）
      ja: 古いデバイスの閾値（時間）
      ko: 오래된 장치 임계값 (시간)
      pl: Próg nieaktywności urządzenia (godziny)
      sv: Tröskel för inaktiv enhet (timmar)
      no: Terskel for inaktiv enhet (timer)
      da: Tærskel for inaktiv enhed (timer)
      cs: Práh neaktivního zařízení (hodiny)
      uk: Поріг застарілого пристрою (години)
    description:
      en: >-
        Hours without a state update before a device is considered stale.
        Default: 24.
      de: >-
        Stunden ohne Statusaktualisierung, bevor ein Gerät als veraltet gilt.
        Standard: 24.
      es: >-
        Horas sin actualización de estado antes de que un dispositivo se
        considere inactivo. Predeterminado: 24.
      fr: >-
        Heures sans mise à jour d'état avant qu'un appareil soit considéré comme
        inactif. Par défaut : 24.
      it: >-
        Ore senza aggiornamento di stato prima che un dispositivo sia
        considerato inattivo. Predefinito: 24.
      nl: >-
        Uren zonder statusupdate voordat een apparaat als verouderd wordt
        beschouwd. Standaard: 24.
      pt: >-
        Horas sem atualização de estado antes de um dispositivo ser considerado
        inativo. Predefinido: 24.
      ru: >-
        Часов без обновления состояния, прежде чем устройство считается
        устаревшим. По умолчанию: 24.
      zh: >-
        设备被视为过时之前没有状态更新的小时数。默认：24。
      ja: >-
        デバイスが古いと見なされるまでの状態更新のない時間数。デフォルト：24。
      ko: >-
        장치가 오래된 것으로 간주되기 전 상태 업데이트 없는 시간. 기본값: 24.
      pl: >-
        Godziny bez aktualizacji stanu zanim urządzenie zostanie uznane za
        nieaktywne. Domyślnie: 24.
      sv: >-
        Timmar utan statusuppdatering innan en enhet anses inaktiv. Standard: 24.
      no: >-
        Timer uten statusoppdatering før en enhet anses som inaktiv. Standard:
        24.
      da: >-
        Timer uden statusopdatering før en enhed anses for inaktiv. Standard: 24.
      cs: >-
        Hodiny bez aktualizace stavu než je zařízení považováno za neaktivní.
        Výchozí: 24.
      uk: >-
        Годин без оновлення стану, перш ніж пристрій вважається застарілим. За
        замовчуванням: 24.
  stale_device_check_interval_sec:
    name:
      en: Stale Check Interval (seconds)
      de: Prüfintervall für veraltete Geräte (Sekunden)
      es: Intervalo de verificación de inactividad (segundos)
      fr: Intervalle de vérification d'inactivité (secondes)
      it: Intervallo di controllo inattività (secondi)
      nl: Controle-interval voor verouderde apparaten (seconden)
      pt: Intervalo de Verificação de Inatividade (segundos)
      ru: Интервал проверки устаревших устройств (секунды)
      zh: 过时检查间隔（秒）
      ja: 古いデバイスのチェック間隔（秒）
      ko: 오래된 장치 확인 간격 (초)
      pl: Interwał sprawdzania nieaktywności (sekundy)
      sv: Kontrollintervall för inaktiva enheter (sekunder)
      no: Kontrollintervall for inaktive enheter (sekunder)
      da: Kontrolinterval for inaktive enheder (sekunder)
      cs: Interval kontroly neaktivity (sekundy)
      uk: Інтервал перевірки застарілості (секунди)
    description:
      en: >-
        How often to scan for stale devices. Default: 3600 (1 hour).
      de: >-
        Wie oft nach veralteten Geräten gesucht wird. Standard: 3600 (1 Stunde).
      es: >-
        Con qué frecuencia buscar dispositivos inactivos. Predeterminado: 3600
        (1 hora).
      fr: >-
        Fréquence de recherche d'appareils inactifs. Par défaut : 3600 (1 heure).
      it: >-
        Con quale frequenza cercare dispositivi inattivi. Predefinito: 3600 (1
        ora).
      nl: >-
        Hoe vaak er wordt gezocht naar verouderde apparaten. Standaard: 3600 (1
        uur).
      pt: >-
        Com que frequência procurar dispositivos inativos. Predefinido: 3600 (1
        hora).
      ru: >-
        Как часто искать устаревшие устройства. По умолчанию: 3600 (1 час).
      zh: >-
        扫描过时设备的频率。默认：3600（1 小时）。
      ja: >-
        古いデバイスをスキャンする頻度。デフォルト：3600（1 時間）。
      ko: >-
        오래된 장치를 스캔하는 빈도. 기본값: 3600 (1시간).
      pl: >-
        Jak często skanować w poszukiwaniu nieaktywnych urządzeń. Domyślnie:
        3600 (1 godzina).
      sv: >-
        Hur ofta inaktiva enheter söks. Standard: 3600 (1 timme).
      no: >-
        Hvor ofte det søkes etter inaktive enheter. Standard: 3600 (1 time).
      da: >-
        Hvor ofte der søges efter inaktive enheder. Standard: 3600 (1 time).
      cs: >-
        Jak často hledat neaktivní zařízení. Výchozí: 3600 (1 hodina).
      uk: >-
        Як часто шукати застарілі пристрої. За замовчуванням: 3600 (1 година).
  connection_pool_size:
    name:
      en: Connection Pool Size
      de: Verbindungspoolgröße
      es: Tamaño del pool de conexiones
      fr: Taille du pool de connexions
      it: Dimensione del pool di connessioni
      nl: Verbindingspool grootte
      pt: Tamanho do Pool de Ligações
      ru: Размер пула подключений
      zh: 连接池大小
      ja: 接続プールサイズ
      ko: 연결 풀 크기
      pl: Rozmiar puli połączeń
      sv: Anslutningspoolstorlek
      no: Tilkoblingspoolstørrelse
      da: Forbindelsespoolstørrelse
      cs: Velikost poolu připojení
      uk: Розмір пулу підключень
    description:
      en: >-
        Number of parallel TCP connections to C-Gate. Increase for
        high-throughput installations, reduce to 1 for older C-Gate. Default: 3.
      de: >-
        Anzahl paralleler TCP-Verbindungen zu C-Gate. Bei
        Hochdurchsatz-Installationen erhöhen, für älteres C-Gate auf 1
        reduzieren. Standard: 3.
      es: >-
        Número de conexiones TCP paralelas a C-Gate. Aumentar para instalaciones
        de alto rendimiento, reducir a 1 para C-Gate antiguo. Predeterminado: 3.
      fr: >-
        Nombre de connexions TCP parallèles à C-Gate. Augmenter pour les
        installations à haut débit, réduire à 1 pour les anciens C-Gate. Par
        défaut : 3.
      it: >-
        Numero di connessioni TCP parallele a C-Gate. Aumentare per
        installazioni ad alto throughput, ridurre a 1 per C-Gate più vecchi.
        Predefinito: 3.
      nl: >-
        Aantal parallelle TCP-verbindingen naar C-Gate. Verhogen voor
        installaties met hoge doorvoer, verlagen naar 1 voor ouder C-Gate.
        Standaard: 3.
      pt: >-
        Número de ligações TCP paralelas ao C-Gate. Aumentar para instalações de
        alto débito, reduzir para 1 para C-Gate mais antigo. Predefinido: 3.
      ru: >-
        Количество параллельных TCP-подключений к C-Gate. Увеличьте для
        высоконагруженных установок, уменьшите до 1 для старых C-Gate. По
        умолчанию: 3.
      zh: >-
        到 C-Gate 的并行 TCP 连接数。高吞吐量安装可增加，旧版 C-Gate 减少 到 1。默认：3。
      ja: >-
        C-Gate への並列 TCP 接続数。高スループットのインストールでは増加し、 古い C-Gate では 1
        に減らしてください。デフォルト：3。
      ko: >-
        C-Gate에 대한 병렬 TCP 연결 수. 높은 처리량 설치의 경우 증가하고, 이전 C-Gate의 경우 1로 줄이세요. 기본값:
        3.
      pl: >-
        Liczba równoległych połączeń TCP do C-Gate. Zwiększ dla instalacji o
        wysokiej przepustowości, zmniejsz do 1 dla starszych C-Gate. Domyślnie:
        3.
      sv: >-
        Antal parallella TCP-anslutningar till C-Gate. Öka för
        högkapacitetsinstallationer, minska till 1 för äldre C-Gate. Standard:
        3.
      no: >-
        Antall parallelle TCP-tilkoblinger til C-Gate. Øk for
        høykapasitetsinstallasjoner, reduser til 1 for eldre C-Gate. Standard:
        3.
      da: >-
        Antal parallelle TCP-forbindelser til C-Gate. Forøg for højtydende
        installationer, reducer til 1 for ældre C-Gate. Standard: 3.
      cs: >-
        Počet paralelních TCP připojení k C-Gate. Zvyšte pro instalace s vysokou
        propustností, snižte na 1 pro starší C-Gate. Výchozí: 3.
      uk: >-
        Кількість паралельних TCP-підключень до C-Gate. Збільшіть для
        високонавантажених інсталяцій, зменшіть до 1 для старих C-Gate. За
        замовчуванням: 3.
  connection_health_check_interval_sec:
