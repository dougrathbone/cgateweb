      fr: >-
        Temps prévu pour qu'un volet s'ouvre/se ferme complètement. Le bridge
        publie des positions estimées pendant cette fenêtre. Par défaut : 5.
      it: >-
        Tempo previsto per l'apertura/chiusura completa di una copertura. Il
        bridge pubblica posizioni stimate durante questa finestra. Predefinito:
        5.
      nl: >-
        Verwachte tijd voor een cover om volledig te openen/sluiten. De bridge
        publiceert geschatte posities tijdens dit venster. Standaard: 5.
      pt: >-
        Tempo esperado para um estore abrir/fechar completamente. O bridge
        publica posições estimadas durante esta janela. Predefinido: 5.
      ru: >-
        Ожидаемое время полного открытия/закрытия штор. Bridge публикует
        расчётные позиции в течение этого окна. По умолчанию: 5.
      zh: >-
        窗帘完全打开/关闭的预期时间。Bridge 在此窗口期间发布估计位置。 默认：5。
      ja: >-
        カバーが完全に開閉するまでの予想時間。Bridge はこのウィンドウ中に 推定位置を公開します。デフォルト：5。
      ko: >-
        커버가 완전히 열리거나 닫히는 데 걸리는 예상 시간. Bridge는 이 기간 동안 추정 위치를 게시합니다. 기본값: 5.
      pl: >-
        Oczekiwany czas pełnego otwarcia/zamknięcia osłony. Bridge publikuje
        szacowane pozycje w tym oknie. Domyślnie: 5.
      sv: >-
        Förväntad tid för ett skydd att öppna/stänga helt. Bridge publicerar
        uppskattade positioner under detta fönster. Standard: 5.
      no: >-
        Forventet tid for en tildekking å åpne/lukke helt. Bridge publiserer
        estimerte posisjoner i dette vinduet. Standard: 5.
      da: >-
        Forventet tid for en afdækning at åbne/lukke helt. Bridge publicerer
        estimerede positioner i dette vindue. Standard: 5.
      cs: >-
        Očekávaná doba pro úplné otevření/zavření krytu. Bridge publikuje
        odhadované pozice během tohoto okna. Výchozí: 5.
      uk: >-
        Очікуваний час повного відкриття/закриття штор. Bridge публікує
        розрахункові позиції протягом цього вікна. За замовчуванням: 5.
  cbus_label_file:
    name:
      en: Custom Label File
      de: Benutzerdefinierte Label-Datei
      es: Archivo de etiquetas personalizado
      fr: Fichier de labels personnalisé
      it: File di etichette personalizzato
      nl: Aangepast labelbestand
      pt: Ficheiro de Etiquetas Personalizado
      ru: Пользовательский файл меток
      zh: 自定义标签文件
      ja: カスタムラベルファイル
      ko: 사용자 지정 라벨 파일
      pl: Niestandardowy plik etykiet
      sv: Anpassad etikettfil
      no: Egendefinert etikettfil
      da: Brugerdefineret etikettfil
      cs: Vlastní soubor štítků
      uk: Користувацький файл міток
    description:
      en: >-
        Path to a JSON file with custom device names. Auto-detected from common
        paths if not set. The file is watched for changes.
      de: >-
        Pfad zu einer JSON-Datei mit benutzerdefinierten Gerätenamen. Wird
        automatisch von gängigen Pfaden erkannt, wenn nicht gesetzt. Die Datei
        wird auf Änderungen überwacht.
      es: >-
        Ruta a un archivo JSON con nombres de dispositivos personalizados. Se
        detecta automáticamente de rutas comunes si no se establece. El archivo
        se vigila para cambios.
      fr: >-
        Chemin vers un fichier JSON avec des noms de périphériques
        personnalisés. Détecté automatiquement depuis les chemins courants si
        non défini. Le fichier est surveillé pour les changements.
      it: >-
        Percorso di un file JSON con nomi di dispositivi personalizzati.
        Rilevato automaticamente dai percorsi comuni se non impostato. Il file
        viene monitorato per le modifiche.
      nl: >-
        Pad naar een JSON-bestand met aangepaste apparaatnamen. Automatisch
        gedetecteerd van gangbare paden indien niet ingesteld. Het bestand wordt
        bewaakt op wijzigingen.
      pt: >-
        Caminho para um ficheiro JSON com nomes de dispositivos personalizados.
        Detetado automaticamente de caminhos comuns se não definido. O ficheiro
        é vigiado para alterações.
      ru: >-
        Путь к JSON-файлу с пользовательскими именами устройств. Автоматически
        определяется из стандартных путей, если не задан. Файл отслеживается на
        изменения.
      zh: >-
        包含自定义设备名称的 JSON 文件路径。如未设置，将从常见路径自动 检测。文件会被监视以检测更改。
      ja: >-
        カスタムデバイス名を含む JSON ファイルのパス。未設定の場合、一般的な パスから自動検出されます。ファイルは変更が監視されます。
      ko: >-
        사용자 지정 장치 이름이 포함된 JSON 파일 경로. 설정되지 않은 경우 일반적인 경로에서 자동 감지됩니다. 파일 변경이
        모니터링됩니다.
      pl: >-
        Ścieżka do pliku JSON z niestandardowymi nazwami urządzeń. Automatycznie
        wykrywany z typowych ścieżek jeśli nie ustawiony. Plik jest monitorowany
        pod kątem zmian.
      sv: >-
        Sökväg till en JSON-fil med anpassade enhetsnamn. Upptäcks automatiskt
        från vanliga sökvägar om ej angiven. Filen övervakas för ändringar.
      no: >-
        Sti til en JSON-fil med egendefinerte enhetsnavn. Oppdages automatisk
        fra vanlige stier hvis ikke angitt. Filen overvåkes for endringer.
      da: >-
        Sti til en JSON-fil med brugerdefinerede enhedsnavne. Opdages automatisk
        fra almindelige stier hvis ikke angivet. Filen overvåges for ændringer.
      cs: >-
        Cesta k JSON souboru s vlastními názvy zařízení. Automaticky detekován z
        běžných cest pokud není nastaven. Soubor je sledován pro změny.
      uk: >-
        Шлях до JSON-файлу з користувацькими іменами пристроїв. Автоматично
        визначається зі стандартних шляхів, якщо не задано. Файл відстежується
        на зміни.
  web_api_key:
    name:
      en: Web API Key
      de: Web-API-Schlüssel
      es: Clave de Web API
      fr: Clé Web API
      it: Chiave Web API
      nl: Web API-sleutel
      pt: Chave Web API
      ru: Ключ Web API
      zh: Web API 密钥
      ja: Web API キー
      ko: Web API 키
      pl: Klucz Web API
      sv: Web API-nyckel
      no: Web API-nøkkel
      da: Web API-nøgle
      cs: Web API klíč
      uk: Ключ Web API
