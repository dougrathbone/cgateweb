  mqtt_use_tls:
    name:
      en: Enable MQTT TLS
      de: MQTT TLS aktivieren
      es: Habilitar MQTT TLS
      fr: Activer MQTT TLS
      it: Abilita MQTT TLS
      nl: MQTT TLS inschakelen
      pt: Ativar MQTT TLS
      ru: Включить MQTT TLS
      zh: 启用 MQTT TLS
      ja: MQTT TLS を有効化
      ko: MQTT TLS 활성화
      pl: Włącz MQTT TLS
      sv: Aktivera MQTT TLS
      no: Aktiver MQTT TLS
      da: Aktivér MQTT TLS
      cs: Povolit MQTT TLS
      uk: Увімкнути MQTT TLS
    description:
      en: >-
        Connect to MQTT using TLS (mqtts://). Enable for brokers requiring
        encrypted connections (typically port 8883). Not needed for the standard
        Mosquitto add-on.
      de: >-
        Verbindung zum MQTT über TLS (mqtts://). Aktivieren für Broker, die
        verschlüsselte Verbindungen erfordern (typischerweise Port 8883). Nicht
        erforderlich für das Standard-Mosquitto-Add-on.
      es: >-
        Conectar a MQTT usando TLS (mqtts://). Habilitar para brokers que
        requieren conexiones cifradas (típicamente puerto 8883). No necesario
        para el add-on estándar de Mosquitto.
      fr: >-
        Se connecter à MQTT en utilisant TLS (mqtts://). Activer pour les
        brokers nécessitant des connexions chiffrées (typiquement port 8883).
        Non nécessaire pour le module Mosquitto standard.
      it: >-
        Connettersi a MQTT usando TLS (mqtts://). Abilitare per broker che
        richiedono connessioni crittografate (tipicamente porta 8883). Non
        necessario per il componente aggiuntivo Mosquitto standard.
      nl: >-
        Verbinden met MQTT via TLS (mqtts://). Inschakelen voor brokers die
        versleutelde verbindingen vereisen (meestal poort 8883). Niet nodig voor
        de standaard Mosquitto add-on.
      pt: >-
        Ligar ao MQTT usando TLS (mqtts://). Ativar para brokers que requerem
        ligações encriptadas (tipicamente porta 8883). Não necessário para o
        add-on Mosquitto padrão.
      ru: >-
        Подключение к MQTT через TLS (mqtts://). Включите для брокеров,
        требующих шифрованных соединений (обычно порт 8883). Не требуется для
        стандартного дополнения Mosquitto.
      zh: >-
        使用 TLS (mqtts://) 连接 MQTT。为要求加密连接的代理启用（通常端口 8883）。标准 Mosquitto 附加组件不需要。
      ja: >-
        TLS (mqtts://) を使用して MQTT に接続します。暗号化された接続を 必要とするブローカーで有効にしてください（通常ポート
        8883）。標準の Mosquitto アドオンでは不要です。
      ko: >-
        TLS (mqtts://)를 사용하여 MQTT에 연결합니다. 암호화된 연결이 필요한 브로커에 활성화하세요 (일반적으로 포트
        8883). 표준 Mosquitto 애드온에는 필요하지 않습니다.
      pl: >-
        Połącz z MQTT przez TLS (mqtts://). Włącz dla brokerów wymagających
        szyfrowanych połączeń (typowo port 8883). Nie wymagane dla standardowego
        dodatku Mosquitto.
      sv: >-
        Anslut till MQTT med TLS (mqtts://). Aktivera för brokers som kräver
        krypterade anslutningar (vanligtvis port 8883). Behövs inte för standard
        Mosquitto tillägget.
      no: >-
        Koble til MQTT med TLS (mqtts://). Aktiver for brokere som krever
        krypterte tilkoblinger (vanligvis port 8883). Ikke nødvendig for
        standard Mosquitto tillegget.
      da: >-
        Forbind til MQTT med TLS (mqtts://). Aktivér for brokere der kræver
        krypterede forbindelser (typisk port 8883). Ikke nødvendig for standard
        Mosquitto tilføjelsen.
      cs: >-
        Připojit k MQTT pomocí TLS (mqtts://). Povolte pro brokery vyžadující
        šifrovaná připojení (obvykle port 8883). Není potřeba pro standardní
        doplněk Mosquitto.
      uk: >-
        Підключення до MQTT через TLS (mqtts://). Увімкніть для брокерів, що
        вимагають шифрованих з'єднань (зазвичай порт 8883). Не потрібно для
        стандартного додатка Mosquitto.
