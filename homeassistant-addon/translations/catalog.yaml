        Путь к сертификату CA для проверки TLS-сертификата брокера. Обычно
        хранится в /ssl/ (например, /ssl/ca.crt). Необходим только для
        самоподписанных сертификатов.
      zh: >-
        用于验证代理 TLS 证书的 CA 证书路径。通常存储在 /ssl/（例如 /ssl/ca.crt）。仅自签名证书需要。
      ja: >-
        ブローカーの TLS 証明書を検証するための CA 証明書のパス。通常 /ssl/
        に保存されます（例：/ssl/ca.crt）。自己署名証明書の場合のみ 必要です。
      ko: >-
        브로커의 TLS 인증서를 검증하기 위한 CA 인증서 경로. 보통 /ssl/에 저장됩니다 (예: /ssl/ca.crt). 자체 서명
        인증서에만 필요합니다.
      pl: >-
        Ścieżka do certyfikatu CA do weryfikacji certyfikatu TLS brokera.
        Zazwyczaj przechowywany w /ssl/ (np. /ssl/ca.crt). Wymagany tylko dla
        certyfikatów samopodpisanych.
      sv: >-
        Sökväg till CA-certifikat för att verifiera brokerns TLS-certifikat.
        Lagras vanligtvis i /ssl/ (t.ex. /ssl/ca.crt). Behövs bara för
        självsignerade certifikat.
      no: >-
        Sti til CA-sertifikat for å verifisere brokerens TLS-sertifikat.
        Vanligvis lagret i /ssl/ (f.eks. /ssl/ca.crt). Bare nødvendig for
        selvsignerte sertifikater.
      da: >-
        Sti til CA-certifikat til at verificere brokerens TLS-certifikat.
        Normalt gemt i /ssl/ (f.eks. /ssl/ca.crt). Kun nødvendig for
        selvunderskrevne certifikater.
      cs: >-
        Cesta k CA certifikátu pro ověření TLS certifikátu brokera. Obvykle
        uložen v /ssl/ (např. /ssl/ca.crt). Potřebný pouze pro samopodepsané
        certifikáty.
      uk: >-
        Шлях до сертифіката CA для перевірки TLS-сертифіката брокера. Зазвичай
        зберігається в /ssl/ (наприклад, /ssl/ca.crt). Потрібен лише для
        самопідписаних сертифікатів.
  mqtt_reject_unauthorized:
    name:
      en: Verify MQTT TLS Certificate
      de: MQTT TLS-Zertifikat überprüfen
      es: Verificar certificado TLS de MQTT
      fr: Vérifier le certificat TLS MQTT
      it: Verifica certificato TLS MQTT
      nl: MQTT TLS-certificaat verifiëren
      pt: Verificar Certificado TLS MQTT
      ru: Проверка TLS-сертификата MQTT
      zh: 验证 MQTT TLS 证书
      ja: MQTT TLS 証明書を検証
      ko: MQTT TLS 인증서 검증
      pl: Weryfikuj certyfikat TLS MQTT
      sv: Verifiera MQTT TLS-certifikat
      no: Verifiser MQTT TLS-sertifikat
      da: Verificér MQTT TLS-certifikat
      cs: Ověřit TLS certifikát MQTT
      uk: Перевірка TLS-сертифіката MQTT
    description:
      en: >-
        Reject connections if the broker's TLS certificate cannot be verified.
        Keep enabled for security. Only disable for self-signed certificates
        without a CA file.
      de: >-
        Verbindungen ablehnen, wenn das TLS-Zertifikat des Brokers nicht
        verifiziert werden kann. Aus Sicherheitsgründen aktiviert lassen. Nur
        bei selbstsignierten Zertifikaten ohne CA-Datei deaktivieren.
      es: >-
        Rechazar conexiones si el certificado TLS del broker no puede ser
        verificado. Mantener habilitado por seguridad. Solo deshabilitar para
        certificados autofirmados sin archivo CA.
      fr: >-
        Rejeter les connexions si le certificat TLS du broker ne peut pas être
        vérifié. Garder activé pour la sécurité. Ne désactiver que pour les
        certificats auto-signés sans fichier CA.
      it: >-
        Rifiutare le connessioni se il certificato TLS del broker non può essere
        verificato. Mantenere abilitato per sicurezza. Disabilitare solo per
        certificati autofirmati senza file CA.
      nl: >-
        Verbindingen weigeren als het TLS-certificaat van de broker niet
        geverifieerd kan worden. Ingeschakeld houden voor beveiliging. Alleen
        uitschakelen voor zelfondertekende certificaten zonder CA-bestand.
      pt: >-
        Rejeitar ligações se o certificado TLS do broker não puder ser
        verificado. Manter ativado por segurança. Desativar apenas para
        certificados autoassinados sem ficheiro CA.
      ru: >-
        Отклонять подключения, если TLS-сертификат брокера не может быть
        проверен. Оставить включённым для безопасности. Отключать только для
        самоподписанных сертификатов без файла CA.
      zh: >-
        如果无法验证代理的 TLS 证书则拒绝连接。保持启用以确保安全。仅在 没有 CA 文件的自签名证书时禁用。
      ja: >-
        ブローカーの TLS 証明書を検証できない場合に接続を拒否します。 セキュリティのために有効のままにしてください。CA ファイルのない
        自己署名証明書の場合のみ無効にしてください。
      ko: >-
        브로커의 TLS 인증서를 검증할 수 없는 경우 연결을 거부합니다. 보안을 위해 활성화 상태를 유지하세요. CA 파일이 없는 자체
        서명 인증서에만 비활성화하세요.
      pl: >-
        Odrzucaj połączenia jeśli certyfikat TLS brokera nie może być
        zweryfikowany. Pozostaw włączone dla bezpieczeństwa. Wyłącz tylko dla
        certyfikatów samopodpisanych bez pliku CA.
      sv: >-
        Avvisa anslutningar om brokerns TLS-certifikat inte kan verifieras.
        Behåll aktiverat för säkerhet. Inaktivera bara för självsignerade
        certifikat utan CA-fil.
      no: >-
        Avvis tilkoblinger hvis brokerens TLS-sertifikat ikke kan verifiseres.
        Behold aktivert for sikkerhet. Deaktiver bare for selvsignerte
        sertifikater uten CA-fil.
      da: >-
        Afvis forbindelser hvis brokerens TLS-certifikat ikke kan verificeres.
        Behold aktiveret for sikkerhed. Deaktivér kun for selvunderskrevne
        certifikater uden CA-fil.
      cs: >-
        Odmítnout připojení pokud TLS certifikát brokera nelze ověřit. Ponechte
        povolené pro bezpečnost. Zakažte pouze pro samopodepsané certifikáty bez
        CA souboru.
      uk: >-
        Відхиляти підключення, якщо TLS-сертифікат брокера не може бути
        перевірений. Залишити увімкненим для безпеки. Вимикати лише для
        самопідписаних сертифікатів без файлу CA.
  auto_discover_networks:
    name:
      en: Auto-Discover C-Bus Networks
      de: C-Bus Netzwerke automatisch erkennen
      es: Auto-descubrir redes C-Bus
      fr: Auto-découvrir les réseaux C-Bus
      it: Auto-scopri reti C-Bus
      nl: C-Bus netwerken automatisch ontdekken
      pt: Auto-descobrir Redes C-Bus
      ru: Автоматическое обнаружение сетей C-Bus
      zh: 自动发现 C-Bus 网络
      ja: C-Bus ネットワークを自動検出
      ko: C-Bus 네트워크 자동 검색
      pl: Automatyczne odkrywanie sieci C-Bus
      sv: Auto-upptäck C-Bus nätverk
      no: Auto-oppdagelse av C-Bus nettverk
      da: Auto-opdagelse af C-Bus netværk
      cs: Automatické objevování sítí C-Bus
      uk: Автоматичне виявлення мереж C-Bus
    description:
      en: >-
        Automatically discover network IDs from C-Gate on connect. Discovered
        networks are used for polling and HA Discovery. Disable only if
        auto-discovery causes issues. Default: enabled.
      de: >-
        Netzwerk-IDs beim Verbinden automatisch von C-Gate erkennen. Erkannte
        Netzwerke werden für Abfragen und HA Discovery verwendet. Nur
        deaktivieren, wenn die automatische Erkennung Probleme verursacht.
        Standard: aktiviert.
      es: >-
        Descubrir automáticamente los IDs de red desde C-Gate al conectar. Las
        redes descubiertas se usan para sondeo y HA Discovery. Deshabilitar solo
        si el auto-descubrimiento causa problemas. Predeterminado: habilitado.
      fr: >-
        Découvrir automatiquement les IDs de réseau depuis C-Gate à la
        connexion. Les réseaux découverts sont utilisés pour le sondage et HA
        Discovery. Ne désactiver que si l'auto-découverte cause des problèmes.
        Par défaut : activé.
      it: >-
        Scoprire automaticamente gli ID di rete da C-Gate alla connessione. Le
        reti scoperte vengono usate per il polling e HA Discovery. Disabilitare
        solo se l'auto-scoperta causa problemi. Predefinito: abilitato.
      nl: >-
        Automatisch netwerk-ID's ontdekken van C-Gate bij verbinding. Ontdekte
        netwerken worden gebruikt voor polling en HA Discovery. Alleen
        uitschakelen als auto-ontdekking problemen veroorzaakt. Standaard:
        ingeschakeld.
      pt: >-
        Descobrir automaticamente os IDs de rede do C-Gate ao ligar. As redes
        descobertas são usadas para polling e HA Discovery. Desativar apenas se
        a auto-descoberta causar problemas. Predefinido: ativado.
      ru: >-
        Автоматически обнаруживать идентификаторы сетей от C-Gate при
        подключении. Обнаруженные сети используются для опроса и HA Discovery.
        Отключайте только если автообнаружение вызывает проблемы. По умолчанию:
        включено.
      zh: >-
        连接时自动从 C-Gate 发现网络 ID。发现的网络用于轮询和 HA Discovery。 仅在自动发现导致问题时禁用。默认：启用。
      ja: >-
        接続時に C-Gate からネットワーク ID を自動的に検出します。検出された ネットワークはポーリングと HA Discovery
        に使用されます。自動検出が 問題を起こす場合のみ無効にしてください。デフォルト：有効。
      ko: >-
        연결 시 C-Gate에서 네트워크 ID를 자동으로 검색합니다. 검색된 네트워크는 폴링 및 HA Discovery에 사용됩니다.
        자동 검색이 문제를 일으키는 경우에만 비활성화하세요. 기본값: 활성화.
      pl: >-
        Automatycznie odkrywaj identyfikatory sieci z C-Gate przy połączeniu.
        Odkryte sieci są używane do odpytywania i HA Discovery. Wyłącz tylko
        jeśli auto-odkrywanie powoduje problemy. Domyślnie: włączone.
      sv: >-
        Upptäck automatiskt nätverks-ID:n från C-Gate vid anslutning. Upptäckta
        nätverk används för polling och HA Discovery. Inaktivera bara om
        auto-upptäckt orsakar problem. Standard: aktiverat.
      no: >-
        Oppdag nettverks-IDer automatisk fra C-Gate ved tilkobling. Oppdagede
        nettverk brukes for polling og HA Discovery. Deaktiver bare hvis
        auto-oppdagelse forårsaker problemer. Standard: aktivert.
      da: >-
        Opdag automatisk netværks-ID'er fra C-Gate ved forbindelse. Opdagede
        netværk bruges til forespørgsel og HA Discovery. Deaktivér kun hvis
        auto-opdagelse forårsager problemer. Standard: aktiveret.
      cs: >-
        Automaticky objevovat ID sítí z C-Gate při připojení. Objevené sítě se
        používají pro dotazování a HA Discovery. Zakažte pouze pokud automatické
        objevování způsobuje problémy. Výchozí: povoleno.
      uk: >-
        Автоматично виявляти ідентифікатори мереж від C-Gate при підключенні.
        Виявлені мережі використовуються для опитування та HA Discovery.
        Вимикайте лише якщо автовиявлення спричиняє проблеми. За замовчуванням:
        увімкнено.
  getall_networks:
    name:
      en: C-Bus Networks to Monitor
      de: Zu überwachende C-Bus Netzwerke
      es: Redes C-Bus a monitorizar
      fr: Réseaux C-Bus à surveiller
      it: Reti C-Bus da monitorare
      nl: Te monitoren C-Bus netwerken
      pt: Redes C-Bus a Monitorizar
      ru: Сети C-Bus для мониторинга
      zh: 监控的 C-Bus 网络
      ja: 監視する C-Bus ネットワーク
      ko: 모니터링할 C-Bus 네트워크
      pl: Sieci C-Bus do monitorowania
      sv: C-Bus nätverk att övervaka
      no: C-Bus nettverk å overvåke
      da: C-Bus netværk at overvåge
      cs: Sítě C-Bus ke sledování
      uk: Мережі C-Bus для моніторингу
    description:
      en: >-
        C-Bus network IDs to poll for device states. Default: 254 (standard
        C-Bus network for most installations). Find your network IDs in C-Gate
        Toolkit under your project tree.
      de: >-
        C-Bus Netzwerk-IDs zum Abfragen von Gerätezuständen. Standard: 254
        (Standard-C-Bus-Netzwerk für die meisten Installationen). Finden Sie
        Ihre Netzwerk-IDs im C-Gate Toolkit unter Ihrem Projektbaum.
      es: >-
        IDs de red C-Bus para sondear estados de dispositivos. Predeterminado:
        254 (red C-Bus estándar para la mayoría de instalaciones). Encuentre sus
        IDs de red en C-Gate Toolkit bajo el árbol de su proyecto.
      fr: >-
        IDs de réseau C-Bus pour sonder les états des appareils. Par défaut :
        254 (réseau C-Bus standard pour la plupart des installations). Trouvez
        vos IDs de réseau dans C-Gate Toolkit sous l'arborescence de votre
        projet.
      it: >-
        ID di rete C-Bus per il polling degli stati dei dispositivi.
        Predefinito: 254 (rete C-Bus standard per la maggior parte delle
        installazioni). Trovare gli ID di rete in C-Gate Toolkit sotto l'albero
        del progetto.
      nl: >-
        C-Bus netwerk-ID's om apparaatstatussen op te vragen. Standaard: 254
        (standaard C-Bus netwerk voor de meeste installaties). Vind uw
        netwerk-ID's in C-Gate Toolkit onder uw projectboom.
      pt: >-
        IDs de rede C-Bus para consultar estados de dispositivos. Predefinido:
        254 (rede C-Bus padrão para a maioria das instalações). Encontre os seus
        IDs de rede no C-Gate Toolkit sob a árvore do projeto.
      ru: >-
        Идентификаторы сетей C-Bus для опроса состояний устройств. По умолчанию:
        254 (стандартная сеть C-Bus для большинства установок). Найдите
        идентификаторы сетей в C-Gate Toolkit в дереве проекта.
      zh: >-
        用于轮询设备状态的 C-Bus 网络 ID。默认：254（大多数安装的标准 C-Bus 网络）。在 C-Gate Toolkit
        的项目树中查找您的网络 ID。
      ja: >-
        デバイス状態をポーリングする C-Bus ネットワーク ID。デフォルト：254 （ほとんどの環境での標準 C-Bus
        ネットワーク）。C-Gate Toolkit の プロジェクトツリーでネットワーク ID を確認できます。
      ko: >-
        장치 상태를 폴링할 C-Bus 네트워크 ID. 기본값: 254 (대부분의 설치에서 표준 C-Bus 네트워크). C-Gate
        Toolkit의 프로젝트 트리에서 네트워크 ID를 찾으세요.
      pl: >-
        Identyfikatory sieci C-Bus do odpytywania stanów urządzeń. Domyślnie:
        254 (standardowa sieć C-Bus dla większości instalacji). Znajdź
        identyfikatory sieci w C-Gate Toolkit w drzewie projektu.
      sv: >-
        C-Bus nätverks-ID:n att hämta enhetsstatus för. Standard: 254 (standard
        C-Bus nätverk för de flesta installationer). Hitta dina nätverks-ID:n i
        C-Gate Toolkit under ditt projektträd.
      no: >-
        C-Bus nettverks-IDer å hente enhetsstatuser for. Standard: 254 (standard
        C-Bus nettverk for de fleste installasjoner). Finn dine nettverks-IDer i
        C-Gate Toolkit under prosjekttreet ditt.
      da: >-
        C-Bus netværks-ID'er til at forespørge enhedstilstande. Standard: 254
        (standard C-Bus netværk for de fleste installationer). Find dine
        netværks-ID'er i C-Gate Toolkit under dit projekttræ.
      cs: >-
        ID sítí C-Bus pro dotazování stavů zařízení. Výchozí: 254 (standardní
        síť C-Bus pro většinu instalací). Najděte ID sítí v C-Gate Toolkit ve
        stromu projektu.
      uk: >-
        Ідентифікатори мереж C-Bus для опитування станів пристроїв. За
        замовчуванням: 254 (стандартна мережа C-Bus для більшості інсталяцій).
        Знайдіть ідентифікатори мереж у C-Gate Toolkit у дереві проєкту.
  getall_on_start:
    name:
      en: Poll All Devices on Startup
      de: Alle Geräte beim Start abfragen
      es: Sondear todos los dispositivos al iniciar
      fr: Sonder tous les appareils au démarrage
      it: Interroga tutti i dispositivi all'avvio
      nl: Alle apparaten opvragen bij opstarten
      pt: Consultar Todos os Dispositivos ao Iniciar
      ru: Опрос всех устройств при запуске
      zh: 启动时轮询所有设备
      ja: 起動時にすべてのデバイスをポーリング
      ko: 시작 시 모든 장치 폴링
      pl: Odpytuj wszystkie urządzenia przy starcie
      sv: Hämta alla enheter vid start
      no: Hent alle enheter ved oppstart
      da: Forespørg alle enheder ved opstart
      cs: Dotazovat všechna zařízení při spuštění
      uk: Опитати всі пристрої при запуску
    description:
      en: >-
        Request all device states when the add-on starts, synchronizing Home
        Assistant with current C-Bus state. Default: enabled.
      de: >-
        Alle Gerätezustände beim Start des Add-ons abrufen, um Home Assistant
        mit dem aktuellen C-Bus Zustand zu synchronisieren. Standard: aktiviert.
      es: >-
        Solicitar todos los estados de dispositivos cuando el add-on inicia,
        sincronizando Home Assistant con el estado actual de C-Bus.
        Predeterminado: habilitado.
      fr: >-
        Demander tous les états des appareils au démarrage du module, en
        synchronisant Home Assistant avec l'état actuel de C-Bus. Par défaut :
        activé.
      it: >-
        Richiedere tutti gli stati dei dispositivi all'avvio del componente
        aggiuntivo, sincronizzando Home Assistant con lo stato attuale di C-Bus.
        Predefinito: abilitato.
      nl: >-
        Alle apparaatstatussen opvragen wanneer de add-on start, om Home
        Assistant te synchroniseren met de huidige C-Bus status. Standaard:
        ingeschakeld.
      pt: >-
        Solicitar todos os estados dos dispositivos quando o add-on inicia,
        sincronizando o Home Assistant com o estado atual do C-Bus. Predefinido:
        ativado.
      ru: >-
        Запрашивать состояния всех устройств при запуске дополнения,
        синхронизируя Home Assistant с текущим состоянием C-Bus. По умолчанию:
        включено.
      zh: >-
        附加组件启动时请求所有设备状态，将 Home Assistant 与当前 C-Bus 状态同步。默认：启用。
      ja: >-
        アドオン起動時にすべてのデバイス状態を要求し、Home Assistant を 現在の C-Bus 状態と同期します。デフォルト：有効。
      ko: >-
        애드온 시작 시 모든 장치 상태를 요청하여 Home Assistant를 현재 C-Bus 상태와 동기화합니다. 기본값: 활성화.
      pl: >-
        Pobierz stany wszystkich urządzeń przy uruchomieniu dodatku,
        synchronizując Home Assistant z aktualnym stanem C-Bus. Domyślnie:
        włączone.
      sv: >-
        Hämta alla enhetstillstånd när tillägget startar, för att synkronisera
        Home Assistant med aktuellt C-Bus tillstånd. Standard: aktiverat.
      no: >-
        Hent alle enhetstilstander når tillegget starter, for å synkronisere
        Home Assistant med gjeldende C-Bus tilstand. Standard: aktivert.
      da: >-
        Hent alle enhedstilstande når tilføjelsen starter, for at synkronisere
        Home Assistant med aktuel C-Bus tilstand. Standard: aktiveret.
      cs: >-
        Načíst všechny stavy zařízení při spuštění doplňku, synchronizovat Home
        Assistant s aktuálním stavem C-Bus. Výchozí: povoleno.
      uk: >-
        Запитувати стани всіх пристроїв при запуску додатка, синхронізуючи Home
        Assistant з поточним станом C-Bus. За замовчуванням: увімкнено.
  getall_period:
    name:
      en: Poll Interval (seconds)
      de: Abfrageintervall (Sekunden)
      es: Intervalo de sondeo (segundos)
      fr: Intervalle de sondage (secondes)
      it: Intervallo di interrogazione (secondi)
      nl: Opvraaginterval (seconden)
      pt: Intervalo de Consulta (segundos)
      ru: Интервал опроса (секунды)
      zh: 轮询间隔（秒）
      ja: ポーリング間隔（秒）
      ko: 폴링 간격 (초)
      pl: Interwał odpytywania (sekundy)
      sv: Hämtningsintervall (sekunder)
      no: Hentingsintervall (sekunder)
      da: Forespørgselsinterval (sekunder)
      cs: Interval dotazování (sekundy)
      uk: Інтервал опитування (секунди)
    description:
      en: >-
        How often to re-poll all device states. Lower values = fresher state but
        more C-Gate traffic. Default: 3600 (1 hour).
      de: >-
        Wie oft alle Gerätezustände erneut abgefragt werden. Niedrigere Werte =
        aktuellere Zustände, aber mehr C-Gate Verkehr. Standard: 3600 (1
        Stunde).
      es: >-
        Con qué frecuencia re-sondear todos los estados de dispositivos. Valores
        más bajos = estados más frescos pero más tráfico C-Gate. Predeterminado:
        3600 (1 hora).
      fr: >-
        Fréquence de re-sondage de tous les états des appareils. Valeurs plus
        basses = états plus récents mais plus de trafic C-Gate. Par défaut :
        3600 (1 heure).
      it: >-
        Con quale frequenza ri-interrogare tutti gli stati dei dispositivi.
        Valori più bassi = stati più aggiornati ma più traffico C-Gate.
        Predefinito: 3600 (1 ora).
      nl: >-
        Hoe vaak alle apparaatstatussen opnieuw worden opgevraagd. Lagere
        waarden = actuelere statussen maar meer C-Gate verkeer. Standaard: 3600
        (1 uur).
      pt: >-
        Com que frequência re-consultar todos os estados dos dispositivos.
        Valores mais baixos = estados mais atualizados mas mais tráfego C-Gate.
        Predefinido: 3600 (1 hora).
      ru: >-
        Как часто повторно опрашивать состояния всех устройств. Меньшие значения
        = более актуальные данные, но больше трафика к C-Gate. По умолчанию:
        3600 (1 час).
      zh: >-
        重新轮询所有设备状态的频率。较低的值 = 更新的状态但更多 C-Gate 流量。默认：3600（1 小时）。
      ja: >-
        すべてのデバイス状態を再ポーリングする頻度。低い値 = より新しい 状態ですが C-Gate トラフィックが増加します。デフォルト：3600
        （1 時間）。
      ko: >-
        모든 장치 상태를 다시 폴링하는 빈도. 낮은 값 = 더 최신 상태이지만 C-Gate 트래픽이 증가합니다. 기본값: 3600
        (1시간).
      pl: >-
        Jak często ponownie odpytywać stany wszystkich urządzeń. Niższe wartości
        = świeższy stan ale więcej ruchu C-Gate. Domyślnie: 3600 (1 godzina).
      sv: >-
        Hur ofta alla enhetstillstånd hämtas igen. Lägre värden = färskare
        tillstånd men mer C-Gate trafik. Standard: 3600 (1 timme).
      no: >-
        Hvor ofte alle enhetstilstander hentes på nytt. Lavere verdier =
        ferskere tilstand men mer C-Gate trafikk. Standard: 3600 (1 time).
      da: >-
        Hvor ofte alle enhedstilstande hentes igen. Lavere værdier = mere
        opdaterede tilstande men mere C-Gate trafik. Standard: 3600 (1 time).
      cs: >-
        Jak často znovu dotazovat stavy všech zařízení. Nižší hodnoty =
        aktuálnější stav ale více provozu C-Gate. Výchozí: 3600 (1 hodina).
      uk: >-
        Як часто повторно опитувати стани всіх пристроїв. Менші значення = більш
        актуальні дані, але більше трафіку C-Gate. За замовчуванням: 3600 (1
        година).
  getall_app_periods:
    name:
      en: Per-App Poll Intervals
      de: Abfrageintervalle pro Anwendung
      es: Intervalos de sondeo por aplicación
      fr: Intervalles de sondage par application
      it: Intervalli di interrogazione per applicazione
      nl: Opvraagintervallen per applicatie
      pt: Intervalos de Consulta por Aplicação
      ru: Интервалы опроса по приложениям
      zh: 按应用的轮询间隔
      ja: アプリごとのポーリング間隔
      ko: 앱별 폴링 간격
      pl: Interwały odpytywania per aplikacja
      sv: Hämtningsintervall per applikation
      no: Hentingsintervaller per applikasjon
      da: Forespørgselsintervaller per applikation
      cs: Intervaly dotazování dle aplikace
      uk: Інтервали опитування за застосунками
    description:
      en: >-
        Override the poll interval for specific C-Bus applications. Each entry
        has an app_id (e.g., "56" for Lighting) and period_sec (0 to disable).
      de: >-
        Das Abfrageintervall für bestimmte C-Bus Anwendungen überschreiben.
        Jeder Eintrag hat eine app_id (z.B. "56" für Beleuchtung) und period_sec
        (0 zum Deaktivieren).
      es: >-
        Anular el intervalo de sondeo para aplicaciones C-Bus específicas. Cada
        entrada tiene un app_id (por ejemplo, "56" para Iluminación) y
        period_sec (0 para deshabilitar).
      fr: >-
        Remplacer l'intervalle de sondage pour des applications C-Bus
        spécifiques. Chaque entrée a un app_id (par exemple, "56" pour
        l'Éclairage) et period_sec (0 pour désactiver).
      it: >-
        Sovrascrivere l'intervallo di interrogazione per applicazioni C-Bus
        specifiche. Ogni voce ha un app_id (ad esempio, "56" per Illuminazione)
        e period_sec (0 per disabilitare).
      nl: >-
        Het opvraaginterval overschrijven voor specifieke C-Bus applicaties.
        Elke vermelding heeft een app_id (bijv. "56" voor Verlichting) en
        period_sec (0 om uit te schakelen).
      pt: >-
        Substituir o intervalo de consulta para aplicações C-Bus específicas.
        Cada entrada tem um app_id (ex.: "56" para Iluminação) e period_sec (0
        para desativar).
      ru: >-
        Переопределить интервал опроса для конкретных приложений C-Bus. Каждая
        запись имеет app_id (например, "56" для Освещения) и period_sec (0 для
        отключения).
      zh: >-
        覆盖特定 C-Bus 应用的轮询间隔。每个条目有一个 app_id（例如 "56" 用于照明）和 period_sec（0 表示禁用）。
      ja: >-
        特定の C-Bus アプリケーションのポーリング間隔を上書きします。 各エントリには app_id（例："56" は Lighting）と
        period_sec（0 で 無効化）があります。
      ko: >-
        특정 C-Bus 애플리케이션의 폴링 간격을 재정의합니다. 각 항목에는 app_id (예: 조명의 경우 "56")와
        period_sec (비활성화의 경우 0)이 있습니다.
      pl: >-
        Nadpisz interwał odpytywania dla konkretnych aplikacji C-Bus. Każdy wpis
        ma app_id (np. "56" dla Oświetlenia) i period_sec (0 aby wyłączyć).
      sv: >-
        Åsidosätt hämtningsintervallet för specifika C-Bus applikationer. Varje
        post har ett app_id (t.ex. "56" för Belysning) och period_sec (0 för att
        inaktivera).
      no: >-
        Overstyr hentingsintervallet for spesifikke C-Bus applikasjoner. Hver
        oppføring har en app_id (f.eks. "56" for Belysning) og period_sec (0 for
        å deaktivere).
      da: >-
        Tilsidesæt forespørgselsintervallet for specifikke C-Bus applikationer.
        Hver post har en app_id (f.eks. "56" for Belysning) og period_sec (0 for
        at deaktivere).
      cs: >-
        Přepsat interval dotazování pro konkrétní aplikace C-Bus. Každý záznam
        má app_id (např. "56" pro Osvětlení) a period_sec (0 pro zakázání).
      uk: >-
        Перевизначити інтервал опитування для конкретних застосунків C-Bus.
        Кожен запис має app_id (наприклад, "56" для Освітлення) та period_sec (0
        для вимкнення).
  retain_reads:
    name:
      en: Retain MQTT State Messages
      de: MQTT Zustandsnachrichten beibehalten
      es: Retener mensajes de estado MQTT
      fr: Conserver les messages d'état MQTT
      it: Conserva messaggi di stato MQTT
      nl: MQTT Statusberichten bewaren
      pt: Reter Mensagens de Estado MQTT
      ru: Сохранять сообщения о состоянии MQTT
      zh: 保留 MQTT 状态消息
      ja: MQTT 状態メッセージを保持
      ko: MQTT 상태 메시지 보존
      pl: Zachowuj wiadomości stanu MQTT
      sv: Behåll MQTT statusmeddelanden
      no: Behold MQTT statusmeldinger
      da: Bevar MQTT statusbeskeder
      cs: Zachovat stavové zprávy MQTT
      uk: Зберігати повідомлення про стан MQTT
    description:
      en: >-
        Set the MQTT retain flag on state messages so new subscribers
        immediately receive last known device states. Default: disabled.
      de: >-
        Das MQTT Retain-Flag auf Zustandsnachrichten setzen, damit neue
        Abonnenten sofort den letzten bekannten Gerätezustand erhalten.
        Standard: deaktiviert.
      es: >-
        Establecer la bandera MQTT retain en mensajes de estado para que los
        nuevos suscriptores reciban inmediatamente los últimos estados
        conocidos. Predeterminado: deshabilitado.
      fr: >-
        Activer le drapeau MQTT retain sur les messages d'état pour que les
        nouveaux abonnés reçoivent immédiatement les derniers états connus. Par
        défaut : désactivé.
      it: >-
        Impostare il flag MQTT retain sui messaggi di stato per far ricevere ai
        nuovi sottoscrittori immediatamente gli ultimi stati noti. Predefinito:
        disabilitato.
      nl: >-
        De MQTT retain-vlag instellen op statusberichten zodat nieuwe abonnees
        direct de laatst bekende apparaatstatus ontvangen. Standaard:
        uitgeschakeld.
      pt: >-
        Definir a flag MQTT retain nas mensagens de estado para que novos
        subscritores recebam imediatamente os últimos estados conhecidos.
        Predefinido: desativado.
      ru: >-
        Устанавливать флаг MQTT retain на сообщениях о состоянии, чтобы новые
        подписчики сразу получали последние известные состояния. По умолчанию:
        отключено.
      zh: >-
        在状态消息上设置 MQTT 保留标志，以便新订阅者立即收到最后已知的 设备状态。默认：禁用。
      ja: >-
        状態メッセージに MQTT 保持フラグを設定し、新しいサブスクライバーが 最後の既知のデバイス状態をすぐに受信できるようにします。デフォルト：
        無効。
      ko: >-
        상태 메시지에 MQTT 보존 플래그를 설정하여 새 구독자가 즉시 마지막으로 알려진 장치 상태를 수신하도록 합니다. 기본값:
        비활성화.
      pl: >-
        Ustaw flagę MQTT retain na wiadomościach stanu, aby nowi subskrybenci
        natychmiast otrzymywali ostatni znany stan urządzeń. Domyślnie:
        wyłączone.
      sv: >-
        Sätt MQTT retain-flaggan på statusmeddelanden så nya prenumeranter
        omedelbart får senast kända enhetsstatus. Standard: inaktiverat.
      no: >-
        Sett MQTT retain-flagget på statusmeldinger slik at nye abonnenter
        umiddelbart mottar sist kjente enhetsstatuser. Standard: deaktivert.
      da: >-
        Sæt MQTT retain-flaget på statusbeskeder så nye abonnenter straks
        modtager sidst kendte enhedstilstande. Standard: deaktiveret.
      cs: >-
        Nastavit příznak MQTT retain na stavových zprávách aby noví odběratelé
        okamžitě obdrželi poslední známé stavy. Výchozí: zakázáno.
      uk: >-
        Встановлювати прапорець MQTT retain на повідомленнях про стан, щоб нові
        підписники одразу отримували останні відомі стани. За замовчуванням:
        вимкнено.
  message_interval:
    name:
      en: Command Interval (ms)
      de: Befehlsintervall (ms)
      es: Intervalo de comandos (ms)
      fr: Intervalle de commande (ms)
      it: Intervallo comandi (ms)
      nl: Commando-interval (ms)
      pt: Intervalo de Comandos (ms)
      ru: Интервал команд (мс)
      zh: 命令间隔（毫秒）
      ja: コマンド間隔（ミリ秒）
      ko: 명령 간격 (밀리초)
      pl: Interwał poleceń (ms)
      sv: Kommandointervall (ms)
      no: Kommandointervall (ms)
      da: Kommandointerval (ms)
      cs: Interval příkazů (ms)
      uk: Інтервал команд (мс)
    description:
      en: >-
        Minimum delay between commands sent to C-Gate. Prevents overwhelming
        C-Gate with rapid commands. Default: 200ms.
      de: >-
        Mindestverzögerung zwischen Befehlen an C-Gate. Verhindert eine
        Überlastung von C-Gate durch schnelle Befehle. Standard: 200ms.
      es: >-
        Retraso mínimo entre comandos enviados a C-Gate. Evita sobrecargar
        C-Gate con comandos rápidos. Predeterminado: 200ms.
      fr: >-
        Délai minimum entre les commandes envoyées à C-Gate. Empêche la
        surcharge de C-Gate par des commandes rapides. Par défaut : 200ms.
      it: >-
        Ritardo minimo tra i comandi inviati a C-Gate. Impedisce di
        sovraccaricare C-Gate con comandi rapidi. Predefinito: 200ms.
      nl: >-
        Minimale vertraging tussen commando's naar C-Gate. Voorkomt
        overbelasting van C-Gate met snelle commando's. Standaard: 200ms.
      pt: >-
        Atraso mínimo entre comandos enviados ao C-Gate. Evita sobrecarregar o
        C-Gate com comandos rápidos. Predefinido: 200ms.
      ru: >-
        Минимальная задержка между командами к C-Gate. Предотвращает перегрузку
        C-Gate быстрыми командами. По умолчанию: 200ms.
      zh: >-
        发送到 C-Gate 的命令之间的最小延迟。防止快速命令使 C-Gate 过载。 默认：200ms。
      ja: >-
        C-Gate に送信するコマンド間の最小遅延。高速なコマンドで C-Gate が 過負荷になるのを防ぎます。デフォルト：200ms。
      ko: >-
        C-Gate로 전송되는 명령 간의 최소 지연. 빠른 명령으로 C-Gate가 과부하되는 것을 방지합니다. 기본값: 200ms.
      pl: >-
        Minimalne opóźnienie między poleceniami wysyłanymi do C-Gate. Zapobiega
        przeciążeniu C-Gate szybkimi poleceniami. Domyślnie: 200ms.
      sv: >-
        Minsta fördröjning mellan kommandon till C-Gate. Förhindrar att C-Gate
        överbelastas med snabba kommandon. Standard: 200ms.
      no: >-
        Minimum forsinkelse mellom kommandoer til C-Gate. Forhindrer at C-Gate
        overbelastes med raske kommandoer. Standard: 200ms.
      da: >-
        Minimumsforsinkelse mellem kommandoer til C-Gate. Forhindrer
        overbelastning af C-Gate med hurtige kommandoer. Standard: 200ms.
      cs: >-
        Minimální prodleva mezi příkazy do C-Gate. Zabraňuje zahlcení C-Gate
        rychlými příkazy. Výchozí: 200ms.
      uk: >-
        Мінімальна затримка між командами до C-Gate. Запобігає перевантаженню
        C-Gate швидкими командами. За замовчуванням: 200ms.
  ha_discovery_prefix:
    name:
