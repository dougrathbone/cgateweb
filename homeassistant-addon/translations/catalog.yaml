  cgate_install_source:
    name:
      en: C-Gate Install Source
      de: C-Gate Installationsquelle
      es: Fuente de instalación de C-Gate
      fr: Source d'installation de C-Gate
      it: Fonte di installazione C-Gate
      nl: C-Gate Installatiebron
      pt: Origem de Instalação do C-Gate
      ru: Источник установки C-Gate
      zh: C-Gate 安装来源
      ja: C-Gate インストールソース
      ko: C-Gate 설치 소스
      pl: Źródło instalacji C-Gate
      sv: C-Gate installationskälla
      no: C-Gate installasjonskilde
      da: C-Gate installationskilde
      cs: Zdroj instalace C-Gate
      uk: Джерело встановлення C-Gate
    description:
      en: >-
        Only used in managed mode. "download" fetches C-Gate automatically.
        "upload" looks for a zip file you place in /share/cgate/.
      de: >-
        Nur im Managed-Modus verwendet. "download" lädt C-Gate automatisch
        herunter. "upload" sucht nach einer ZIP-Datei, die Sie in /share/cgate/
        ablegen.
      es: >-
        Solo se usa en modo gestionado. "download" descarga C-Gate
        automáticamente. "upload" busca un archivo zip que usted coloque en
        /share/cgate/.
      fr: >-
        Utilisé uniquement en mode géré. "download" télécharge C-Gate
        automatiquement. "upload" recherche un fichier zip que vous placez dans
        /share/cgate/.
      it: >-
        Utilizzato solo in modalità gestita. "download" scarica C-Gate
        automaticamente. "upload" cerca un file zip posizionato in
        /share/cgate/.
      nl: >-
        Alleen gebruikt in beheerde modus. "download" haalt C-Gate automatisch
        op. "upload" zoekt naar een zipbestand dat u in /share/cgate/ plaatst.
      pt: >-
        Usado apenas no modo gerenciado. "download" transfere o C-Gate
        automaticamente. "upload" procura um ficheiro zip que colocou em
        /share/cgate/.
      ru: >-
        Используется только в управляемом режиме. "download" загружает C-Gate
        автоматически. "upload" ищет zip-файл, который вы разместили в
        /share/cgate/.
      zh: >-
        仅在托管模式下使用。"download" 自动下载 C-Gate。"upload" 查找您 放置在 /share/cgate/ 中的 zip
        文件。
      ja: >-
        マネージドモードでのみ使用されます。"download" は C-Gate を自動的に ダウンロードします。"upload" は
        /share/cgate/ に配置した zip ファイル を使用します。
      ko: >-
        관리 모드에서만 사용됩니다. "download"는 C-Gate를 자동으로 다운로드합니다. "upload"는
        /share/cgate/에 배치한 zip 파일을 사용합니다.
      pl: >-
        Używane tylko w trybie zarządzanym. "download" pobiera C-Gate
        automatycznie. "upload" szuka pliku zip umieszczonego w /share/cgate/.
      sv: >-
        Används bara i hanterat läge. "download" hämtar C-Gate automatiskt.
        "upload" letar efter en zip-fil som du placerat i /share/cgate/.
      no: >-
        Brukes bare i administrert modus. "download" henter C-Gate automatisk.
        "upload" ser etter en zip-fil du har plassert i /share/cgate/.
      da: >-
        Bruges kun i administreret tilstand. "download" henter C-Gate
        automatisk. "upload" leder efter en zip-fil du har placeret i
        /share/cgate/.
      cs: >-
        Používá se pouze ve spravovaném režimu. "download" stáhne C-Gate
        automaticky. "upload" hledá zip soubor, který jste umístili do
        /share/cgate/.
      uk: >-
        Використовується лише в керованому режимі. "download" завантажує C-Gate
        автоматично. "upload" шукає zip-файл, який ви розмістили в
        /share/cgate/.
  cgate_download_url:
    name:
      en: C-Gate Download URL
      de: C-Gate Download URL
      es: URL de descarga de C-Gate
      fr: URL de téléchargement de C-Gate
      it: URL di download di C-Gate
      nl: C-Gate Download URL
      pt: URL de Transferência do C-Gate
      ru: URL загрузки C-Gate
      zh: C-Gate 下载 URL
      ja: C-Gate ダウンロード URL
      ko: C-Gate 다운로드 URL
      pl: URL pobierania C-Gate
      sv: C-Gate nedladdnings-URL
      no: C-Gate nedlastings-URL
      da: C-Gate download URL
      cs: URL pro stažení C-Gate
      uk: URL завантаження C-Gate
    description:
      en: >-
        Only used in managed mode with download source. Override if the official
        Clipsal download URL changes. Leave empty for the default URL.
      de: >-
        Nur im Managed-Modus mit Download-Quelle verwendet. Überschreiben, wenn
        sich die offizielle Clipsal-Download-URL ändert. Leer lassen für die
        Standard-URL.
      es: >-
        Solo se usa en modo gestionado con fuente de descarga. Cambie si la URL
        oficial de descarga de Clipsal cambia. Dejar vacío para la URL
        predeterminada.
      fr: >-
        Utilisé uniquement en mode géré avec source de téléchargement. Modifiez
        si l'URL officielle de téléchargement Clipsal change. Laisser vide pour
        l'URL par défaut.
      it: >-
        Utilizzato solo in modalità gestita con fonte di download. Modificare se
        l'URL ufficiale di download Clipsal cambia. Lasciare vuoto per l'URL
        predefinito.
      nl: >-
        Alleen gebruikt in beheerde modus met downloadbron. Overschrijf als de
        officiële Clipsal download-URL wijzigt. Laat leeg voor de standaard-URL.
      pt: >-
        Usado apenas no modo gerenciado com origem de download. Substitua se o
        URL oficial de download da Clipsal mudar. Deixe vazio para o URL
        predefinido.
      ru: >-
        Используется только в управляемом режиме с источником загрузки.
        Переопределите, если официальный URL загрузки Clipsal изменится.
        Оставьте пустым для URL по умолчанию.
      zh: >-
        仅在使用下载来源的托管模式下使用。如果官方 Clipsal 下载 URL 更改， 则进行覆盖。留空使用默认 URL。
      ja: >-
        ダウンロードソースのマネージドモードでのみ使用されます。公式 Clipsal ダウンロード URL が変更された場合に上書きします。デフォルト
        URL を 使用するには空のままにしてください。
      ko: >-
        다운로드 소스의 관리 모드에서만 사용됩니다. 공식 Clipsal 다운로드 URL이 변경된 경우 재정의하세요. 기본 URL을
        사용하려면 비워 두세요.
      pl: >-
        Używane tylko w trybie zarządzanym ze źródłem pobierania. Nadpisz jeśli
        oficjalny URL pobierania Clipsal się zmieni. Pozostaw puste dla
        domyślnego URL.
      sv: >-
        Används bara i hanterat läge med nedladdningskälla. Åsidosätt om den
        officiella Clipsal nedladdnings-URL:en ändras. Lämna tomt för
        standard-URL:en.
      no: >-
        Brukes bare i administrert modus med nedlastingskilde. Overstyr hvis den
        offisielle Clipsal nedlastings-URL-en endres. La stå tomt for
        standard-URL-en.
      da: >-
        Bruges kun i administreret tilstand med downloadkilde. Tilsidesæt hvis
        den officielle Clipsal download-URL ændres. Lad stå tomt for
        standard-URL'en.
      cs: >-
        Používá se pouze ve spravovaném režimu se zdrojem stažení. Přepište
        pokud se změní oficiální URL stahování Clipsal. Ponechte prázdné pro
        výchozí URL.
      uk: >-
        Використовується лише в керованому режимі з джерелом завантаження.
        Перевизначте, якщо офіційний URL завантаження Clipsal зміниться. Залиште
        порожнім для URL за замовчуванням.
  cgate_download_sha256:
    name:
      en: C-Gate Download SHA256
      de: C-Gate Download SHA256
      es: SHA256 de descarga de C-Gate
      fr: SHA256 du téléchargement C-Gate
      it: SHA256 del download C-Gate
      nl: C-Gate Download SHA256
      pt: SHA256 de Transferência do C-Gate
      ru: SHA256 загрузки C-Gate
      zh: C-Gate 下载 SHA256
      ja: C-Gate ダウンロード SHA256
      ko: C-Gate 다운로드 SHA256
      pl: SHA256 pobierania C-Gate
      sv: C-Gate nedladdning SHA256
      no: C-Gate nedlasting SHA256
      da: C-Gate download SHA256
      cs: SHA256 stažení C-Gate
      uk: SHA256 завантаження C-Gate
    description:
      en: >-
        Optional SHA256 checksum to verify the C-Gate download. Recommended when
        using a custom download URL.
      de: >-
        Optionale SHA256-Prüfsumme zur Verifizierung des C-Gate Downloads.
        Empfohlen bei Verwendung einer benutzerdefinierten Download-URL.
      es: >-
        Suma de verificación SHA256 opcional para verificar la descarga de
        C-Gate. Recomendado cuando se usa una URL de descarga personalizada.
      fr: >-
        Somme de contrôle SHA256 optionnelle pour vérifier le téléchargement de
        C-Gate. Recommandé lors de l'utilisation d'une URL de téléchargement
        personnalisée.
      it: >-
        Checksum SHA256 opzionale per verificare il download di C-Gate.
        Raccomandato quando si usa un URL di download personalizzato.
      nl: >-
        Optionele SHA256-checksum om de C-Gate download te verifiëren.
        Aanbevolen bij gebruik van een aangepaste download-URL.
      pt: >-
        Checksum SHA256 opcional para verificar a transferência do C-Gate.
        Recomendado ao usar um URL de transferência personalizado.
      ru: >-
        Необязательная контрольная сумма SHA256 для проверки загрузки C-Gate.
        Рекомендуется при использовании пользовательского URL загрузки.
      zh: >-
        可选的 SHA256 校验和，用于验证 C-Gate 下载。使用自定义下载 URL 时 建议使用。
      ja: >-
        C-Gate ダウンロードを検証するためのオプションの SHA256 チェックサム。 カスタムダウンロード URL を使用する場合に推奨されます。
      ko: >-
        C-Gate 다운로드를 검증하기 위한 선택적 SHA256 체크섬. 사용자 지정 다운로드 URL을 사용할 때 권장됩니다.
      pl: >-
        Opcjonalna suma kontrolna SHA256 do weryfikacji pobrania C-Gate.
        Zalecana przy użyciu niestandardowego URL pobierania.
      sv: >-
        Valfri SHA256-kontrollsumma för att verifiera C-Gate nedladdningen.
        Rekommenderas vid användning av en anpassad nedladdnings-URL.
      no: >-
        Valgfri SHA256-sjekksum for å verifisere C-Gate nedlastingen. Anbefalt
        ved bruk av en egendefinert nedlastings-URL.
      da: >-
        Valgfri SHA256-kontrolsum til at verificere C-Gate downloaden. Anbefales
        ved brug af en brugerdefineret download-URL.
      cs: >-
        Volitelný kontrolní součet SHA256 pro ověření stažení C-Gate. Doporučeno
        při použití vlastní URL pro stažení.
      uk: >-
        Необов'язкова контрольна сума SHA256 для перевірки завантаження C-Gate.
        Рекомендується при використанні власного URL завантаження.
  cgate_force_reinstall:
    name:
      en: Force C-Gate Reinstall
      de: C-Gate Neuinstallation erzwingen
      es: Forzar reinstalación de C-Gate
      fr: Forcer la réinstallation de C-Gate
      it: Forza reinstallazione di C-Gate
      nl: C-Gate herinstallatie forceren
      pt: Forçar reinstalação do C-Gate
      ru: Принудительная переустановка C-Gate
      zh: 强制重新安装 C-Gate
      ja: C-Gate の再インストールを強制
      ko: C-Gate 강제 재설치
      pl: Wymuś ponowną instalację C-Gate
      sv: Tvinga ominstallation av C-Gate
      no: Tving reinstallasjon av C-Gate
      da: Gennemtving geninstallation af C-Gate
      cs: Vynutit přeinstalaci C-Gate
      uk: Примусове перевстановлення C-Gate
    description:
      en: >-
        Only used in managed mode. Once C-Gate is installed it is normally kept
        as is. Turn this on to reinstall/upgrade C-Gate from the install source
        on the next start (your project DBs and config are preserved). In upload
        mode you can instead just drop a newer zip into /share/cgate and it
        upgrades automatically. Turn this back off after the upgrade.
      de: >-
        Nur im Managed-Modus. Einmal installiert, bleibt C-Gate normalerweise
        unverändert. Aktivieren Sie dies, um C-Gate beim nächsten Start aus der
        Installationsquelle neu zu installieren bzw. zu aktualisieren (Ihre
        Projekt-Datenbanken und Konfiguration bleiben erhalten); im Upload-Modus
        können Sie stattdessen eine neuere zip in /share/cgate ablegen. Schalten
        Sie dies nach dem Upgrade wieder aus.
      es: >-
        Solo se usa en modo gestionado. Una vez instalado, C-Gate normalmente se
        mantiene tal cual. Actívelo para reinstalar/actualizar C-Gate desde la
        fuente de instalación en el próximo inicio (sus bases de datos de
        proyecto y la configuración se conservan); en modo de carga puede
        colocar un zip más reciente en /share/cgate. Desactívelo después de la
        actualización.
      fr: >-
        Utilisé uniquement en mode géré. Une fois installé, C-Gate est
        normalement conservé tel quel. Activez cette option pour
        réinstaller/mettre à jour C-Gate depuis la source d'installation au
        prochain démarrage (vos bases de données de projet et la configuration
        sont conservées) ; en mode upload, vous pouvez aussi déposer un zip plus
        récent dans /share/cgate. Désactivez-la après la mise à jour.
      it: >-
        Usato solo in modalità gestita. Una volta installato, C-Gate viene
        normalmente mantenuto invariato. Attiva questa opzione per
        reinstallare/aggiornare C-Gate dalla sorgente di installazione al
        prossimo avvio (i database del progetto e la configurazione vengono
        conservati); in modalità upload puoi invece inserire uno zip più recente
        in /share/cgate. Disattivala dopo l'aggiornamento.
      nl: >-
        Alleen gebruikt in managed-modus. Eenmaal geïnstalleerd blijft C-Gate
        normaal gesproken ongewijzigd. Schakel dit in om C-Gate bij de volgende
        start opnieuw te installeren/bij te werken vanaf de installatiebron (uw
        projectdatabases en configuratie blijven behouden); in upload-modus kunt
        u in plaats daarvan een nieuwere zip in /share/cgate plaatsen. Schakel
        dit na de upgrade weer uit.
      pt: >-
        Usado apenas no modo gerido. Depois de instalado, o C-Gate normalmente é
        mantido como está. Ative isto para reinstalar/atualizar o C-Gate a
        partir da fonte de instalação no próximo arranque (as suas bases de
        dados de projeto e a configuração são preservadas); no modo de
        carregamento pode antes colocar um zip mais recente em /share/cgate.
        Desative isto após a atualização.
      ru: >-
        Используется только в управляемом режиме. После установки C-Gate обычно
        остаётся без изменений. Включите этот параметр, чтобы
        переустановить/обновить C-Gate из источника установки при следующем
        запуске (ваши базы данных проекта и конфигурация сохраняются); в режиме
        загрузки можно вместо этого поместить более новый zip в /share/cgate.
        Выключите его после обновления.
      zh: >-
        仅在托管模式下使用。C-Gate 安装后通常保持不变。启用此选项可在下次启动时从安装源重新安装/升级
        C-Gate（您的项目数据库和配置会被保留）；在上传模式下，您也可以将较新的 zip 放入 /share/cgate。升级完成后请将其关闭。
      ja: >-
        マネージドモードでのみ使用されます。一度インストールすると、C-Gate
        は通常そのまま維持されます。これを有効にすると、次回起動時にインストールソースから C-Gate
        を再インストール／アップグレードします（プロジェクトのデータベースと設定は保持されます）。アップロードモードでは、代わりに新しい zip を
        /share/cgate に置くこともできます。アップグレード後はオフに戻してください。
      ko: >-
        관리 모드에서만 사용됩니다. C-Gate는 설치된 후 일반적으로 그대로 유지됩니다. 이 옵션을 켜면 다음 시작 시 설치 소스에서
        C-Gate를 다시 설치/업그레이드합니다(프로젝트 데이터베이스와 구성은 유지됩니다). 업로드 모드에서는 대신 최신 zip을
        /share/cgate에 넣을 수 있습니다. 업그레이드 후에는 다시 꺼 주세요.
      pl: >-
        Używane tylko w trybie zarządzanym. Po zainstalowaniu C-Gate zwykle
        pozostaje bez zmian. Włącz tę opcję, aby przy następnym uruchomieniu
        ponownie zainstalować/zaktualizować C-Gate ze źródła instalacji (bazy
        danych projektu i konfiguracja zostają zachowane); w trybie przesyłania
        możesz zamiast tego umieścić nowszy zip w /share/cgate. Wyłącz ją po
        aktualizacji.
      sv: >-
        Används endast i hanterat läge. När C-Gate väl är installerat behålls
        det normalt som det är. Aktivera detta för att installera om/uppgradera
        C-Gate från installationskällan vid nästa start (dina projektdatabaser
        och konfiguration bevaras); i uppladdningsläge kan du i stället lägga en
        nyare zip i /share/cgate. Stäng av detta efter uppgraderingen.
      no: >-
        Brukes bare i administrert modus. Når C-Gate er installert, beholdes det
        vanligvis som det er. Slå på dette for å installere/oppgradere C-Gate på
        nytt fra installasjonskilden ved neste oppstart (prosjektdatabasene og
        konfigurasjonen beholdes); i opplastingsmodus kan du i stedet legge en
        nyere zip i /share/cgate. Slå det av igjen etter oppgraderingen.
      da: >-
        Bruges kun i administreret tilstand. Når C-Gate først er installeret,
        bevares det normalt, som det er. Slå dette til for at
        geninstallere/opgradere C-Gate fra installationskilden ved næste start
        (dine projektdatabaser og konfiguration bevares); i upload-tilstand kan
        du i stedet lægge en nyere zip i /share/cgate. Slå det fra igen efter
        opgraderingen.
      cs: >-
        Používá se pouze ve spravovaném režimu. Po instalaci zůstává C-Gate
        obvykle beze změny. Tuto možnost zapněte, chcete-li při příštím spuštění
        přeinstalovat/aktualizovat C-Gate ze zdroje instalace (databáze projektu
        a konfigurace zůstanou zachovány); v režimu nahrávání můžete místo toho
        umístit novější zip do /share/cgate. Po aktualizaci ji opět vypněte.
      uk: >-
        Використовується лише в керованому режимі. Після встановлення C-Gate
        зазвичай залишається без змін. Увімкніть цей параметр, щоб під час
        наступного запуску перевстановити/оновити C-Gate із джерела встановлення
        (бази даних проєкту та конфігурація зберігаються); у режимі завантаження
        можна натомість покласти новіший zip у /share/cgate. Вимкніть його після
        оновлення.
  cgate_serial_device:
    name:
      en: Serial PCI Device (Beta)
      de: Serielles PCI-Gerät (Beta)
      es: Dispositivo PCI serie (beta)
      fr: Périphérique PCI série (bêta)
      it: Dispositivo PCI seriale (beta)
      nl: Serieel PCI-apparaat (beta)
      pt: Dispositivo PCI série (beta)
      ru: Последовательное PCI-устройство (бета)
      zh: 串口 PCI 设备（Beta）
      ja: シリアル PCI デバイス（ベータ）
      ko: 시리얼 PCI 장치(베타)
      pl: Urządzenie PCI szeregowe (beta)
      sv: Seriell PCI-enhet (beta)
      no: Seriell PCI-enhet (beta)
      da: Seriel PCI-enhed (beta)
      cs: Sériové PCI zařízení (beta)
      uk: Послідовний PCI-пристрій (бета)
    description:
      en: >-
        BETA: USB-serial PC Interface (5500PC/5500PCU) support — field-tested
        with both interfaces. Select a detected serial device from the dropdown;
        prefer /dev/serial/by-id/ paths. To enter a custom path, switch the
        config editor to YAML mode. Requires managed mode and a C-Bus Toolkit
        project configured for a serial PC Interface. Report issues on GitHub
        (issue #28).
      de: >-
        BETA: Unterstützung für USB-serielle PC-Schnittstellen (5500PC/5500PCU)
        — mit beiden Schnittstellen getestet. Wählen Sie ein erkanntes serielles
        Gerät aus der Dropdown-Liste; Pfade unter /dev/serial/by-id/ bevorzugen.
        Um einen benutzerdefinierten Pfad einzugeben, wechseln Sie den
        Konfigurationseditor in den YAML-Modus. Erfordert den Managed-Modus und
        ein C-Bus-Toolkit-Projekt mit konfigurierter serieller PC-Schnittstelle.
        Probleme bitte auf GitHub melden (Issue #28).
      es: >-
        BETA: soporte para interfaces PC USB-serie (5500PC/5500PCU) — probado
        con ambas interfaces. Seleccione un dispositivo serie detectado en la
        lista desplegable; prefiera las rutas /dev/serial/by-id/. Para
        introducir una ruta personalizada, cambie el editor de configuración al
        modo YAML. Requiere el modo gestionado y un proyecto de C-Bus Toolkit
        configurado para una interfaz PC serie. Informe los problemas en GitHub
        (issue #28).
      fr: >-
        BETA : prise en charge des interfaces PC USB-série (5500PC/5500PCU) —
        testée avec les deux interfaces. Sélectionnez un périphérique série
        détecté dans la liste déroulante ; préférez les chemins
        /dev/serial/by-id/. Pour saisir un chemin personnalisé, basculez
        l'éditeur de configuration en mode YAML. Nécessite le mode géré et un
        projet C-Bus Toolkit configuré pour une interface PC série. Signalez les
        problèmes sur GitHub (issue #28).
      it: >-
        BETA: supporto per interfacce PC USB-seriali (5500PC/5500PCU) — testato
        con entrambe le interfacce. Seleziona un dispositivo seriale rilevato
        dal menu a discesa; preferire i percorsi /dev/serial/by-id/. Per
        inserire un percorso personalizzato, passa l'editor di configurazione
        alla modalità YAML. Richiede la modalità gestita e un progetto C-Bus
        Toolkit configurato per un'interfaccia PC seriale. Segnala i problemi su
        GitHub (issue #28).
      nl: >-
        BETA: ondersteuning voor USB-seriële pc-interfaces (5500PC/5500PCU) —
        getest met beide interfaces. Selecteer een gedetecteerd serieel apparaat
        in de vervolgkeuzelijst; gebruik bij voorkeur paden onder
        /dev/serial/by-id/. Om een aangepast pad in te voeren, schakelt u de
        configuratie-editor over naar de YAML-modus. Vereist de managed-modus en
        een C-Bus Toolkit-project dat is geconfigureerd voor een seriële
        pc-interface. Meld problemen op GitHub (issue #28).
      pt: >-
        BETA: suporte a interfaces PC USB-série (5500PC/5500PCU) — testado com
        ambas as interfaces. Selecione um dispositivo série detetado na lista
        pendente; prefira caminhos /dev/serial/by-id/. Para introduzir um
        caminho personalizado, mude o editor de configuração para o modo YAML.
        Requer o modo gerido e um projeto C-Bus Toolkit configurado para uma
        interface PC série. Reporte problemas no GitHub (issue #28).
      ru: >-
        BETA: поддержка USB-последовательных PC-интерфейсов (5500PC/5500PCU) —
        проверена с обоими интерфейсами. Выберите обнаруженное последовательное
        устройство из выпадающего списка; предпочтительны пути
        /dev/serial/by-id/. Чтобы ввести свой путь, переключите редактор
        конфигурации в режим YAML. Требуется управляемый режим и проект C-Bus
        Toolkit, настроенный для последовательного PC-интерфейса. О проблемах
        сообщайте на GitHub (issue #28).
      zh: >-
        BETA: USB 串口 PC 接口（5500PC/5500PCU）支持——已在两种接口上实测。从下拉列表中选择检测到的串口设备；建议使用
        /dev/serial/by-id/ 路径。如需输入自定义路径，请将配置编辑器切换为 YAML 模式。需要托管模式，并且 C-Bus
        Toolkit 项目需配置为串口 PC 接口。请在 GitHub 上报告问题（issue #28）。
      ja: >-
        BETA: USB シリアル PC インターフェース（5500PC/5500PCU）サポート —
        両インターフェースで動作確認済み。検出されたシリアルデバイスをドロップダウンから選択してください（/dev/serial/by-id/
        以下のパスを推奨）。カスタムパスを入力するには、設定エディターを YAML モードに切り替えてください。マネージドモードと、シリアル PC
        インターフェース用に設定された C-Bus Toolkit プロジェクトが必要です。問題は GitHub で報告してください（issue
        #28）。
      ko: >-
        BETA: USB 시리얼 PC 인터페이스(5500PC/5500PCU) 지원 — 두 인터페이스 모두 테스트됨. 드롭다운에서 감지된
        시리얼 장치를 선택하세요(/dev/serial/by-id/ 경로 권장). 사용자 지정 경로를 입력하려면 구성 편집기를 YAML
        모드로 전환하세요. 관리 모드와 시리얼 PC 인터페이스로 구성된 C-Bus Toolkit 프로젝트가 필요합니다. 문제는
        GitHub에 보고해 주세요(이슈 #28).
      pl: >-
        BETA: obsługa interfejsów PC USB-szeregowych (5500PC/5500PCU) —
        przetestowana z oboma interfejsami. Wybierz wykryte urządzenie szeregowe
        z listy rozwijanej; preferuj ścieżki /dev/serial/by-id/. Aby wpisać
        własną ścieżkę, przełącz edytor konfiguracji w tryb YAML. Wymaga trybu
        zarządzanego i projektu C-Bus Toolkit skonfigurowanego dla szeregowego
        interfejsu PC. Problemy zgłaszaj na GitHubie (zgłoszenie #28).
      sv: >-
        BETA: stöd för USB-seriella PC-gränssnitt (5500PC/5500PCU) — testat med
        båda gränssnitten. Välj en upptäckt seriell enhet i rullgardinsmenyn;
        föredra sökvägar under /dev/serial/by-id/. För att ange en anpassad
        sökväg, växla konfigurationsredigeraren till YAML-läge. Kräver hanterat
        läge och ett C-Bus Toolkit-projekt konfigurerat för ett seriellt
        PC-gränssnitt. Rapportera problem på GitHub (ärende #28).
      no: >-
        BETA: støtte for USB-serielle PC-grensesnitt (5500PC/5500PCU) — testet
        med begge grensesnittene. Velg en oppdaget seriell enhet fra
        rullegardinlisten; foretrekk baner under /dev/serial/by-id/. For å angi
        en egendefinert bane, bytt konfigurasjonsredigereren til YAML-modus.
        Krever administrert modus og et C-Bus Toolkit-prosjekt konfigurert for
        et serielt PC-grensesnitt. Rapporter problemer på GitHub (sak #28).
      da: >-
        BETA: understøttelse af USB-serielle PC-interfaces (5500PC/5500PCU) —
        testet med begge interfaces. Vælg en registreret seriel enhed i
        rullemenuen; foretræk stier under /dev/serial/by-id/. For at angive en
        brugerdefineret sti skifter du konfigurationseditoren til YAML-tilstand.
        Kræver administreret tilstand og et C-Bus Toolkit-projekt konfigureret
        til et serielt PC-interface. Rapportér problemer på GitHub (issue #28).
      cs: >-
        BETA: podpora USB-sériových PC rozhraní (5500PC/5500PCU) — otestováno s
        oběma rozhraními. Vyberte detekované sériové zařízení z rozbalovací
        nabídky; preferujte cesty /dev/serial/by-id/. Chcete-li zadat vlastní
        cestu, přepněte editor konfigurace do režimu YAML. Vyžaduje spravovaný
        režim a projekt C-Bus Toolkit nakonfigurovaný pro sériové PC rozhraní.
        Problémy hlaste na GitHubu (issue #28).
      uk: >-
        BETA: підтримка USB-послідовних PC-інтерфейсів (5500PC/5500PCU) —
        перевірено з обома інтерфейсами. Виберіть виявлений послідовний пристрій
        зі спадного списку; бажано використовувати шляхи /dev/serial/by-id/. Щоб
        ввести власний шлях, перемкніть редактор конфігурації в режим YAML.
        Потрібен керований режим і проєкт C-Bus Toolkit, налаштований для
        послідовного PC-інтерфейсу. Про проблеми повідомляйте на GitHub (issue
        #28).
  cgate_external_clients:
    name:
      en: External C-Gate clients
      de: Externe C-Gate-Clients
      es: Clientes externos de C-Gate
      fr: Clients C-Gate externes
      it: Client C-Gate esterni
      nl: Externe C-Gate-clients
      pt: Clientes C-Gate externos
      ru: Внешние клиенты C-Gate
      zh: 外部 C-Gate 客户端
      ja: 外部 C-Gate クライアント
      ko: 외부 C-Gate 클라이언트
      pl: Zewnętrzni klienci C-Gate
      sv: Externa C-Gate-klienter
      no: Eksterne C-Gate-klienter
      da: Eksterne C-Gate-klienter
      cs: Externí klienti C-Gate
      uk: Зовнішні клієнти C-Gate
    description:
      en: >-
        Addresses allowed to connect to the managed C-Gate, for tools such as
        C-Bus Toolkit. Leave empty to allow only this add-on. C-Gate has no
        authentication, and program level allows reprogramming C-Bus units, so
        list specific addresses rather than a whole subnet. An octet of 255
        matches any value, so 192.168.1.255 means the entire 192.168.1.x
        network. You must also publish C-Gate's ports in the Network panel.
      de: >-
        Adressen, die eine Verbindung zum verwalteten C-Gate herstellen dürfen,
        für Werkzeuge wie C-Bus Toolkit. Leer lassen, um nur dieses Add-on
        zuzulassen. C-Gate hat keine Authentifizierung, und die
        Berechtigungsstufe program erlaubt das Neuprogrammieren von
        C-Bus-Geräten, also geben Sie konkrete Adressen an statt eines ganzen
        Subnetzes. Ein Oktett mit dem Wert 255 entspricht jedem Wert, sodass
        192.168.1.255 das gesamte Netzwerk 192.168.1.x bedeutet. Sie müssen
        außerdem die Ports von C-Gate im Netzwerk-Panel veröffentlichen.
      es: >-
        Direcciones autorizadas a conectarse al C-Gate gestionado, para
        herramientas como C-Bus Toolkit. Déjelo vacío para permitir solo este
        add-on. C-Gate no tiene autenticación, y el nivel program permite
        reprogramar unidades C-Bus, así que indique direcciones específicas en
        lugar de una subred completa. Un octeto con el valor 255 coincide con
        cualquier valor, por lo que 192.168.1.255 significa toda la red
        192.168.1.x. También debe publicar los puertos de C-Gate en el panel de
        red.
      fr: >-
        Adresses autorisées à se connecter au C-Gate géré, pour des outils comme
        C-Bus Toolkit. Laissez vide pour n'autoriser que cet add-on. C-Gate n'a
        aucune authentification, et le niveau program permet de reprogrammer les
        unités C-Bus ; indiquez donc des adresses précises plutôt qu'un
        sous-réseau entier. Un octet avec la valeur 255 correspond à n'importe
        quelle valeur, donc 192.168.1.255 désigne l'ensemble du réseau
        192.168.1.x. Vous devez également publier les ports de C-Gate dans le
        panneau Réseau.
      it: >-
        Indirizzi autorizzati a connettersi al C-Gate gestito, per strumenti
        come C-Bus Toolkit. Lasciare vuoto per consentire solo questo add-on.
        C-Gate non ha autenticazione, e il livello program consente di
        riprogrammare le unità C-Bus, quindi elencare indirizzi specifici
        anziché un'intera sottorete. Un ottetto con valore 255 corrisponde a
        qualsiasi valore, quindi 192.168.1.255 indica l'intera rete 192.168.1.x.
        È inoltre necessario pubblicare le porte di C-Gate nel pannello Rete.
      nl: >-
        Adressen die verbinding mogen maken met de beheerde C-Gate, voor tools
        zoals C-Bus Toolkit. Laat leeg om alleen deze add-on toe te staan.
        C-Gate heeft geen authenticatie, en het niveau program staat
        herprogrammering van C-Bus-eenheden toe, dus geef specifieke adressen op
        in plaats van een heel subnet. Een octet met de waarde 255 komt overeen
        met elke waarde, dus 192.168.1.255 betekent het hele netwerk
        192.168.1.x. U moet ook de poorten van C-Gate publiceren in het
        netwerkpaneel.
      pt: >-
        Endereços autorizados a ligar-se ao C-Gate gerido, para ferramentas como
        o C-Bus Toolkit. Deixe vazio para permitir apenas este add-on. O C-Gate
        não tem autenticação, e o nível program permite reprogramar unidades
        C-Bus, por isso indique endereços específicos em vez de uma sub-rede
        inteira. Um octeto com o valor 255 corresponde a qualquer valor, pelo
        que 192.168.1.255 significa toda a rede 192.168.1.x. Também tem de
        publicar as portas do C-Gate no painel de Rede.
      ru: >-
        Адреса, которым разрешено подключаться к управляемому C-Gate, для таких
        инструментов, как C-Bus Toolkit. Оставьте пустым, чтобы разрешить доступ
        только этому дополнению. C-Gate не имеет аутентификации, а уровень
        program позволяет перепрограммировать устройства C-Bus, поэтому
        указывайте конкретные адреса, а не всю подсеть. Октет со значением 255
        соответствует любому значению, поэтому 192.168.1.255 означает всю сеть
        192.168.1.x. Также необходимо опубликовать порты C-Gate на панели сети.
      zh: >-
        允许连接到受管理 C-Gate 的地址，供 C-Bus Toolkit 等工具使用。留空则仅允许此附加组件访问。C-Gate 没有身份验证，且
        program 级别允许重新编程 C-Bus 单元，因此请列出具体地址而非整个子网。字节值为 255 时匹配任意值，例如
        192.168.1.255 表示整个 192.168.1.x 网络。您还必须在网络面板中发布 C-Gate 的端口。
      ja: >-
        C-Bus Toolkit などのツールのために、管理対象の C-Gate
        への接続を許可するアドレス。空のままにすると、このアドオンのみが許可されます。C-Gate には認証機能がなく、program レベルは
        C-Bus ユニットの再プログラムを許可するため、サブネット全体ではなく特定のアドレスを列挙してください。オクテットの値 255
        は任意の値に一致するため、192.168.1.255 はネットワーク 192.168.1.x 全体を意味します。また、ネットワークパネルで
        C-Gate のポートを公開する必要があります。
      ko: >-
        C-Bus Toolkit과 같은 도구를 위해 관리형 C-Gate에 연결할 수 있는 주소입니다. 비워두면 이 애드온만 허용됩니다.
        C-Gate에는 인증 기능이 없으며, program 수준은 C-Bus 장치의 재프로그래밍을 허용하므로 전체 서브넷이 아닌 특정
        주소를 나열하세요. 옥텟 값 255는 모든 값과 일치하므로 192.168.1.255는 전체 192.168.1.x 네트워크를
        의미합니다. 네트워크 패널에서 C-Gate의 포트도 게시해야 합니다.
      pl: >-
        Adresy, którym wolno łączyć się z zarządzanym C-Gate, dla narzędzi
        takich jak C-Bus Toolkit. Pozostaw puste, aby zezwolić tylko temu
        dodatkowi. C-Gate nie ma uwierzytelniania, a poziom program pozwala na
        przeprogramowanie jednostek C-Bus, więc podawaj konkretne adresy zamiast
        całej podsieci. Oktet o wartości 255 pasuje do dowolnej wartości, więc
        192.168.1.255 oznacza całą sieć 192.168.1.x. Musisz również opublikować
        porty C-Gate w panelu Sieć.
      sv: >-
        Adresser som tillåts ansluta till den hanterade C-Gate, för verktyg som
        C-Bus Toolkit. Lämna tomt för att endast tillåta detta tillägg. C-Gate
        saknar autentisering, och nivån program tillåter omprogrammering av
        C-Bus-enheter, så ange specifika adresser istället för ett helt subnät.
        En oktett med värdet 255 matchar vilket värde som helst, så
        192.168.1.255 betyder hela nätverket 192.168.1.x. Du måste också
        publicera C-Gates portar i nätverkspanelen.
      no: >-
        Adresser som får koble til den administrerte C-Gate, for verktøy som
        C-Bus Toolkit. La stå tomt for å bare tillate dette tillegget. C-Gate
        har ingen autentisering, og nivået program tillater omprogrammering av
        C-Bus-enheter, så oppgi spesifikke adresser i stedet for et helt
        subnett. En oktett med verdien 255 samsvarer med enhver verdi, så
        192.168.1.255 betyr hele nettverket 192.168.1.x. Du må også publisere
        C-Gates porter i nettverkspanelet.
      da: >-
        Adresser, der har tilladelse til at oprette forbindelse til den
        administrerede C-Gate, til værktøjer som C-Bus Toolkit. Lad stå tomt for
        kun at tillade denne add-on. C-Gate har ingen autentificering, og
        niveauet program tillader omprogrammering af C-Bus-enheder, så angiv
        specifikke adresser i stedet for et helt undernet. En oktet med værdien
        255 matcher enhver værdi, så 192.168.1.255 betyder hele netværket
        192.168.1.x. Du skal også udgive C-Gates porte i netværkspanelet.
      cs: >-
        Adresy, kterým je povoleno připojit se ke spravovanému C-Gate, pro
        nástroje jako C-Bus Toolkit. Ponechte prázdné, pokud chcete povolit
        pouze tento doplněk. C-Gate nemá žádné ověřování a úroveň program
        umožňuje přeprogramování jednotek C-Bus, proto uvádějte konkrétní adresy
        místo celé podsítě. Oktet s hodnotou 255 odpovídá jakékoli hodnotě,
        takže 192.168.1.255 znamená celou síť 192.168.1.x. Musíte také zveřejnit
        porty C-Gate v panelu Síť.
      uk: >-
        Адреси, яким дозволено підключатися до керованого C-Gate, для таких
        інструментів, як C-Bus Toolkit. Залиште порожнім, щоб дозволити доступ
        лише цьому додатку. C-Gate не має автентифікації, а рівень program
        дозволяє перепрограмування пристроїв C-Bus, тому вказуйте конкретні
        адреси, а не всю підмережу. Октет зі значенням 255 відповідає будь-якому
        значенню, тому 192.168.1.255 означає всю мережу 192.168.1.x. Також
        потрібно опублікувати порти C-Gate на панелі мережі.
