      zh: >-
        标签编辑器中写入操作的 API 密钥。在将端口 8080 暴露到 HA ingress 之外时设置此项。
      ja: >-
        ラベルエディタでの書き込み操作用の API キー。ポート 8080 を HA ingress 外に公開する場合に設定してください。
      ko: >-
        라벨 편집기의 쓰기 작업을 위한 API 키. 포트 8080을 HA ingress 외부에 노출할 때 설정하세요.
      pl: >-
        Klucz API dla operacji zapisu w edytorze etykiet. Ustaw gdy port 8080
        jest eksponowany poza HA ingress.
      sv: >-
        API-nyckel för skrivoperationer i etikettredigeraren. Ställ in när port
